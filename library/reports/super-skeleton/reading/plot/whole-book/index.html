险，反而让黑龙推导出抢劫既有敌人的效率。局部胜利引发雷神全团围捕，把故事从城市资源争夺推向生命禁区。沼泽既提供避难和秘银，又让黑龙遭遇武技强敌，付出黑二骨架粉碎的代价，转而保留俘虏作为教师。结尾以训练和装备升级暂缓追逃，却留下救赎、孩子意识、废弃国度等未解问题。关系变化来自现实依赖与资源互惠，尚未达到道德和解；黑龙的强大也始终受知识、技巧和伪装需求限制。</title></g><path d="M 904 956 H 1324" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><circle cx="904" cy="956" r="12" fill="#2563a6" stroke="white" stroke-width="3"/><path d="M 904 916 V 956 H 704 V 2054" stroke="#2563a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><path d="M 704 1077 H 728" stroke="#2563a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><circle cx="704" cy="1077" r="7" fill="#2563a6" stroke="white" stroke-width="3"/><g id="v01-e01" data-kind="event" data-volume="1" data-threads="" tabindex="0" role="button" aria-label="装死后吞魂凝心并创造十子"><rect x="728" y="1030" width="366" height="238" rx="14" fill="white" stroke="#cddaea"/><text x="746" y="1066" font-size="23" font-weight="400" fill="#2563a6" data-left="746" data-right="1076" data-bottom="1078">v01-e01 · 事实</text><text x="746" y="1119" font-size="30" font-weight="700" fill="#172b46" data-left="746" data-right="1076" data-bottom="1134">装死后吞魂凝心并创造</text><text x="746" y="1164" font-size="30" font-weight="700" fill="#172b46" data-left="746" data-right="1076" data-bottom="1179">十子</text><text x="746" y="1251" font-size="21" font-weight="400" fill="#51637a" data-left="746" data-right="1076" data-bottom="1262">主线转折 / 关系变化</text><title>黑龙保留自由活动时间，在残魂中获得能源并创造十名骷髅。

ch-0066 L8177–8214</title></g><path d="M 3544 642 V 704" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><g id="volume-07" data-volume="7" data-kind="volume"><rect x="3330" y="710" width="420" height="206" rx="14" fill="white" stroke="#b9cfe9"/><text x="3352" y="763" font-size="36" font-weight="700" fill="#172b46" data-left="3352" data-right="3728" data-bottom="781">07 / 信仰元力</text><text x="3352" y="821" font-size="29" font-weight="400" fill="#51637a" data-left="3352" data-right="3728" data-bottom="835">掌握元力，重订同伴与自由</text><text x="3352" y="864" font-size="29" font-weight="400" fill="#51637a" data-left="3352" data-right="3728" data-bottom="878">的边界</text><title>本集把求取力量的远征转化为对领导资格、资源成本和同伴关系的连续检验。魔法斧与无形置换把个人成长扩展为装备协作和批量制造，但制造消耗与关节弱点限制了优势。龙墓之行从轻易制服小骨龙升级为误判试探、群龙追杀，七具金属骷髅损失及黑七重伤迫使黑龙修正风险判断；他拒绝先知以自由为名提出的更危险交易。斯科特随后披露曾经隐瞒的战争史，把不死族的文明、压迫、衰败和灵魂依赖同时呈现，封存天使则成为理解信仰元力的知识来源。一个月的吸收没有立刻创造无敌君王，却使黑龙更清楚地感知关系所供给的力量与自身不足。斯文哥尔继续阻止扩军，终于引出黑龙对自由存在的明确宣言和同伴边界的重订；斯科特据此选择效忠。宏观战线上的同盟败亡又改变返程环境，教会追捕与新成长相撞。集末停在双方冲锋接触前，既留下战斗悬念，也保留自由追求是否会重演控制他者的主题张力。</title></g><path d="M 3544 956 H 3964" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><circle cx="3544" cy="956" r="12" fill="#2563a6" stroke="white" stroke-width="3"/><path d="M 3544 916 V 956 H 3344 V 2054" stroke="#2563a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><path d="M 3344 1077 H 3368" stroke="#2563a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><circle cx="3344" cy="1077" r="7" fill="#2563a6" stroke="white" stroke-width="3"/><g id="v07-e02" data-kind="event" data-volume="7" data-threads="" tabindex="0" role="button" aria-label="龙墓取骨转为损失撤退"><rect x="3368" y="1030" width="366" height="238" rx="14" fill="white" stroke="#cddaea"/><text x=" ch-0141 L17604–17638；ch-0141 L17646–17662</title></g><path d="M 6624 642 V 704" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><g id="volume-14" data-volume="14" data-kind="volume"><rect x="6410" y="710" width="420" height="206" rx="14" fill="white" stroke="#b9cfe9"/><text x="6432" y="763" font-size="36" font-weight="700" fill="#172b46" data-left="6432" data-right="6808" data-bottom="781">14 / 君王的传承</text><text x="6432" y="821" font-size="29" font-weight="400" fill="#51637a" data-left="6432" data-right="6808" data-bottom="835">获得记忆传承，回归时活尸</text><text x="6432" y="864" font-size="29" font-weight="400" fill="#51637a" data-left="6432" data-right="6808" data-bottom="878">计划待裁决</text><title>本集把个人继承与代理统治并排检验。黑龙经七月自我记忆回溯提升灵魂控制，进入遗迹却因不会飞行被遗漏，霍夫曼随即被君王分身灭魂。分身传授记忆而非力量，黑龙仍须通过跨位面行程和神骑战斗把知识练成能力；谢菲里安按位面守护职责承认其身份，使归途得以继续。叙事随后回叙外界三年三月的变局：先知用工程、财政、强制转生与军队使领地成为同盟的支柱，三次南征则不断改写双方优势。胜利收益与平民杀戮、俘虏劳死之间的裂缝，最终集中为塞茵全城活尸计划。斯文哥尔等人的异议不再只是战术分歧，而是临时管理者能否剥夺所有人生存与人格的权力问题。自然神和克丽丝借载体介入，黑龙在魂链恢复后归来，但只打断冲突；传承使命、分身余命、法阵处置和统治责任都尚未结算。材料适合学习能力分层、回叙压缩和组织冲突升级，同时须防止把叙述预告、人物预测及尚未发动的计划误记为既成事实。</title></g><path d="M 6624 956 H 7044" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><circle cx="6624" cy="956" r="12" fill="#2563a6" stroke="white" stroke-width="3"/><path d="M 6624 916 V 956 H 6424 V 2054" stroke="#2563a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><path d="M 6424 1077 H 6448" stroke="#2563a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><circle cx="6424" cy="1077" r="7" fill="#2563a6" stroke="white" stroke-width="3"/><g id="v14-e02" data-kind="event" data-volume="14" data-threads="1,8" tabindex="0" role="button" aria-label="开启遗迹、霍夫曼灭魂与分身传承"><rect x="6448" y="1030" width="366" height="238" rx="14" fill="white" stroke="#cddaea"/><text x="6466" y="1066" font-size="23" font-weight="400" fill="#2563a6" data-left="6466" data-right="6796" data-bottom="1078">v14-e02 · 事实</text><text x="6466" y="1119" font-size="30" font-weight="700" fill="#172b46" data-left="6466" data-right="6796" data-bottom="1134">开启遗迹、霍夫曼灭魂</text><text x="6466" y="1164" font-size="30" font-weight="700" fill="#172b46" data-left="6466" data-right="6796" data-bottom="1179">与分身传承</text><text x="6466" y="1251" font-size="21" font-weight="400" fill="#7850b5" data-left="6466" data-right="6796" data-bottom="1262">暗线 01 / 08</text><title>遗迹灾变中黑龙因不会飞行错失入口，霍夫曼被时间囚笼中的切罗曼尔分身灭魂。分身借烙印传法使黑龙自行抵达，授记忆而不授力量；两年传承细节由后文补述。

aea"/><text x="7346" y="1066" font-size="23" font-weight="400" fill="#2563a6" data-left="7346" data-right="7676" data-bottom="1078">v16-e03 · 事实</text><text x="7346" y="1119" font-size="30" font-weight="700" fill="#172b46" data-left="7346" data-right="7676" data-bottom="1134">四年期限与查跨世界方</text><text x="7346" y="1164" font-size="30" font-weight="700" fill="#172b46" data-left="7346" data-right="7676" data-bottom="1179">法的使命</text><text x="7346" y="1251" font-size="21" font-weight="400" fill="#7850b5" data-left="7346" data-right="7676" data-bottom="1262">暗线 08</text><title>黑龙制服赫米亚后，达罗亚自述只余四年、其旗下领主以上子民全亡，提出调查天使跨世界方法以找回大陆，并指向绝望高原；其最终夺体意图此时未告黑龙。

ch-0180 L21738–21798；ch-0180 L21829–21842</title></g><path d="M 7944 642 V 704" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><g id="volume-17" data-volume="17" data-kind="volume"><rect x="7730" y="710" width="420" height="206" rx="14" fill="white" stroke="#b9cfe9"/><text x="7752" y="763" font-size="36" font-weight="700" fill="#172b46" data-left="7752" data-right="8128" data-bottom="781">17 / 光与暗</text><text x="7752" y="821" font-size="29" font-weight="400" fill="#51637a" data-left="7752" data-right="8128" data-bottom="835">夺体逆转，假旗崩解，红月</text><text x="7752" y="864" font-size="29" font-weight="400" fill="#51637a" data-left="7752" data-right="8128" data-bottom="878">开启</text><title>本集把力量属性、社会名义与实际控制拆成三条互相错位的线。黑龙在达罗亚的吞噬压迫下形成混沌之灵，经哈力维亚传授适用战技，反过来吸收人工光明神格，成为能够收取光明信仰的不死君王。地下脱困并未让他同时获得全局情报：教皇已使安德鲁和光之神骑转生，冒用黑龙名义带领千万不死军，把军事威胁转化为恐惧、逃亡和宗教依附。先知因相信同族与名号而被卷进计划，同盟关系也因灾难预期破裂。读者则通过尼鲁达双灵格的密谈和历史回叙，先于黑龙知道光明三主神的旧帝国来源、分裂潜伏与借神格复起的布局。黑龙吞掉两名假统帅，只回收局部身份真相；千万尸军随之崩溃又被他操纵，产生新的战场连锁反应。卷末女天使重掌公正神格，以表演战斗诱导集体祈祷，再将暴增能量用于开启红月。通道显现是明确成果，大陆重临和诸方最终结局仍未发生；本集最有用的学习点是权力分拆、信息差驱动群体误判，以及能力进阶与人格连续性必须分别记账。</title></g><path d="M 7944 956 H 8364" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><circle cx="7944" cy="956" r="12" fill="#2563a6" stroke="white" stroke-width="3"/><path d="M 7944 916 V 956 H 7744 V 2332" stroke="#2563a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><path d="M 7744 1077 H 7768" stroke="#2563a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><circle cx="7744" cy="1077" r="7" fill="#2563a6" stroke="white" stroke-width="3"/><g id="v17-e02" data-kind="event" data-volume="17" data-threads="8" tabindex="0" role="button" aria-label="混沌之灵形成，达罗亚的夺体逆转"><rect x="7768" y="1030" width="366" height {"id": "book-0a05fa972401", "number": 1, "status": "partial", "volumes": [1, 2, 3, 8, 14, 18], "y": 3262, "question": "记忆所得如何改变选择，哪些能力仍不能继承？", "conclusion": "吞魂记忆能提供知识和技能线索，却不等于原力量、人格或所有理解自动继承。切罗曼尔记忆要经判断与试用，哈力传的是战技经验，终卷反向力及追踪付出受伤和失控风险后才能应用。此为跨阶段机制归纳，不据结尾推成所有能力已掌握或无上限。"}, {"id": "book-49e8bb5d0f08", "number": 2, "status": "open", "volumes": [1, 8], "y": 3406, "question": "氓族若得知阿罗约真实遭遇，联盟会如何改变？", "conclusion": "阿罗约与氓族的身份关系已确认，黑龙记忆上的亲近与隐瞒杀人事实同时成立。没有直接展示族长或族民得知死因后的反应，不能以后来奉誓或共同作战视作已知情谅解。"}, {"id": "book-c0fbac950b52", "number": 3, "status": "partial", "volumes": [1, 2, 8, 9], "y": 3550, "question": "祭坛遗产如何延续，帝国消失为何？", "conclusion": "沼泽遗迹的诅咒、图克诞生与旧领主守护记忆获得说明；后来揭示的是三君王、放逐大陆及帝国子民回归。两层历史不可凭同称不死国度直接等同，旧沼泽古国消失的完整因由仍未充分解释。"}, {"id": "book-9baae09a0d12", "number": 4, "status": "partial", "volumes": [2, 3, 5, 9, 10], "y": 3694, "question": "战魂能否真正炼化或可靠驾驭？", "conclusion": "第九集确定黑龙可限制坦克躯体行动，不能支配其战意；身体权限与人格炼化有别。后文没有给出战意完全服从或最终处置的直接结果，保留这项控制边界。"}, {"id": "book-e90db68cb625", "number": 5, "status": "partial", "volumes": [2, 6, 7, 8, 9, 10, 11, 13, 14, 16], "y": 3838, "question": "克丽丝是否能借黑龙和媒介摆脱封印？", "conclusion": "克丽丝冥月女神身份、封印、选择娜娜传承和萝茜代言陆续明确，终卷又交代她独立领悟、未参加当年放逐。没有直接写本体解封或后记个人去向；娜娜青春不能替代她本人获释的证据。"}, {"id": "book-6e1451b9badd", "number": 6, "status": "open", "volumes": [4, 5], "y": 3982, "question": "罗得早先如何逃过审判，何时转生？", "conclusion": "第五集相遇、后来的音乐发展和后记演奏都没有回答此处所问的旧次逃过审判方式与准确转生时点，因此保留open。后续生存和专长进展属其他问法，不能仅凭同一人物的新经历把本项旧案标为部分获答。"}, {"id": "book-09f441653222", "number": 7, "status": "partial", "volumes": [5, 6, 7, 8, 9, 10, 12, 15], "y": 4126, "question": "原萝茜能否整合残忆并自主运用借来力量？", "conclusion": "原萝茜苏醒、异源残忆与借克丽丝力量护墙都已呈现，旧恨和亲近并存。第七集降临天使意念被吞并不等于原萝茜人格与克丽丝合并，后记未点名她；记忆完全整合及最终生活仍保留未知。"}, {"id": "book-2c92e5ad3024", "number": 8, "status": "partial", "volumes": [5, 6, 7, 8, 10, 11, 12, 13, 14, 15, 16, 17, 18], "y": 4270, "question": "旧帝国及黑晶的来源与放逐后果怎样得到说明？", "conclusion": "三君王及放逐史、哈力与子民灵魂回归、黑晶为混沌之灵实体、残印被抹及切里莫造新本源陆续明确。起始之夜旧本源觉醒到爆炸的完整讲述被打断，切里莫口述不等独立证实的全部宇宙史；回归也不是物理大陆迁来。"}, {"id": "book-02ba45413b1e", "number": 9, "status": "partial", "volumes": [8, 11, 12, 13, 14, 15, 16, 17, 18], "y": 4414, "question": "信徒力量的分配与神祇代理权最终如何重组？", "conclusion": "受教会支配的天使可以作不同选择，三主神与尼鲁达双灵格的制度操作逐渐揭明。终卷补送枪机缘、虚设至高称号以及女灵格赠格改立的行为；教皇个人结局、改立的具体执行和完整新制度没有展示。"}, {"id": "book-c8d5d9e2b50a", "number": 10, "status": "open", "volumes": [9], "y": 4558, "question": "祈愿与死后凝聚魂火有何关系？", "conclusion": "临终祈愿与死后魂火凝聚相邻出现，黑龙也观察到异常，但没有直接说明特殊契约或具体信仰因果。不能用后期一般信仰机制自动补成老罗格这次现象的确切解释。"}, {"id": "book-be62d277e700", "number": 11, "status": "partial", "volumes": [9, 10, 11, 16, 18], "y": 4702, "question": "如何认主、吞魂制造傀儡，古主遗产何来？", "conclusion": "噬魂与达罗亚旧主关系、吞魂形成傀儡并进化、雷奥恢复神智均获后证。黑龙能复制枪却仍不能支配枪内傀儡；教皇借雷奥送枪布置机缘已明。武器完整流转链、所有傀儡人格记忆及最终权限并未全面解释。"}, {"id": "book-4f19b0c4054c", "number": 12, "status": "partial", "volumes": [10, 13, 14, 15, 16, 17, 18], "y": 4846, "question": "自然神的生存策略会付出什么道德和制度代价？", "conclusion": "自然神身份、媒介娜娜、保教合作与暗杀旧大长老的代价逐步显现；后记娜娜青春验证传承持续影响。不能据此补自然神本源全部转移、全部信徒自愿接受或政治后果已解决，早期本源与分身通路的疑点仍保留。"}, {"id": "book-442e53d9c11d", "number": 13, "status": "partial", "volumes": [15, 17, 18], "y": 4990, "question": "两独立灵格怎样面对共同历史与本源危机？", "conclusion": "教皇与迦莲娜躯内尼鲁达灵格已有独立人格，不能按共同来源合并。女灵格终卷交公正神格后削翼疲惫离开，教皇余寿没有直接结局；未显示二者复合、原天使人格恢复或二者后记去向。"}, {"id": "book-155fd141a183", "number": 14, "status": "resolved", "volumes": [16, 17], "y": 5134, "question": "谁把不死军团挂到黑龙名下，借此获取什么？", "conclusion": "教皇安排安德鲁与光冒用黑龙名义、尼鲁达双灵格收恐惧信仰已明确，两个假统帅被吞灭、旧控制瓦解。仅关闭现问的操盘者、执行者与获益目的；黑龙阵营此前真实平民杀戮、公众污名是否澄清及责任处置没有被后记共处消除，继续归入alliance-war-and-divine-power与church-institution-and-angel-agency的partial广线。"}, {"id": "book-3ec69c740e20", "number": 15, "status": "partial", "volumes": [17, 18], "y": 5278, "question": "制造者如何失去本源控制，黑龙能否阻止其吞噬世界？", "conclusion": "切里莫造本源求超脱却被吞灭有明确叙述；黑龙投入争夺意志，后记世界存续并醒返。没有展示内部胜负经过、切里莫所造本源的原有意识如何处置或黑龙最终权限，不能补成全机制解释或全能等级。"}], "thread_top": 3056, "stages": [[1, 3, "求生与同伴"], [4, 6, "照护与觉醒"], [7, 9, "自由与领地"], [10, 12, "海皇与龙岛"], [13, 15, "放逐与遗产"], [16, 17, "夺体与假旗"], [18, 18, "本源与归来"]], "event_top": 1030, "start": 680, "step": 440, "time_labels": {"v09-e05": "跨段  "圣柜密谈揭教皇与女天使同源分裂后各有独立灵格。历史回叙说明切里莫、尼鲁达、安克瓦斯曾造光明分身，联手放逐大陆，后来互相清除；尼假死分魂潜伏，安已被切消灭，净世军本为切留下的子民。", "title": "尼鲁达双灵格及三主神历史揭示"}, "v17-e07": {"characters": ["chr-9f2e5fcbba87455eb37e35869ea8854d", "chr-6c5caa9685ab4398b38fdff31ed8a6e5", "chr-18498ebcc9694896935e7cc590090228", "chr-4aafb8822bf64bb099f0e9abe3ae67c9"], "claim_kind": "fact", "evidence": [{"chapter_id": "ch-0191", "claim_kind": "fact", "end_line": 22820, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 22788}, {"chapter_id": "ch-0191", "claim_kind": "fact", "end_line": 22862, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 22821}, {"chapter_id": "ch-0192", "claim_kind": "fact", "end_line": 22874, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 22872}], "id": "v17-e07", "kind": "event", "knowledge": [{"belief": "两人旧身份、神骑老师与尼鲁达传承线索已知，但完整双灵格历史仍不清楚。", "observer": "chr-9f2e5fcbba87455eb37e35869ea8854d", "state": "knows"}], "narrative_order": 1707, "parent_id": "vol-17", "summary": "魂链恢复，黑龙到场否认假军归属；光与安德鲁亮出旧身份及尼鲁达名号后，被黑龙吞魂取忆。记忆确认女天使为神骑老师、教皇与尼传承有关，两人随后明确魂散。", "title": "黑龙归来吞灭假统帅，取得局部身份线索"}, "v17-e09": {"characters": ["chr-57d5ea137fa1427d885b62bd8378143c", "chr-fa5f928c72f34e6292fef0b12b0579e9", "chr-9f2e5fcbba87455eb37e35869ea8854d", "chr-45313c8f3c754bd9b2fbb3575e8bf435", "chr-4d337e033ff24db381f736c1da206aec"], "claim_kind": "fact", "evidence": [{"chapter_id": "ch-0192", "claim_kind": "fact", "end_line": 22945, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 22927}, {"chapter_id": "ch-0192", "claim_kind": "fact", "end_line": 22975, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9 te": "切里莫被吞及其构想明确；黑龙投入夺志后多年醒返与世界存续明确。具体胜利过程、本源原意识和黑龙最终权限不明，因此保留partial而非把后记推成机制全解。", "status": "partial", "title": "独立本源与超脱规则", "volume": 18}, {"audit_scope": "whole-book", "evidence": [{"chapter_id": "ch-0202", "end_line": 24349, "start_line": 24309}, {"chapter_id": "ch-0202", "end_line": 24396, "start_line": 24368}], "kind": "hidden", "question": "制造者如何失去本源控制，黑龙能否阻止其吞噬世界？", "resolution_note": "切里莫造本源求超脱却被吞灭有明确叙述；黑龙投入争夺意志，后记世界存续并醒返。没有展示内部胜负经过、切里莫所造本源的原有意识如何处置或黑龙最终权限，不能补成全机制解释或全能等级。", "status": "partial", "title": "独立本源与超脱规则", "volume": 18}]}}, "volumes": [{"claim_kind": "inference", "id": "vol-01", "kind": "volume", "narrative_order": 100, "parent_id": "story", "summary": "本集把一个战场消耗品变成具备资源、队伍和学习渠道的自主行动者。黑龙从反复被击碎的经验中选择装死，吞噬残魂后获得持续行动能力；他创造十个孩子，却没有解决缺少平等交流者的孤独。召唤事故迫使队伍进入人类冲突，佣兵的先验敌意与黑龙防止报信的生存逻辑互相升级，最终把敌人变成生命依附于他的巫妖伙伴。进入城市后，斯文哥尔试图以装备需求教授金钱与社会规则，但只传授收益和风险，反而让黑龙推导出抢劫既有敌人的效率。局部胜利引发雷神全团围捕，把故事从城市资源争夺推向生命禁区。沼泽既提供避难和秘银，又让黑龙遭遇武技强敌，付出黑二骨架粉碎的代价，转而保留俘虏作为教师。结尾以训练和装备升级暂缓追逃，却留下救赎、孩子意识、废弃国度等未解问题。关系变化来自现实依赖与资源互惠，尚未达到道德和解；黑龙的强大也始终受知识、技巧和伪装需求限制。", "title": "第一集 黄金骷髅"}, {"claim_kind": "inference", "id": "vol-02", "kind": "volume", "narrative_order": 200, "parent_id": "story", "summary": "本集把逃亡小队的生存问题扩展为组织政治与主体意识问题。沼泽训练并未让黑龙在纯武技上超越图克，他却学会用耐力、地形与变形能力重新定义胜利；红月激活古祭坛，又将失落文明的未知置于精灵信仰面前。救赎之魂消息使四名巫妖主动谋划雷神，黑龙则通过携魂潜行和召唤绕过围堵，并在斯文哥尔设计下借疾风的情报及合法名义反攻。营寨战中，为防身份曝光而屠杀见证者，包括非战斗侍从，显露其安全原则的残酷边界；坦克由狂暴战士变为战魂，黑龙只能把危险压进自身。黑大的技能与黑二的意识分别成长，证明力量进化与人格产生不是同一过程。阿罗约宝藏使记忆完整融合，带来财富和知识，却未复制魔力；财富通过悬赏及联盟打破三团平衡。克丽丝自称女神未被证实，娜娜则使黑龙首次明确感到怜惜。结尾保护者洛特死前托付未获答复，主角与人类生命的关系仍在变化中。", "title": "第二集 阿罗约的宝藏"}, {"claim_kind": "inference", "id": "vol-03", "kind": "volume", "narrative_order": 300, "parent_id": "story", "summary": "本集把灭敌与寻找同伴编成相互冲突的两条因果链。黑龙为娜娜转生洛特，见到以守护而非物种划分归属的选择；与此同时，斯文哥尔为取得救赎之魂，隐瞒真实目的，利用黑龙消除威胁的逻辑推动突袭朗克岭。敌方外围势力被联盟削弱，昂贵空间卷轴与不需呼吸的身体条件使水攻成为可能，偶然发现的密道却直通雷克丁卧室，把潜入转成几乎败北的近战。黑龙付出断臂、灵魂耗竭的代价，靠战魂拖延与阻断换气取胜。宝库中的圣物继而揭穿同伴欺骗，胜利即时转成关系危机：他第一次用共同记忆压住灭口本能，留下圣物并离开。斯文哥尔、爱琳随后主动回归，星月则因亲族义务选择救赎，星饮用后的圣焰只展示痛苦而未交代结局。黑龙赐予上千亡者长期灵魂，建立隐蔽领地，并通过黑二反哺理解自主与感谢。战后疾风试探、盟约争议及雷克丁的部族贡献，又将个人胜利接入更大的利益与伦理余波。", "title": "第三集 雷神覆灭"}, {"claim_kind": "inference", "id": "vol-04", "kind": "volume", "narrative_order": 400, "parent_id": "story", "summary": "本集将私人安顿计划置于宗教战争的扩张中。黑龙坦白娜娜父母死讯造成伤害，借克丽丝的类比初识悲痛，再以灵魂交流和寻找遗体的承诺修复；照护因而同时打开了新的能力与长期责任。第八次圣战以天使献祭打破要塞平衡，战争造成钢材短缺，原本富有的队伍也只能为实物报酬护送海图家族女儿。旅程中亡灵印记传出北方召归讯息，死士袭击则暴露雇主背景未明、团队感知沟通不足和伪装成本。返程的泰戈误认黑大为父亲，引出骨架来源猜想及黑大自发行为，但意识尚未完成觉醒；阿玛之死又使复活能力受到生活后果的质问。绝幽谷刚开始建设，追捕娜娜的萝茜便到来。她既受宗教成见支配，也有责任与审美触动；罗得宾士假死式脱险先展示其认知局限。最终不死身份在近战中暴露，双方以各自专长互相克制。黑龙救黑七而引火上身，岗撒罗斯以生命救萝茜，两组救援让敌我同有不可替代的同伴；战局与数条旧悬念仍留待后集。", "title": "第四集 亡灵印记"}, {"claim_kind": "inference", "id": "vol-05", "kind": "volume", "narrative_order": 500, "parent_id": "story", "summary": "本集把上一集的身份暴露危机转化为主动寻找力量的远征。黑龙救回黑七后以假死和人质突围，杀死萝茜，却因灵魂透支失去行动能力，团队也暴露出对唯一指挥中心的依赖。星的救赎实验失败迫使旧同伴重新谈判归属：黑龙为现有同伴的情感而救人，同时明确不接受欺骗。教会另以萝茜身体完成天使降临，读者先于主角看见报复力量升级。北行路上，扫匪和歼灭帝国游骑为黑龙补充灵魂，也被社会宣传成英雄事迹，形成动机与公共形象的持续错位。罗得宾士的加入同时扩充知识、生活趣味与伦理争执，使同伴关系没有因归队而变成无条件认同。进入死亡沙漠后，日常补给和身体差异转为真实生存成本；黑龙以身体组成避风墙，并在能量极限中进化。结尾用幽暗幻界解决眼前危机，又以沙下骸骨和教皇辨认悼亡之魂，打开历史与阵营双重悬念。", "title": "第五集 生命禁区"}, {"claim_kind": "inference", "id": "vol-06", "kind": "volume", "narrative_order": 600, "parent_id": "story", "summary": "本集把黑龙的力量升级改写为认知、技术和归属的三重学习。泰戈生病触发黑大主动发言与身份确认，独立意识终于明确；转生解决了远征体质问题，却把替他人决定命运的伦理矛盾留在队伍内部。与此同时，身份情报传至疾风和同盟，利益与既有合作使排斥不再自动等于开战。两月跋涉后，黑龙抵达哀嚎森林，先因不理解当地亡灵和灵魂沟通方式发生冲突，再因共同面对降临天使而进入亡者国度。天使强大却受人体、世界规则和自身傲慢限制；黑龙则在挨打中从灵魂之剑推导灵魂之甲。斯科特封印天使、解明亡灵印记和部分历史，但也承认黑龙的快速进化超出传承知识。罗得的安魂音乐提供纯力量无法替代的安宁，重新证明伙伴的价值。末尾十个孩子获得战斗武装，原萝茜残灵补魂后苏醒却失忆，力量成长没有抹去旧杀戮留下的关系债。", "title": "第六集 悼亡之主"}, {"claim_kind": "inference", "id": "vol-07", "kind": "volume", "narrative_order": 700, "parent_id": "story", "summary": "本集把求取力量的远征转化为对领导资格、资源成本和同伴关系的连续检验。魔法斧与无形置换把个人成长扩展为装备协作和批量制造，但制造消耗与关节弱点限制了优势。龙墓之行从轻易制服小骨龙升级为误判试探、群龙追杀，七具金属骷髅损失及黑七重伤迫使黑龙修正风险判断；他拒绝先知以自由为名提出的更危险交易。斯科特随后披露曾经隐瞒的战争史，把不死族的文明、压迫、衰败和灵魂依赖同时呈现，封存天使则成为理解信仰元力的知识来源。一个月的吸收没有立刻创造无敌君王，却使黑龙更清楚地感知关系所供给的力量与自身不足。斯文哥尔继续阻止扩军，终于引出黑龙对自由存在的明确宣言和同伴边界的重订；斯科特据此选择效忠。宏观战线上的同盟败亡又改变返程环境，教会追捕与新成长相撞。集末停在双方冲锋接触前，既留下战斗悬念，也保留自由追求是否会重演控制他者的主题张力。", "title": "第七集 信仰元力"}, {"claim_kind": "inference", "id": "vol-08", "kind": "volume", "narrative_order": 800, "parent_id": "story", "summary": "本集先兑现上集的战前悬念：黑龙以空中牵制和同步绕行打破盾墙部署，新武装也确实改变圣力克制关系；雷奥随后救主教并杀死己方幸存者，把阵营秘密置于骑士生命之上。与死亡骑士和火焰马的交锋又揭出新成长的限度，黑龙靠夺械、耐打和牵制伙伴取胜，却因护子愤怒失去俘虏，黑四必须更换脆弱上身。返程中的独立情报与采购困境，将斯文缺席的实际作用显出。救援氓族时，黑龙调动不同兵种逼退菲力普，继承的阿罗约记忆则把偶然相救转为身份与历史交会；他隐瞒杀害阿罗约的事实，接受族长的生存委托。氓族祖先由亡灵逆转成人的秘密，打开生命形式可变的新规则，也引出谁能决定族群未来的问题。族长杀死异议者、强迫入沼，黑龙继而镇压反抗并收魂，保护与屠戮由同一行动相连。后场揭示教会保留敌手的组织利益及斯科特隔离人类价值影响的意图。结尾祭坛修复并限量启动，转生结果与新声音仍未揭晓，萝茜的自我重建也只是开始。", "title": "第八集 暗之神骑"}, {"claim_kind": "inference", "id": "vol-09", "kind": "volume", "narrative_order": 900, "parent_id": "story", "summary": "本集把不死势力的扩张从个人战力推进到人口、资源与制度。祭坛重启回收了旧领主遗志和图克的守护本能，但三千余灵魂的转生同时暴露身份混杂、弱魂适应与强迫效忠的问题。黑龙为自由而聚力，却通过消灭拒绝者确保服从；斯文哥尔失去指导权后，凭生产和规划重新取得实际位置。钢材瓶颈促成对外交易，龙墓方面则以更高的承诺重开谈判。采集尸骨的远行又让私人扩军与公共救民偶然重合，民间随后把不同动机加工为英雄传奇。黑龙在尸坑中从解决搬运困难意外摸索出皇者驾临，随即因一次赋魂六千而耗竭，必须依靠同伴和子民元力维持存在。醒来后的坦克脱困让旧内患取得身体可控、意念未控的有限进展。末尾的建设讨论与泰戈苏醒继续把成长导向组织与个体的多重改变；教皇、菲力普和雷奥各自的保留态度，仍使外部威胁充满认知差。", "title": "第九集 皇者驾临"}, {"claim_kind": "inference", "id": "vol-10", "kind": "volume", "narrative_order": 1000, "parent_id": "story", "summary": "本集持续检验力量与运用条件的差别。普通军官的伏击虽然最终失败，却毁掉黑龙的整批坐骑并使他再次透支，迫使他正视地形、经验与储备。皇者驾临开始可以教学，领地也形成规模；雷奥却借假降近身，证明防卫数量并不能代替对秘法的理解。噬魂因同源亲和而未能伤及悼亡之魂，雷奥死亡及死息傀儡生成揭示武器的新价值，同时保留教皇赐枪的意图。龙岛远征随之启动，但森林矮人的加速成长与巨树强迫信仰提供一条主角尚不知全貌的支线。夺取航海技能采用杀人转生和拘魂威胁，暴露主角阵营扩张的代价；不死之身消除补给需求，也不能消除航海知识和心理需求。海战再次让环境推翻战力直觉，主角赢得生存却损失亡灵法师。海底偶遇使克丽丝从远程谈话者推进为降临行动者，她解释观察联系与神的社会起源，萝茜付出身体改造和能量代价破除外层封印。结尾仍留内层封魂结构与未知声音，海皇营救尚未完成。", "title": "第十集 噬魂的秘密"}, {"claim_kind": "inference", "id": "vol-11", "kind": "volume", "narrative_order": 1100, "parent_id": "story", "summary": "本集把解救神明、力量升级和侵入龙岛连接成一条不断改变关系的行动链。海皇获释后企图夺取黑龙躯体，使克丽丝的引荐变成信任危机；黑龙先借十孩供力和同伴掩护凝成真武装，再吞噬海皇、以多目标分流避免爆体，仍付出躯体破碎及部属伤亡；孩子们消化分流所得后才获真武装。胜利之后，他理解斯科特保族的责任，同时撤回对克丽丝的帮助承诺，迫使后者把脱困希望转向娜娜。海蛇转生又将消耗性的升级转为远征资源，然而龙岛并非单纯的取宝地点：龙族生育危机、龙人的受限生活和龙皇的利用计划使来客面对复杂社会。斯文通过战术与装备重新发挥作用，黑大以投枪显示独立创造；黑龙的群体力量仍会因缺飞行、协调和情报而付出高昂代价。结尾在龙人败势中出现祈祷引来的未知力量，既延续信仰元力主题，也 : "第十五集 泰坦骷髅"}, {"claim_kind": "inference", "id": "vol-16", "kind": "volume", "narrative_order": 1600, "parent_id": "story", "summary": "本集先把君王归来写成战争转折，再拆解归来者值得信任的假设。达罗亚借红月信仰强降，噬魂枪使雷奥恢复意识；菲力普逃走、弗里昂战死，绝望祷言迫黑龙保护魅，也由达罗亚暂时承担君王责任。光明神格的慢性消融解释了旧王死亡和新来者的期限，却未让黑龙意识到自己正是对方需要的魂力、躯体与势力来源。自然神以神谕维护联盟并杀旧长老，先知以俘虏政策换合作，显示同盟持续依赖权力与利益。高原探路骗局将黑龙封入自身头颅，军事优势也无法替代对领袖安全的保障。一个多月的拉锯使他学会凝炼能量，却被达罗亚献祭五十多万自身子民取得的力量压倒。哈力维亚的愤怒与无奈、娜娜的质问和魅冒险保护朋友的选择，让保护、服从与利用出现多种答案。末尾黑龙紧缩灵魂后被两王感知为异常，混沌之灵只完成悬念揭示，未给脱困结果；教皇对安德鲁实施不死献祭，又把教会身份与实际行动的裂缝留给后文。", "title": "第十六集 君王回归"}, {"claim_kind": "inference", "id": "vol-17", "kind": "volume", "narrative_order": 1700, "parent_id": "story", "summary": "本集把力量属性、社会名义与实际控制拆成三条互相错位的线。黑龙在达罗亚的吞噬压迫下形成混沌之灵，经哈力维亚传授适用战技，反过来吸收人工光明神格，成为能够收取光明信仰的不死君王。地下脱困并未让他同时获得全局情报：教皇已使安德鲁和光之神骑转生，冒用黑龙名义带领千万不死军，把军事威胁转化为恐惧、逃亡和宗教依附。先知因相信同族与名号而被卷进计划，同盟关系也因灾难预期破裂。读者则通过尼鲁达双灵格的密谈和历史回叙，先于黑龙知道光明三主神的旧帝国来源、分裂潜伏与借神格复起的布局。黑龙吞掉两名假统帅，只回收局部身份真相；千万尸军随之崩溃又被他操纵，产生新的战场连锁反应。卷末女天使重掌公正神格，以表演战斗诱导集体祈祷，再将暴增能量用于开启红月。通道显现是明确成果，大陆重临和诸方最终结局仍未发生；本集最有用的学习点是权力分拆、信息差驱动群体误判，以及能力进阶与人格连续性必须分别记账。", "title": "第十七集 光与暗"}, {"claim_kind": "inference", "id": "vol-18", "kind": "volume", "narrative_order": 1800, "parent_id": "story", "summary": "终卷先兑现哈力维亚及大批子民回归，再将旧敌切里莫的布局扩展到跨位面的生命掠夺。龙人逃亡接通深渊统一线，黑龙在可控试战中摸清混沌之灵的转化与再生能力，以投影残片反追幕后者，却仍须哈力维亚救援。战场随后分为两个尺度：地面军队用组织、增援和音乐魔法抵抗入侵，虚无中的三名强者则追查本源。罗得宾士从被轻视的乐师变为关键战力，但约十五万魔物的死亡又使本源增强，把局部胜利反接到全局危险。切里莫想借造物超脱规则，却被已具独立意志的本源吞噬；黑龙获得遗留信息后，托付子民烙印、接受公正神格，以保护自由存在和具体同伴为理由投入没有胜算的意志争夺。结尾省略争夺与治理过程，用多年后的交通、市场和多族交往展示结果，再让黑龙重获形体。其优势是日常细节回收宏大主题；限制是若干人物、阵法与制度线没有逐项交代，不能把终局和平视为所有支线均已闭合。", "title": "第十八集 自由的世界"}], "edges": {"cross-memory-01": {"claim_kind": "fact", "evidence": [{"chapter_id": "ch-0006", "claim_kind": "fact", "end_line": 327, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 293}, {"chapter_id": "ch-0021", "claim_kind": "fact", "end_line": 2357, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", function select(id,focus=false){
 clear();const el=document.getElementById(id);if(!el)return;el.classList.add('selected');
 if(data.nodes[id]){const n=data.nodes[id],pos=data.meta.positions[id];detail(n.title,`${id} · ${claims[n.claim_kind]||'研究记录'}${data.meta.time_labels[id]?' · '+data.meta.time_labels[id]:''}`,n.summary+'\n\n'+(n.knowledge||[]).map(k=>`${data.observers[k.observer]||'未注明观察者'} · ${knowledgeStates[k.state]||k.state}：${k.belief}`).join('\n'),evidence(n.evidence));if(focus)fitRect(pos.x-100,pos.y-85,pos.width+200,pos.height+170);}
 else if(data.threads[id]){const t=data.threads[id],no=data.meta.threads.find(x=>x.id===id).number;svg.querySelectorAll('[data-kind=event]').forEach(e=>{if(!e.dataset.threads.split(',').includes(String(no)))e.classList.add('dim')});svg.querySelectorAll('[data-kind=thread]').forEach(e=>{if(e.id!==id)e.classList.add('dim')});detail(t.title,`暗线${String(no).padStart(2,'0')} · `+({resolved:'已回收',partial:'部分回收',open:'未回收'}[t.status]),t.question+'\n\n'+t.resolution_note);document.getElementById('notice').textContent='已聚焦暗线 '+String(no).padStart(2,'0')+'；放大或拖动查看同编号事件';}
 else if(id.startsWith('bridge-')){const bridge=data.meta.bridges.find(x=>x.number===Number(id.slice(-2))),e=data.edges[bridge.id];detail('B'+String(bridge.number).padStart(2,'0')+' · '+bridge.label,`${e.from} → ${e.to} · ${claims[e.claim_kind]||'研究记录'}`,e.label,evidence(e.evidence));}
}
document.getElementById('fit').onclick=fit;
document.getElementById('mainline').onclick=()=>fitRect(0,0,data.meta.width,data.meta.thread_top-50);
document.getElementById('threads').onclick=()=>fitRect(0,data.meta.thread_top-70,data.meta.width,data.meta.height-data.meta.thread_top+70);
document.getElementById('plus').onclick=()=>zoom(1.4);document.getElementById('minus').onclick=()=>zoom(1/1.4);
document.getElementById('clear').onclick=clear;
document.getElementById('close').onclick=()=>panel.classList.remove('open');
const volume=document.getElementById('volume');data.volumes.forEach((v,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=v.title;volume.append(o)});
volume.onchange=()=>{if(!volume.value)return;clear();panel.classList.remove('open');const v=Number(volume.value);fitRect(data.meta.start+(v-1)*data.meta.step-20,670,data.meta.step+40,1800);};
function find(){const term=document.getElementById('search').value.trim();if(!term)return;const matches=Object.values(data.nodes).filter(n=>(n.title+' '+n.summary).includes(term));if(!matches.length){document.getElementById('notice').textContent='本图精选事件中未找到：'+term;return;}if(query!==term){query=term;matchIndex=0;}const n=matches[matchIndex%matches.length];select(n.id,true);document.getElementById('notice').textContent=`${matchIndex%matches.length+1}/${matches.length}：再次查找可跳到下一项`;matchIndex++;}
document.getElementById('find').onclick=find;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')find()};
vp.addEventListener('wheel',e=>{e.preventDefault();const b=vp.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-b.left,e.clientY-b.top)},{passive:false});
// 超过拖动阈值后才捕获指针，普通点击仍交给事件卡片。
vp.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,tx,ty};dragged=false;vp.classList.add('drag')});
vp.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){dragged=true;vp.setPointerCapture(e.pointerId)}tx=drag.tx+dx;ty=drag.ty+dy;apply()});
vp.addEventListener('pointerup',e=>{drag=null;vp.classList.remove('drag');if(vp.hasPointerCapture(e.pointerId))vp.releasePointerCapture(e.pointerId)});
vp.addEventListener('pointercancel',()=>{drag=null;vp.classList.remove('drag')});
svg.addEventListener('click',e=>{if(dragged)return;const g=e.target.closest('[data-kind]');if(g)select(g.id)});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('[data-kind]');if(g){e.preventDefault();select(g.id,true)}}});
vp.addEventListener('dblclick',e=>{if(!e.target.closest('[data-kind]'))fit()});
window.addEventListener('resize',fit);document.fonts.ready.then(fit);
</script></body></html>

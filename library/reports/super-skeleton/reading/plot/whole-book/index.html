or": "v05-e05", "conclusion": "第五集相遇、后来的音乐发展和后记演奏都没有回答此处所问的旧次逃过审判方式与准确转生时点，因此保留open。后续生存和专长进展属其他问法，不能仅凭同一人物的新经历把本项旧案标为部分获答。"}, {"id": "book-09f441653222", "number": 7, "status": "partial", "anchor": "v15-e07", "conclusion": "原萝茜苏醒、异源残忆与借克丽丝力量护墙都已呈现，旧恨和亲近并存。第七集降临天使意念被吞并不等于原萝茜人格与克丽丝合并，后记未点名她；记忆完全整合及最终生活仍保留未知。"}, {"id": "book-2c92e5ad3024", "number": 8, "status": "partial", "anchor": "v18-e08", "conclusion": "三君王及放逐史、哈力与子民灵魂回归、黑晶为混沌之灵实体、残印被抹及切里莫造新本源陆续明确。起始之夜旧本源觉醒到爆炸的完整讲述被打断，切里莫口述不等独立证实的全部宇宙史；回归也不是物理大陆迁来。"}, {"id": "book-02ba45413b1e", "number": 9, "status": "partial", "anchor": "v18-e09", "conclusion": "受教会支配的天使可以作不同选择，三主神与尼鲁达双灵格的制度操作逐渐揭明。终卷补送枪机缘、虚设至高称号以及女灵格赠格改立的行为；教皇个人结局、改立的具体执行和完整新制度没有展示。"}, {"id": "book-c8d5d9e2b50a", "number": 10, "status": "open", "anchor": "v09-e05", "conclusion": "临终祈愿与死后魂火凝聚相邻出现，黑龙也观察到异常，但没有直接说明特殊契约或具体信仰因果。不能用后期一般信仰机制自动补成老罗格这次现象的确切解释。"}, {"id": "book-be62d277e700", "number": 11, "status": "partial", "anchor": "v18-e05", "conclusion": "噬魂与达罗亚旧主关系、吞魂形成傀儡并进化、雷奥恢复神智均获后证。黑龙能复制枪却仍不能支配枪内傀儡；教皇借雷奥送枪布置机缘已明。武器完整流转链、所有傀儡人格记忆及最终权限并未全面解释。"}, {"id": "book-4f19b0c4054c", "number": 12, "status": "partial", "anchor": "v18-e09", "conclusion": "自然神身份、媒介娜娜、保教合作与暗杀旧大长老的代价逐步显现；后记娜娜青春验证传承持续影响。不能据此补自然神本源全部转移、全部信徒自愿接受或政治后果已解决，早期本源与分身通路的疑点仍保留。"}, {"id": "book-442e53d9c11d", "number": 13, "status": "partial", "anchor": "v18-e08", "conclusion": "教皇与迦莲娜躯内尼鲁达灵格已有独立人格，不能按共同来源合并。女灵格终卷交公正神格后削翼疲惫离开，教皇余寿没有直接结局；未显示二者复合、原天使人格恢复或二者后记去向。"}, {"id": "book-155fd141a183", "number": 14, "status": "resolved", "anchor": "v17-e09", "conclusion": "教皇安排安德鲁与光冒用黑龙名义、尼鲁达双灵格收恐惧信仰已明确，两个假统帅被吞灭、旧控制瓦解。仅关闭现问的操盘者、执行者与获益目的；黑龙阵营此前真实平民杀戮、公众污名是否澄清及责任处置没有被后记共处消除，继续归入alliance-war-and-divine-power与church-institution-and-angel-agency的partial广线。"}, {"id": "book-3ec69c740e20", "number": 15, "status": "partial", "anchor": "v18-e09", "conclusion": "切里莫造本源求超脱却被吞灭有明确叙述；黑龙投入争夺意志，后记世界存续并醒返。没有展示内部胜负经过、切里莫所造本源的原有意识如何处置或黑龙最终权限，不能补成全机制解释或全能等级。"}], "roots": ["v01-e01", "v01-e10", "v03-e02", "v04-e01", "v04-e02", "v04-e04", 、哈力、尼女协作导引，哈力与大批子民进入物质位面；互开灵魂确立信任，双方拟演退兵以换西北至死亡沙漠领地。没有把物理大陆整体迁来。", "title": "哈力及子民跨界归来"}, "v18-e02": {"characters": ["chr-5aeff1d849534cdf80251105e5c44e7a", "chr-4355fd0bfe034913a4c320006ef7678b", "chr-9f2e5fcbba87455eb37e35869ea8854d", "chr-8aa753f481f04f0181e7bee412fb68f8", "chr-57d5ea137fa1427d885b62bd8378143c"], "claim_kind": "fact", "evidence": [{"chapter_id": "ch-0196", "claim_kind": "fact", "end_line": 23321, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 23290}, {"chapter_id": "ch-0197", "claim_kind": "fact", "end_line": 23374, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 23325}], "id": "v18-e02", "kind": "event", "knowledge": [{"belief": "已知深渊大部归大巫，自己的族群惨失后回归。", "observer": "chr-5aeff1d849534cdf80251105e5c44e7a", "state": "knows"}, {"belief": "大巫是切里莫另一个经营方向。", "observer": "chr-9f2e5fcbba87455eb37e35869ea8854d", "state": "suspects"}], "narrative_order": 1802, "parent_id": "vol-18", "summary": "帝勒说明族群因生计迁深渊、遭统一军队侵略后不足两千返回，自己与龙皇被追兵逼至黑龙处。深渊大巫身份此时主要由尼女判断。", "title": "龙人失踪的去向与追兵"}, "v18-e03": {"characters": ["chr-9f2e5fcbba87455eb37e35869ea8854d", "chr-8aa753f481f04f0181e7bee412fb68f8", "chr-6e4a70b72af34722b670d0c84b4f9bb9"], "claim_kind": "fact", "evidence": [{"chapter_id": "ch-0197", "claim_kind": "fact", "end_line": 23432, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 23385}, {"chapter_id": "ch-0197", "claim_kind": "fact", "end_line": 23517, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 23450}, {"chapter_id": "ch-0198", "claim_kind": "fact", "end_line": 23619, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c 战后疾风试探、盟约争议及雷克丁的部族贡献，又将个人胜利接入更大的利益与伦理余波。", "title": "第三集 雷神覆灭"}, {"claim_kind": "inference", "id": "vol-04", "kind": "volume", "narrative_order": 400, "parent_id": "story", "summary": "本集将私人安顿计划置于宗教战争的扩张中。黑龙坦白娜娜父母死讯造成伤害，借克丽丝的类比初识悲痛，再以灵魂交流和寻找遗体的承诺修复；照护因而同时打开了新的能力与长期责任。第八次圣战以天使献祭打破要塞平衡，战争造成钢材短缺，原本富有的队伍也只能为实物报酬护送海图家族女儿。旅程中亡灵印记传出北方召归讯息，死士袭击则暴露雇主背景未明、团队感知沟通不足和伪装成本。返程的泰戈误认黑大为父亲，引出骨架来源猜想及黑大自发行为，但意识尚未完成觉醒；阿玛之死又使复活能力受到生活后果的质问。绝幽谷刚开始建设，追捕娜娜的萝茜便到来。她既受宗教成见支配，也有责任与审美触动；罗得宾士假死式脱险先展示其认知局限。最终不死身份在近战中暴露，双方以各自专长互相克制。黑龙救黑七而引火上身，岗撒罗斯以生命救萝茜，两组救援让敌我同有不可替代的同伴；战局与数条旧悬念仍留待后集。", "title": "第四集 亡灵印记"}, {"claim_kind": "inference", "id": "vol-05", "kind": "volume", "narrative_order": 500, "parent_id": "story", "summary": "本集把上一集的身份暴露危机转化为主动寻找力量的远征。黑龙救回黑七后以假死和人质突围，杀死萝茜，却因灵魂透支失去行动能力，团队也暴露出对唯一指挥中心的依赖。星的救赎实验失败迫使旧同伴重新谈判归属：黑龙为现有同伴的情感而救人，同时明确不接受欺骗。教会另以萝茜身体完成天使降临，读者先于主角看见报复力量升级。北行路上，扫匪和歼灭帝国游骑为黑龙补充灵魂，也被社会宣传成英雄事迹，形成动机与公共形象的持续错位。罗得宾士的加入同时扩充知识、生活趣味与伦理争执，使同伴关系没有因归队而变成无条件认同。进入死亡沙漠后，日常补给和身体差异转为真实生存成本；黑龙以身体组成避风墙，并在能量极限中进化。结尾用幽暗幻界解决眼前危机，又以沙下骸骨和教皇辨认悼亡之魂，打开历史与阵营双重悬念。", "title": "第五集 生命禁区"}, {"claim_kind": "inference", "id": "vol-06", "kind": "volume", "narrative_order": 600, "parent_id": "story", "summary": "本集把黑龙的力量升级改写为认知、技术和归属的三重学习。泰戈生病触发黑大主动发言与身份确认，独立意识终于明确；转生解决了远征体质问题，却把替他人决定命运的伦理矛盾留在队伍内部。与此同时，身份情报传至疾风和同盟，利益与既有合作使排斥不再自动等于开战。两月跋涉后，黑龙抵达哀嚎森林，先因不理解当地亡灵和灵魂沟通方式发生冲突，再因共同面对降临天使而进入亡者国度。天使强大却受人体、世界规则和自身傲慢限制；黑龙则在挨打中从灵魂之剑推导灵魂之甲。斯科特封印天使、解明亡灵印记和部分历史，但也承认黑龙的快速进化超出传承知识。罗得的安魂音乐提供纯力量无法替代的安宁，重新证明伙伴的价值。末尾十个孩子获得战斗武装，原萝茜残灵补魂后苏醒却失忆，力量成长没有抹去旧杀戮留下的关系债。", "title": "第六集 悼亡之主"}, {"claim_kind": "inference", "id": "vol-07", "kind": "volume", "narrative_order": 700, "parent_id": "story", "summary": "本集把求取力量的远征转化为对领导资格、资源成本和同伴关系的连续检验。魔法斧与无形置换把个人成长扩展为装备协作和批量制造，但制造消耗与关节弱点限制了优势。龙墓之行从轻易制服小骨龙升级为误判试探、群龙追杀，七具金属骷髅损失及黑七重伤迫使黑龙修正风险判断；他拒绝先知以自由为名提出的更危险交易。斯科特随后披露曾经隐瞒的战争史，把不死族的文明、压迫、衰败和灵魂依赖同时呈现，封存天使则成为理解信仰元力的知识来源。一个月的吸收没有立刻创造无敌君王，却使黑龙更清楚地感知关系所供给的力量与自身不足。斯文哥尔继续阻止扩军，终于引出黑龙对自由存在的明确宣言和同伴边界的重订；斯科特据此选择效忠。宏观战线上的同盟败亡又改变返程环境，教会追捕与新成长相撞。集末停在双方冲锋接触前，既留下战斗悬念，也保留自由追求是否会重演控制他者的主题张力。", "title": "第七集 信仰元力"}, {"claim_kind": "inference", "id": "vol-08", "kind": "volume", "narrative_order": 800, "parent_id": "story", "summary": "本集先兑现上集的战前悬念：黑龙以空中牵制和同步绕行打破盾墙部署，新武装也确实改变圣力克制关系；雷奥随后救主教并杀死己方幸存者，把阵营秘密置于骑士生命之上。与死亡骑士和火焰马的交锋又揭出新成长的限度，黑龙靠夺械、耐打和牵制伙伴取胜，却因护子愤怒失去俘虏，黑四必须更换脆弱上身。返程中的独立情报与采购困境，将斯文缺席的实际作用显出。救援氓族时，黑龙调动不同兵种逼退菲力普，继承的阿罗约记忆则把偶然相救转为身份与历史交会；他隐瞒杀害阿罗约的事实，接受族长的生存委托。氓族祖先由亡灵逆转成人的秘密，打开生命形式可变的新规则，也引出谁能决定族群未来的问题。族长杀死异议者、强迫入沼，黑龙继而镇压反抗并收魂，保护与屠戮由同一行动相连。后场揭示教会保留敌手的组织利益及斯科特隔离人类价值影响的意图。结尾祭坛修复并限量启动，转生结果与新声音仍未揭晓，萝茜的自我重建也只是开始。", "title": "第八集 暗之神骑"}, {"claim_kind": "inference", "id": "vol-09", "kind": "volume", "narrative_order": 900, "parent_id": "story", "summary": "本集把不死势力的扩张从个人战力推进到人口、资源与制度。祭坛重启回收了旧领主遗志和图克的守护本能，但三千余灵魂的转生同时暴露身份混杂、弱魂适应与强迫效忠的问题。黑龙为自由而聚力，却通过消灭拒绝者确保服从；斯文哥尔失去指导权后，凭生产和规划重新取得实际位置。钢材瓶颈促成对外交易，龙墓方面则以更高的承诺重开谈判。采集尸骨的远行又让私人扩军与公共救民偶然重合，民间随后把不同动机加工为英雄传奇。黑龙在尸坑中从解决搬运困难意外摸索出皇者驾临，随即因一次赋魂六千而耗竭，必须依靠同伴和子民元力维持存在。醒来后的坦克脱困让旧内患取得身体可控、意念未控的有限进展。末尾的建设讨论与泰戈苏醒继续把成长导向组织与个体的多重改变；教皇、菲力普和雷奥各自的保留态度，仍使外部威胁充满认知差。", "title": "第九集 皇者驾临"}, {"claim_kind": "inference", "id": "vol-10", "kind": "volume", "narrative_order": 1000, "parent_id": "story", "summary": "本集持续检验力量与运用条件的差别。普通军官的伏击虽然最终失败，却毁掉黑龙的整批坐骑并使他再次透支，迫使他正视地形、经验与储备。皇者驾临开始可以教学，领地也形成规模；雷奥却借假降近身，证明防卫数量并不能代替对秘法的理解。噬魂因同源亲和而未能伤及悼亡之魂，雷奥死亡及死息傀儡生成揭示武器的新价值，同时保留教皇赐枪的意图。龙岛远征随之启动，但森林矮人的加速成长与巨树强迫信仰提供一条主角尚不知全貌的支线。夺取航海技能采用杀人转生和拘魂威胁，暴露主角阵营扩张的代价；不死之身消除补给需求，也不能消除航海知识和心理需求。海战再次让环境推翻战力直觉，主角赢得生存却损失亡灵法师。海底偶遇使克丽丝从远程谈话者推进为降临行动者，她解释观察联系与神的社会起源，萝茜付出身体改造和能量代价破除外层封印。结尾仍留内层封魂结构与未知声音，海皇营救尚未完成。", "title": "第十集 噬魂的秘密"}, {"claim_kind": "inference", "id": "vol-11", "kind": "volume", "narrative_order": 1100, "parent_id": "story", "summary": "本集把解救神明、力量升级和侵入龙岛连接成一条不断改变关系的行动链。海皇获释后企图夺取黑龙躯体，使克丽丝的引荐变成信任危机；黑龙先借十孩供力和同伴掩护凝成真武装，再吞噬海皇、以多目标分流避免爆体，仍付出躯体破碎及部属伤亡；孩子们消化分流所得后才获真武装。胜利之后，他理解斯科特保族的责任，同时撤回对克丽丝的帮助承诺，迫使后者把脱困希望转向娜娜。海蛇转生又将消耗性的升级转为远征资源，然而龙岛并非单纯的取宝地点：龙族生育危机、龙人的受限生活和龙皇的利用计划使来客面对复杂社会。斯文通过战术与装备重新发挥作用，黑大以投枪显示独立创造；黑龙的群体力量仍会因缺飞行、协调和情报而付出高昂代价。结尾在龙人败势中出现祈祷引来的未知力量，既延续信仰元力主题，也把战斗胜负重新悬置。", "title": "第十一集 不死海怪"}, {"claim_kind": "inference", "id": "vol-12", "kind": "volume", "narrative_order": 1200, "parent_id": "story", "summary": "本集让求力远征完成，却反复拆开取得资源与获得可靠合作之间的差别。帝勒继承拿不列斯的元力和记忆后，首先带族人退出被龙皇利用的战争；黑龙取得安息石，却遭山体陷阱重创，带着损失返回森林。石头实为不死皇冠，先知借部分灵魂誓约取得它、突破为拥有不死龙魂的强者，又故意毁墓埋掉大批骸骨，企图垄断黑龙所需的空军力量。黑龙依靠已有魂链与同伴掩护迫其真正臣服，合作由算计转为强制依存。回家后的亲友重逢和生产设施把力量重心移到社会组织：钢铁供应危机推动援助疾风夺国，先知的灭世扩张方案却被黑龙对无聊生活的厌恶挡下。黑大、黑二开始分担赋魂与指挥，海皇分流所得的晶体骨又出现八个初觉醒者，使黑龙追求同类的愿望获得局部回应。与此同时，萝茜的多重碎忆、极光秘密杀手与天使骑士召回显示，身体、记忆、主体和机构忠诚仍不能简单合并。", "title": "第十二集 不死龙魂"}, {"claim_kind": "inference", "id": "vol-13", "kind": "volume", "narrative_order": 1300, "parent_id": "story", "summary": "本集把主角从依赖群体的扩张者移到必须独立求生的异界访客。托雷一队被杀后，附在其身上的预录讯息引出自然之神；黑龙因渴望不死同类世界而接受合作，娜娜被选为自然与冥月双神的共同传承者，但仪式尚未完成。读者随后知道，这也是双神借亲密关系绑定黑龙的安排。菲力普为保存自己的人格、扶植能长期抵抗教会的力量，抢在追兵前强制放逐黑龙。失去召唤支援的黑龙在死亡世界受黄金领主与死亡骑士磨炼，以旧法术和地形固定武器逆转强敌，获得献誓的隆克多与无需誓约的朋友金龙。另一边，搜寻失踪者造成驻地指挥空缺，七十二头不死巨龙遭天使袭灭。霍夫曼揭示死亡世界的培育史，交付亡者权杖并指出三件遗物的线索；这仍未解释古帝国消失，也未实现归途。结尾黑龙接受训练法阵而沉睡，拒绝把他人赋予的统治使命当作当然义务，升级结果留待后文。", "title": "第十三集 死亡世界"}, {"claim_kind": "inference", "id": "vol-14", "kind": "volume", "narrative_order": 1400, "parent_id": "story", "summary": "本集把个人继承与代理统治并排检验。黑龙经七月自我记忆回溯提升灵魂控制，进入遗迹却因不会飞行被遗漏，霍夫曼随即被君王分身灭魂。分身传授记忆而非力量，黑龙仍须通过跨位面行程和神骑战斗把知识练成能力；谢菲里安按位面守护职责承认其身份，使归途得以继续。叙事随后回叙外界三年三月的变局：先知用工程、财政、强制转生与军队使领地成为同盟的支柱，三次南征则不断改写双方优势。胜利收益与平民杀戮、俘虏劳死之间的裂缝，最终集中为塞茵全城活尸计划。斯文哥尔等人的异议不再只是战术分歧，而是临时管理者能否剥夺所有人生存与人格的权力问题。自然神和克丽丝借载体介入，黑龙在魂链恢复后归来，但只打断冲突；传承使命、分身余命、法阵处置和统治责任都尚未结算。材料适合学习能力分层、回叙压缩和组织冲突升级，同时须防止把叙述预告、人物预测及尚未发动的计划误记为既成事实。", "title": "第十四集 君王的传承"}, {"claim_kind": "inference", "id": "vol-15", "kind": "volume", "narrative_order": 1500, "parent_id": "story", "summary": "本集让归来的黑龙同时处理权力、家庭与帝国遗产。制止先知的活尸计划并非价值转善，而是他掌握了降临限制、退路和盟友利益后的策略选择；收回三十六条龙的魂约，才真正切断代理人的私人兵权。给八名晶体孩子补全武装的温情，紧接海底禁咒毁掉十七、十八，令探索从展示成长转成承担不可轻抹的代价。黑龙用跨越能力消耗古代防御，遇见守护死亡之眼的泰坦与大贤者，获得第三圣器，并经红月通道看到失落大陆和存活君王。历史由遗物、幸存者证词、亲见与神的解释分层拼接，切里莫背叛却仍是未证推论。结尾红月巫师将死亡转化为集中力量，最后一人自称达罗亚力绯克归来，推动黑龙出城参战，同时也促使他重新准备祭魂魔阵。亲近个体与可牺牲群体的判断并存，使其成长表现为能力、选择及控制范围的扩大，而非线性的人性化。", "title": "第十五集 泰坦骷髅"}, {"claim_kind": "inference", "id": "vol-16", "kind": "volume", "narrative_order": 1600, "parent_id": "story", "summary": "本集先把君王归来写成战争转折，再拆解归来者值得信任的假设。达罗亚借红月信仰强降，噬魂枪使雷奥恢复意识；菲力普逃走、弗里昂战死，绝望祷言迫黑龙保护魅，也由达罗亚暂时承担君王责任。光明神格的慢性消融解释了旧王死亡和新来者的期限，却未让黑龙意识到自己正是对方需要的魂力、躯体与势力来源。自然神以神谕维护联盟并杀旧长老，先知以俘虏政策换合作，显示同盟持续依赖权力与利益。高原探路骗局将黑龙封入自身头颅，军事优势也无法替代对领袖安全的保障。一个多月的拉锯使他学会凝炼能量，却被达罗亚献祭五十多万自身子民取得的力量压倒。哈力维亚的愤怒与无奈、娜娜的质问和魅冒险保护朋友的选择，让保护、服从与利用出现多种答案。末尾黑龙紧缩灵魂后被两王感知为异常，混沌之灵只完成悬念揭示，未给脱困结果；教皇对安德鲁实施不死献祭，又把教会身份与实际行动的裂缝留给后文。", "title": "第十六集 君王回归"}, {"claim_kind": "inference", "id": "vol-17", "kind": "volume", "narrative_order": 1700, "parent_id": "story", "summary": "本集把力量属性、社会名义与实际控制拆成三条互相错位的线。黑龙在达罗亚的吞噬压迫下形成混沌之灵，经哈力维亚传授适用战技，反过来吸收人工光明神格，成为能够收取光明信仰的不死君王。地下脱困并未让他同时获得全局情报：教皇已使安德鲁和光之神骑转生，冒用黑龙名义带领千万不死军，把军事威胁转化为恐惧、逃亡和宗教依附。先知因相信同族与名号而被卷进计划，同盟关系也因灾难预期破裂。读者则通过尼鲁达双灵格的密谈和历史回叙，先于黑龙知道光明三主神的旧帝国来源、分裂潜伏与借神格复起的布局。黑龙吞掉两名假统帅，只回收局部身份真相；千万尸军随之崩溃又被他操纵，产生新的战场连锁反应。卷末女天使重掌公正神格，以表演战斗诱导集体祈祷，再将暴增能量用于开启红月。通道显现是明确成果，大陆重临和诸方最终结局仍未发生；本集最有用的学习点是权力分拆、信息差驱动群体误判，以及能力进阶与人格连续性必须分别记账。", "title": "第十七集 光与暗"}, {"claim_kind": "inference", "id": "vol-18", "kind": "volume", "narrative_order": 1800, "parent_id": "story", "summary": "终卷先兑现哈力维亚及大批子民回归，再将旧敌切里莫的布局扩展到跨位面的生命掠夺。龙人逃亡接通深渊统一线，黑龙在可控试战中摸清混沌之灵的转化与再生能力，以投影残片反追幕后者，却仍须哈力维亚救援。战场随后分为两个尺度：地面军队用组织、增援和音乐魔法抵抗入侵，虚无中的三名强者则追查本源。罗得宾士从被轻视的乐师变为关键战力，但约十五万魔物的死亡又使本源增强，把局部胜利反接到全局危险。切里莫想借造物超脱规则，却被已具独立意志的本源吞噬；黑龙获得遗留信息后，托付子民烙印、接受公正神格，以保护自由存在和具体同伴为理由投入没有胜算的意志争夺。结尾省略争夺与治理过程，用多年后的交通、市场和多族交往展示结果，再让黑龙重获形体。其优势是日常细节回收宏大主题；限制是若干人物、阵法与制度线没有逐项交代，不能把终局和平视为所有支线均已闭合。", "title": "第十八集 自由的世界"}], "edges": {"v01-edge-01": {"claim_kind": "fact", "evidence": [{"chapter_id": "ch-0004", "claim_kind": "fact", "end_line": 167, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "source_id": "src-9ff09c395734410b856f77c77a652834", "start_line": 156}, {"chapter_id": "ch-0005", "claim_kind": "fact", "end_line": 181, "revision": "5f301997b4d29495fcd6a6e3b9237e977741b84efafd6603e5e1d56e2a567f7d", "sourc const claims={fact:'原文事实',inference:'研究推断',synthesis:'研究综合',plan:'计划'},knowledgeStates={unknown:'未知',suspects:'怀疑',knows:'知道',misbelieves:'误以为'};
const vp=document.getElementById('viewport'),canvas=document.getElementById('canvas'),svg=canvas.querySelector('svg'),panel=document.getElementById('detail');
document.getElementById('save-svg').href=URL.createObjectURL(new Blob([svg.outerHTML],{type:'image/svg+xml;charset=utf-8'}));
let scale=1,tx=0,ty=0,drag=null,dragged=false,query='',matchIndex=0;
function apply(){canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;document.getElementById('zoom').textContent=Math.round(scale*100)+'%';}
function fitRect(x,y,w,h){const margin=30;scale=Math.min((vp.clientWidth-margin*2)/w,(vp.clientHeight-margin*2)/h,2);scale=Math.max(.025,scale);tx=(vp.clientWidth-w*scale)/2-x*scale;ty=(vp.clientHeight-h*scale)/2-y*scale;apply();}
function fit(){fitRect(0,0,data.meta.width,data.meta.height);}
function zoom(factor,x=vp.clientWidth/2,y=vp.clientHeight/2){const next=Math.max(.025,Math.min(3,scale*factor));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;apply();}
function evidence(items){return (items||[]).map(e=>`${e.chapter_id} · L${e.start_line}—${e.end_line}`).join('\n');}
function detail(title,label,text,proof=''){panel.classList.add('open');document.getElementById('neighbors').replaceChildren();document.getElementById('detail-title').textContent=title;document.getElementById('detail-label').textContent=label;document.getElementById('detail-text').textContent=text;document.getElementById('detail-evidence').textContent=proof;}
function clear(){svg.querySelectorAll('.dim,.selected').forEach(el=>el.classList.remove('dim','selected'));document.getElementById('notice').textContent='主线分枝 · 旁支另起 · 共享事件处交汇';}
const relations={cause:'因果',setup:'铺垫',reveal:'揭示',reversal:'转折',payoff:'回收',echo:'呼应'};
function mark(ids,edgeIds=null){const keep=new Set(ids);svg.querySelectorAll('[data-kind=event],[data-kind=thread]').forEach(el=>el.classList.toggle('dim',!keep.has(el.id)));svg.querySelectorAll('[data-kind=edge],[data-kind=annotation]').forEach(el=>el.classList.toggle('dim',edgeIds&&el.dataset.kind==='edge'?!edgeIds.has(el.id):!(keep.has(el.dataset.from)&&keep.has(el.dataset.to))));}
function focusIds(ids){const boxes=ids.map(id=>data.meta.positions[id]).filter(Boolean);if(!boxes.length)return;const x=Math.min(...boxes.map(b=>b.x)),y=Math.min(...boxes.map(b=>b.y));fitRect(x-70,y-70,Math.max(...boxes.map(b=>b.x+b.width))-x+140,Math.max(...boxes.map(b=>b.y+b.height))-y+140);}
function neighbors(nid){const dest=document.getElementById('neighbors');Object.values(data.edges).filter(e=>e.from===nid||e.to===nid).forEach(e=>{const other=e.from===nid?e.to:e.from;const b=document.createElement('button');b.textContent=(e.to===nid?'来自：':'通向：')+data.nodes[other].title+' · '+relations[e.kind];b.style.cssText='display:block;text-align:left;width:100%;margin:8px 0;line-height:1.7';b.title=e.label;b.onclick=()=>select(other,true);dest.append(b)});}
function select(id,focus=false){
 clear();const el=document.getElementById(id);if(el)el.classList.add('selected');
 if(data.nodes[id]){const n=data.nodes[id],pos=data.meta.positions[id],links=Object.values(data.edges).filter(e=>e.from===id||e.to===id);mark([id,...links.flatMap(e=>[e.from,e.to])],new Set(links.map(e=>e.id)));detail(n.title,`${id} · ${claims[n.claim_kind]||'研究记录'}${data.meta.time_labels[id]?' · '+data.meta.time_labels[id]:''}`,n.summary+'\n\n'+(n.knowledge||[]).map(k=>`${data.observers[k.observer]||'未注明观察者'} · ${knowledgeStates[k.state]||k.state}：${k.belief}`).join('\n'),evidence(n.evidence));neighbors(id);if(focus)fitRect(pos.x-150,pos.y-170,pos.width+300,pos.height+340);}
 else if(data.threads[id]){const t=data.threads[id],m=data.meta.threads.find(x=>x.id===id),ids=[id,...t.node_ids,...t.edge_ids.flatMap(e=>[data.edges[e].from,data.edges[e].to])];detail(t.title,(m?'暗线'+String(m.number).padStart(2,'0')+' · ':'剧情线 · ')+({resolved:'已回收',partial:'部分回收',open:'未回收'}[t.status]),t.question+'\n\n'+t.resolution_note);mark(ids,new Set(t.edge_ids));if(focus)focusIds(ids);document.getElementById('notice').textContent='已聚焦：'+t.title.split(' · ').pop()+'；共享事件仍保持原位';}
 else if(data.edges[id]){const e=data.edges[id];mark([e.from,e.to],new Set([id]));detail(relations[e.kind]+' · '+data.nodes[e.from].title+' → '+data.nodes[e.to].title,`${e.from} → ${e.to} · ${claims[e.claim_kind]||'研究记录'}`,e.label,evidence(e.evidence));if(focus)focusIds([e.from,e.to]);}
}
document.getElementById('fit').onclick=fit;
document.getElementById('mainline').onclick=()=>select(data.meta.core,true);
document.getElementById('threads').onclick=()=>{clear();panel.classList.remove('open');const ids=data.meta.threads.filter(t=>t.status!=='resolved').flatMap(t=>[t.id,t.anchor]);mark(ids);focusIds(ids);document.getElementById('notice').textContent='14条待回收暗线：11条部分回收、3条未回收；点击状态框展开整条线';};
document.getElementById('junctions').onclick=()=>{clear();panel.classList.remove('open');mark(data.meta.junctions);fit();document.getElementById('notice').textContent='金色标记为多路交汇；点击事件可沿来源与去向继续查看';};
const branch=document.getElementById('branch');Object.values(data.threads).forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=({main:'主线',subplot:'支线',hidden:'暗线'}[t.kind])+' · '+t.title.split(' · ').pop();branch.append(o)});branch.onchange=()=>{if(branch.value)select(branch.value,true)};
document.getElementById('plus').onclick=()=>zoom(1.4);document.getElementById('minus').onclick=()=>zoom(1/1.4);
document.getElementById('clear').onclick=clear;
document.getElementById('close').onclick=()=>panel.classList.remove('open');
const volume=document.getElementById('volume');data.volumes.forEach((v,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=v.title;volume.append(o)});
volume.onchange=()=>{if(!volume.value)return;clear();panel.classList.remove('open');const ids=data.meta.events.filter(id=>data.meta.positions[id].volume===Number(volume.value));mark(ids);focusIds(ids);};
function find(){const term=document.getElementById('search').value.trim();if(!term)return;const matches=Object.values(data.nodes).filter(n=>(n.title+' '+n.summary).includes(term));if(!matches.length){document.getElementById('notice').textContent='本图精选事件中未找到：'+term;return;}if(query!==term){query=term;matchIndex=0;}const n=matches[matchIndex%matches.length];select(n.id,true);document.getElementById('notice').textContent=`${matchIndex%matches.length+1}/${matches.length}：再次查找可跳到下一项`;matchIndex++;}
document.getElementById('find').onclick=find;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')find()};
vp.addEventListener('wheel',e=>{e.preventDefault();const b=vp.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-b.left,e.clientY-b.top)},{passive:false});
// 超过拖动阈值后才捕获指针，普通点击仍交给事件卡片。
vp.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,tx,ty};dragged=false;vp.classList.add('drag')});
vp.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){dragged=true;vp.setPointerCapture(e.pointerId)}tx=drag.tx+dx;ty=drag.ty+dy;apply()});
vp.addEventListener('pointerup',e=>{drag=null;vp.classList.remove('drag');if(vp.hasPointerCapture(e.pointerId))vp.releasePointerCapture(e.pointerId)});
vp.addEventListener('pointercancel',()=>{drag=null;vp.classList.remove('drag')});
svg.addEventListener('click',e=>{if(dragged)return;const g=e.target.closest('[data-kind]');if(g)select(g.id)});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('[data-kind]');if(g){e.preventDefault();select(g.id,true)}}});
vp.addEventListener('dblclick',e=>{if(!e.target.closest('[data-kind]'))fit()});
window.addEventListener('resize',fit);document.fonts.ready.then(fit);
</script></body></html>

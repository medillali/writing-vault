 x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">沼泽古国与转生遗产 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">祭坛遗产如何延续，帝国消失为何？</text><path d="M 114 372 V 1630" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 617 Q 1060 635 992 635" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 635 C 1115 635 1115 635 1115 653 L 1115 877 Q 1115 895 992 895" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 895 C 1060 895 1060 895 1060 913 L 1060 1137 Q 1060 1155 992 1155" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1155 C 1115 1155 1115 1155 1115 1173 L 1115 1397 Q 1115 1415 992 1415" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><rect x="1040" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="509.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="519.0">2</text><rect x="1095" y="748.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="769.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="779.0">3</text><rect x="1040" y="1008.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="1029.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="1039.0">4</text><rect x="1095" y="1268.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="1289.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="1299.0">1</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">01集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v01-e10 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">发现荒废不死国度遗迹</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">在图克带领下抵达祭坛，队伍发现古老不死领地遗迹，衰亡原因仍无</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">从得知。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0011 L1224–1234</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">02集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v02-e01 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">红月激活祭坛并收到救赎线索</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">红月夜祭坛恢复活性；公会情报指雷克丁拥有救赎之魂，巫妖计划离</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">开。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0014 L1380–1431</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">08集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v08-e09 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">祭坛修复与首批启动</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">阿古力特七日苏醒后与亡灵修复祭坛，黑龙提供魔晶；限载放出三十</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">余魂，启动极致时出现未知苍老声音。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0087 L10821–10844；ch-0087 L10954–10986</text><circle cx="114" cy="1155" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1200" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1211">09集</text><path d="M 126 1155 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1110" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1144" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1154">v09-e01 · 事实</text><text x="212" y="1188" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1202">图克承继与大批转生</text><text x="212" y="1236" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1248">旧领主烙印进入图克，守护和诅咒源头揭开；三千余混合灵魂转生，</text><text x="212" y="1272" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1284">力王等在威胁下奉誓。</text><text x="212" y="1316" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1326">ch-0089 L11014–11046；ch-0089 L11084–11126</text><circle cx="114" cy="1415" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1460" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1471">09集</text><path d="M 126 1415 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1370" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1404" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1414">v09-e04 · 事实</text><text x="212" y="1448" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1462">领地组织与跨代知识进入</text><text x="212" y="1496" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1508">跨段聚合：先祖拜见、斯科特限借，斯文与族人共建领地；后段规划</text><text x="212" y="1532" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1544">辩论扩展到文化商业，另记泰戈醒来待检，并非同一时点的一场会议</text><text x="212" y="1568" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1580">。</text><text x="212" y="1612" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1622">ch-0092 L11564–11614；ch-0095 L12308–12380</text><text x="64" y="1702" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="1716">旁路关系说明 · 编号对应图中连线</text><text x="84" y="1757" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="1769">01  因果 · 事实 · v09-e01 → v09-e04</text><text x="84" y="1796" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1808">大批转生和先人记忆为领地建设提供人口与知识。</text><text x="84" y="1845" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="1857">02  揭示 · 事实 · v01-e10 → v02-e01</text><text x="84" y="1884" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1896">已发现的荒废遗迹在红月下出现祭坛反应，古史仍未证实</text><text x="84" y="1933" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="1945">03  回收 · 事实 · v02-e01 → v08-e09</text><text x="84" y="1972" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1984">曾观察到活性的古祭坛回到主线，经修复后首批限载启动；本集结尾还不能确认全族转生成功</text><text x="84" y="2021" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2033">04  回收 · 事实 · v08-e09 → v09-e01</text><text x="84" y="2060" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2072">祭坛启动后的声音与图克守护来源得到解释，混合灵魂的分批转生完成；知识继承不等于力量或原人格直接替换</text><rect x="64" y="2106" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2154" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2168">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2209" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2221">沼泽遗迹的诅咒、图克诞生与旧领主守护记忆获得说明；后来揭示的是三君王、放逐大陆及帝国子民回归。两层历史不可凭同称不死国度</text><text x="88" y="2246" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2258">直接等同，旧沼泽古国消失的完整因由仍未充分解释。</text><text x="64" y="2370" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2380">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
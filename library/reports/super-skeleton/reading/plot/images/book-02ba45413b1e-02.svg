<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2879" viewBox="0 0 1700 2879" role="img"><title>光明制度与神祇主体 · 2/4</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">光明制度与神祇主体 · 2/4</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">信徒力量的分配与神祇代理权最终如何重组？</text><path d="M 114 372 V 2222" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 689 Q 1060 707 992 707" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="524.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="545.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="555.0">1</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">14集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="292" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v14-e06 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">第二次南征惨败与维亚伦斯自杀</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">帝国四十五万军攻坚并付出巨大代价，守方虚构瘟疫造成军队失序，</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">维亚伦斯射杀逃回者，牧师救助后遭后续屠杀。战报为十六万阵亡、</text><text x="212" y="528" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="540">二十万被俘、三万失踪，返不足六万；维亚伦斯交印自杀，菲力普暂</text><text x="212" y="564" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="576">代军务。</text><text x="212" y="608" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="618">ch-0152 L18732–18748；ch-0152 L18793–18829；ch-0152 L18840–18887</text><circle cx="114" cy="707" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="752" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="763">14集</text><path d="M 126 707 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="662" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="696" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="706">v14-e07 · 事实</text><text x="212" y="740" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="754">第三次南征进抵塞茵</text><text x="212" y="788" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="800">九个月后教会力量参与再征，帝国约三十万军打下守军不足七千、主</text><text x="212" y="824" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="836">力已撤的要塞，继续抵近塞茵；黑龙将于此阶段回来。</text><text x="212" y="868" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="878">ch-0152 L18894–18908</text><circle cx="114" cy="967" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1012" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1023">14集</text><path d="M 126 967 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="922" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="956" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="966">v14-e09 · 事实</text><text x="212" y="1000" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1014">两神借身对峙，黑龙归来但未裁决</text><text x="212" y="1048" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1060">自然神通过娜娜、克丽丝通过萝茜显现，先知威胁眼前两分身。魂链</text><text x="212" y="1084" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1096">恢复后黑龙携队到场询问是否要打架，活尸阵处置、先知责任和战争</text><text x="212" y="1120" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1132">结局均未在本集裁决。</text><text x="212" y="1164" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1174">ch-0154 L19009–19047</text><circle cx="114" cy="1263" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1308" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1319">15集</text><path d="M 126 1263 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1218" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1252" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1262">v15-e01 · 事实</text><text x="212" y="1296" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1310">回归后暂禁活尸计划</text><text x="212" y="1344" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1356">黑龙重返同伴，以位面规则和当前利益暂禁百万活尸阵，保留正常交</text><text x="212" y="1380" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1392">战与撤退选择。</text><text x="212" y="1424" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1434">ch-0156 L19055–19118；ch-0157 L19212–19267</text><circle cx="114" cy="1523" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1568" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1579">15集</text><path d="M 126 1523 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1478" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1512" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1522">v15-e05 · 事实</text><text x="212" y="1556" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1570">独耗禁咒后遇泰坦与来袭天使</text><text x="212" y="1604" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1616">黑龙付魂力代价独闯，毁傀儡后封印自行开；泰坦先攻，四翼女子来</text><text x="212" y="1640" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1652">袭使双方暂联手毁其躯体、迫圣气退走。</text><text x="212" y="1684" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1694">ch-0162 L19782–19858；ch-0163 L19862–19985</text><circle cx="114" cy="1783" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1828" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1839">15集</text><path d="M 126 1783 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1738" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1772" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1782">v15-e08 · 事实</text><text x="212" y="1816" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1830">红月群体异常与祭魂阵重备</text><text x="212" y="1864" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1876">红月巫师无人指挥突袭，力量向生还者集中；天使现身后黑龙同意趁</text><text x="212" y="1900" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1912">机出击并重备祭魂阵，称不到最后不发动。</text><text x="212" y="1944" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1954">ch-0167 L20344–20465</text><circle cx="114" cy="2043" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2088" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2099">15集</text><path d="M 126 2043 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1998" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2032" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2042">v15-e09 · 事实</text><text x="212" y="2076" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2090">最后巫师自称达罗亚归来</text><text x="212" y="2124" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2136">战死、自爆与主动合一只余一人，侵蚀一名降临天使躯体后自报达罗</text><text x="212" y="2160" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2172">亚力绯克；黑龙会意挥手出城。</text><text x="212" y="2204" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2214">ch-0167 L20470–20499</text><text x="64" y="2294" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2308">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2349" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2361">01  铺垫 · 研究推断 · v14-e06 → v14-e07</text><text x="84" y="2388" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2400">第二次惨败后政军权力变化及教会力量介入，构成第三次攻势条件。</text><text x="84" y="2437" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2449">02  回收 · 事实 · v15-e01 → v16-e02〔跨页接续〕</text><text x="84" y="2476" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2488">菲力普对自身价值的重视进一步落实为临阵逃离，弗里昂的拒逃构成另一个选择</text><rect x="64" y="2522" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2570" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2584">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2625" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2637">受教会支配的天使可以作不同选择，三主神与尼鲁达双灵格的制度操作逐渐揭明。终卷补送枪机缘、虚设至高称号以及女灵格赠格改立的</text><text x="88" y="2662" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2674">行为；教皇个人结局、改立的具体执行和完整新制度没有展示。</text><text x="64" y="2749" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="2761">继续下一张：3/4。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="2835" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2845">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
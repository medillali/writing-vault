<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2859" viewBox="0 0 1700 2859" role="img"><title>原萝茜的记忆与借力主体 · 2/3</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">原萝茜的记忆与借力主体 · 2/3</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">原萝茜能否整合残忆并自主运用借来力量？</text><path d="M 114 372 V 2114" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 635 C 1060 635 1060 635 1060 653 L 1060 877 Q 1060 895 992 895" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 895 C 1115 895 1115 895 1115 913 L 1115 1137 Q 1115 1155 992 1155" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 1415 C 1060 1415 1060 1415 1060 1433 L 1060 1657 Q 1060 1675 992 1675" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><rect x="1040" y="748.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="769.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="779.0">1</text><rect x="1095" y="1008.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1102" y="1029.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1102" data-right="1136" data-bottom="1039.0">2</text><rect x="1040" y="1528.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="1549.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="1559.0">3</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">07集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v07-e06 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">一个月后掌握元力联系</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黑龙消化天使意念后醒来，短暂威压引跪拜，收束后能感到远端部属</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">传来能量。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0074 L9241–9291</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">08集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v08-e08 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">萝茜通过娜娜见克丽丝</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">萝茜渐能运用暗黑力量仍失忆，经娜娜和沉渊木进入克丽丝世界并与</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">其相见。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0087 L10888–10953</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">09集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v09-e08 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">同伴守谷与醒后围歼</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">墨菲斯循痕搜谷，罗得等守护，萝茜杀旧友护主；黑龙醒后协调六千</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">骨军与空骑围歼，但仍极弱。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0094 L12019–12067；ch-0094 L12121–12143；ch-0095 L12181–12213</text><circle cx="114" cy="1155" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1200" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1211">10集</text><path d="M 126 1155 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1110" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1144" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1154">v10-e08 · 事实</text><text x="212" y="1188" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1202">克丽丝解释观察联系与神身份</text><text x="212" y="1236" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1248">克丽丝认出好友封印，受黑龙拒绝后说明借萝茜单向联系重叠视野，</text><text x="212" y="1272" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1284">并讲述自己由守族者成神。</text><text x="212" y="1316" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1326">ch-0105 L13695–13769</text><circle cx="114" cy="1415" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1460" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1471">10集</text><path d="M 126 1415 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1370" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1404" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1414">v10-e09 · 事实</text><text x="212" y="1448" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1462">分身降临破外封，洞内仍有魂封</text><text x="212" y="1496" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1508">萝茜受改体与注能耗竭，双星失衡崩塌；四人进入内洞见六芒星封魂</text><text x="212" y="1532" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1544">与未知声音，未完成救援。</text><text x="212" y="1576" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1586">ch-0105 L13770–13802；ch-0105 L13815–13836；ch-0105 L13843–13871</text><circle cx="114" cy="1675" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1720" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1731">12集</text><path d="M 126 1675 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1630" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1664" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1674">v12-e02 · 事实</text><text x="212" y="1708" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1722">原萝茜醒来并混入异源碎忆</text><text x="212" y="1756" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1768">萝茜以失忆后共同生活的经验为主，夹入克丽丝魔法师记忆与旧天使</text><text x="212" y="1792" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1804">碎忆；恢复清醒不等全部人格或旧记忆复原。</text><text x="212" y="1836" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1846">ch-0120 L15368–15383</text><circle cx="114" cy="1935" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1980" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1991">15集</text><path d="M 126 1935 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1890" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1924" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1934">v15-e01 · 事实</text><text x="212" y="1968" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1982">回归后暂禁活尸计划</text><text x="212" y="2016" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2028">黑龙重返同伴，以位面规则和当前利益暂禁百万活尸阵，保留正常交</text><text x="212" y="2052" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2064">战与撤退选择。</text><text x="212" y="2096" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2106">ch-0156 L19055–19118；ch-0157 L19212–19267</text><text x="64" y="2186" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2200">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2241" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2253">01  回收 · 事实 · v08-e08 → v09-e08</text><text x="84" y="2280" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2292">接触克丽丝后产生保护黑龙的新使命，萝茜行动履行使命但不认旧友；不据使命本身确认克丽丝神性</text><text x="84" y="2329" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2341">02  揭示 · 事实 · v09-e08 → v10-e08</text><text x="84" y="2368" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2380">萝茜的新使命后来显出观察黑龙视野的联系用途，角色与读者获知的时点分别保留</text><text x="84" y="2417" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2429">03  回收 · 事实 · v10-e09 → v12-e02</text><text x="84" y="2456" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2468">分身借体后的记忆变化在萝茜醒来时得到局部说明，新生活经验主导并夹异源碎忆，三实体不合并</text><rect x="64" y="2502" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2550" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2564">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2605" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2617">原萝茜苏醒、异源残忆与借克丽丝力量护墙都已呈现，旧恨和亲近并存。第七集降临天使意念被吞并不等于原萝茜人格与克丽丝合并，后</text><text x="88" y="2642" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2654">记未点名她；记忆完全整合及最终生活仍保留未知。</text><text x="64" y="2729" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="2741">继续下一张：3/3。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="2815" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2825">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
text><rect x="1095" y="1787.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="1808.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="1818.0">6</text><circle cx="114" cy="280" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="325" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="336">02集</text><path d="M 126 280 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="235" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="269" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="279">v02-e01 · 事实</text><text x="212" y="313" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="327">红月激活祭坛并收到救赎线索</text><text x="212" y="361" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="373">红月夜祭坛恢复活性；公会情报指雷克丁拥有救赎之魂，巫妖计划离</text><text x="212" y="397" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="409">开。</text><text x="212" y="441" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="451">ch-0014 L1380–1431</text><circle cx="114" cy="540" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="585" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="596">02集</text><path d="M 126 540 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="495" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="529" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="539">v02-e02 · 事实</text><text x="212" y="573" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="587">改貌携魂穿过围堵</text><text x="212" y="621" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="633">黑龙把斯文哥尔灵魂随身携带，变为老法师，过雷火检查后潜入塞茵</text><text x="212" y="657" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="669">城。</text><text x="212" y="701" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="711">ch-0015 L1555–1579；ch-0015 L1580–1607；ch-0016 L1643–1674</text><circle cx="114" cy="800" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="845" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="856">02集</text><path d="M 126 800 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="755" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="789" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="799">v02-e03 · 事实</text><text x="212" y="833" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="847">侦听后与疾风建立合作</text><text x="212" y="881" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="893">黑夜聆听发现疾风计划，黑龙按教师策略提出雇佣并敲晕拦路电狼。</text><text x="212" y="925" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="935">ch-0016 L1730–1752；ch-0017 L1787–1819；ch-0017 L1871–1874</text><circle cx="114" cy="1024" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1069" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1080">02集</text><path d="M 126 1024 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="979" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1013" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1023">v02-e04 · 事实</text><text x="212" y="1057" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1071">坦克战死成战魂并被压制</text><text x="212" y="1105" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1117">营寨战清场导致莫非死亡，黑大能量刃显形；坦克战魂最终被黑龙吞</text><text x="212" y="1141" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1153">入但无法炼化。</text><text x="212" y="1185" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1195">ch-0019 L2061–2084；ch-0019 L2119–2156；ch-0020 L2173–2205</text><circle cx="114" cy="1284" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1329" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1340">02集</text><path d="M 126 1284 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1239" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1273" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1283">v02-e05 · 事实</text><text x="212" y="1317" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1331">黑二换身后出现明确意识</text><text x="212" y="1365" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1377">黑二主动称将军并解释理由，黑龙确认首位同类产生意识，仍保留新</text><text x="212" y="1401" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1413">骨架弱点。</text><text x="212" y="1445" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1455">ch-0020 L2267–2308</text><circle cx="114" cy="1544" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1589" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1600">02集</text><path d="M 126 1544 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1499" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1533" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1543">v02-e06 · 事实</text><text x="212" y="1577" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1591">宝藏开启并完整融合记忆</text><text x="212" y="1625" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1637">黑龙打开阿罗约次元空间，旧物触发完整记忆，取得晶石首饰和沉渊</text><text x="212" y="1661" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1673">木，魔力仍未继承。</text><text x="212" y="1705" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1715">ch-0020 L2322–2332；ch-0021 L2336–2402</text><circle cx="114" cy="1804" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1849" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1860">02集</text><path d="M 126 1804 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1759" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1793" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1803">v02-e07 · 事实</text><text x="212" y="1837" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1851">悬赏与两团联盟削弱雷神</text><text x="212" y="1885" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1897">檄文和赏金兑现引动第三方，疾风及火狐狸共同扩张，雷神人员和情</text><text x="212" y="1921" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1933">报网遭重创。</text><text x="212" y="1965" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1975">ch-0021 L2404–2430；ch-0022 L2470–2479；ch-0022 L2498–2522</text><circle cx="114" cy="2064" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2109" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2120">02集</text><path d="M 126 2064 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2019" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2053" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2063">v02-e08 · 事实</text><text x="212" y="2097" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2111">沉渊木中的克丽丝邀学失败</text><text x="212" y="2145" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2157">自称冥月女神的克丽丝解释木块与神念，黑龙不信身份且拒绝高级魔</text><text x="212" y="2181" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2193">法诱惑。</text><text x="212" y="2225" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2235">ch-0022 L2531–2596</text><circle cx="114" cy="2324" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2369" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2380">02集</text><path d="M 126 2324 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2279" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2313" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2323">v02-e09 · 事实</text><text x="212" y="2357" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2371">外出教学遇娜娜与洛特托付</text><text x="212" y="2405" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2417">黑龙带黑二识世，阻止斯文哥尔跟随；遇被白衣信众追杀的娜娜，洛</text><text x="212" y="2441" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2453">特提出照料请求后死去。</text><text x="212" y="2485" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2495">ch-0023 L2631–2674；ch-0023 L2695–2759</text><text x="64" y="2575" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2589">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2630" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2642">01  因果 · 事实 · v02-e01 → v02-e02</text><text x="84" y="2669" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2681">救赎希望促离开沼泽，围堵又促改貌突围</text><text x="84" y="2718" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2730">02  因果 · 事实 · v02-e02 → v02-e03</text><text x="84" y="2757" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2769">潜入酒馆后获得侦听和政治接触机会</text><text x="84" y="2806" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2818">03  因果 · 事实 · v02-e03 → v02-e04</text><text x="84" y="2845" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2857">约定攻营展示实力，遇留守坦克</text><text x="84" y="2894" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2906">04  铺垫 · 事实 · v02-e04 → v02-e05</text><text x="84" y="2933" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2945">战后取得替换尸体，为黑二修复提供条件；首次主动交流发生于修复后，觉醒原因未知</text><text x="84" y="2982" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2994">05  铺垫 · 研究综合 · v02-e03 → v02-e07</text><text x="84" y="3021" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3033">联盟给予情报和公开名义，扩大反雷神行动</text><text x="84" y="3070" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="3082">06  铺垫 · 事实 · v02-e06 → v02-e08</text><text x="84" y="3109" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3121">宝藏黑木与强灵魂触发远程对话</text><text x="84" y="3158" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3170">07  因果 · 事实 · v02-e05 → v02-e09</text><text x="84" y="3197" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3209">黑二产生意识后，黑龙主动带他见世面</text><text x="84" y="3246" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="3258">08  回收 · 事实 · v02-e04 → v02-e09</text><text x="84" y="3285" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3297">坦克战的兵器损失促重装换剑，实战展现保护效果</text><text x="64" y="3371" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3381">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
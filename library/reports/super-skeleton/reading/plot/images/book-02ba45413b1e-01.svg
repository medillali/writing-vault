<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3219" viewBox="0 0 1700 3219" role="img"><title>光明制度与神祇主体 · 1/4</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">光明制度与神祇主体 · 1/4</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">信徒力量的分配与神祇代理权最终如何重组？</text><path d="M 114 372 V 2210" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 635 C 1060 635 1060 635 1060 653 L 1060 877 Q 1060 895 992 895" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 895 C 1115 895 1115 895 1115 913 L 1115 1397 Q 1115 1415 992 1415" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 895 C 1170 895 1170 895 1170 913 L 1170 1137 Q 1170 1155 992 1155" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 1415 C 1060 1415 1060 1415 1060 1433 L 1060 1687 Q 1060 1705 992 1705" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="748.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="769.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="779.0">2</text><rect x="1095" y="1138.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1102" y="1159.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1102" data-right="1136" data-bottom="1169.0">4</text><rect x="1150" y="1008.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1157" y="1029.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1157" data-right="1191" data-bottom="1039.0">5</text><rect x="1040" y="1543.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="1564.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="1574.0">1</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">08集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v08-e01 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">圣骑溃败与保密灭口</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黑龙绕盾多次冲锋击溃圣骑，列奥纳被杀；雷奥救安德鲁后杀光己方</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">幸存者并自报死亡骑士。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0078 L9634–9677；ch-0078 L9700–9744</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">08集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v08-e06 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">追兵撤离与蚕食内幕</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">雷奥和火马转向教会总部；菲力普执行蚕食命令，私下显四翼并害怕</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">沦为无意识工具。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0085 L10641–10651；ch-0086 L10655–10689</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">11集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v11-e05 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">菲力普以猎狗比喻动摇下属</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">占领军停滞与异端集结背景下，菲力普隔离克罗斯并揭露工具处境，</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">迫其面对信仰疑虑。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0112 L14439–14480；ch-0112 L14481–14520</text><circle cx="114" cy="1155" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1200" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1211">12集</text><path d="M 126 1155 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1110" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1144" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1154">v12-e07 · 事实</text><text x="212" y="1188" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1202">极光杀剑圣与天使备用躯体的秘密</text><text x="212" y="1236" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1248">格杀档案在极光屠村杀奥马利多的现场得到具象验证；菲力普得知神</text><text x="212" y="1272" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1284">迹非针对自己，却仍不懂骑士召回目的，反映教会力量不由他尽知。</text><text x="212" y="1316" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1326">ch-0123 L15800–15833；ch-0127 L16135–16215</text><circle cx="114" cy="1415" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1460" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1471">13集</text><path d="M 126 1415 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1370" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1404" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1414">v13-e03 · 事实</text><text x="212" y="1448" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1462">菲力普强制放逐与先知退敌</text><text x="212" y="1496" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1508">菲力普的自保盘算先由独处视角揭示，随后他抢在弗里昂之前隔离并</text><text x="212" y="1532" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1544">放逐黑龙；另一处先知消灭两低阶天使，弗里昂逃走。</text><text x="212" y="1576" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1586">ch-0132 L16659–16690；ch-0134 L16868–16894；ch-0134 L16901–16916</text><text x="212" y="1606" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1616">；ch-0135 L16948–16957</text><circle cx="114" cy="1705" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1750" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1761">13集</text><path d="M 126 1705 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1660" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1694" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1704">v13-e06 · 事实</text><text x="212" y="1738" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1752">驻地七十二龙覆灭</text><text x="212" y="1786" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1798">教皇知龙墓解封与驻地；113天使袭击缺乏有智指挥的72骨/尸龙，龙</text><text x="212" y="1822" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1834">全亡、69天使阵亡；先知余36有智龙，决定回沼泽。</text><text x="212" y="1866" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1876">ch-0138 L17358–17372；ch-0139 L17382–17427</text><circle cx="114" cy="1965" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2010" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2021">14集</text><path d="M 126 1965 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1920" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1954" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1964">v14-e03 · 事实</text><text x="212" y="1998" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2012">逐段归途与神骑有条件放行</text><text x="212" y="2046" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2058">黑龙携金龙等十五名强者按位面坐标跳转，古巴避走告警。途中自然</text><text x="212" y="2082" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2094">神骑阻击，黑龙实练新术；光之神骑自报谢菲里安，按本位面出生及</text><text x="212" y="2118" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2130">实力承认通行。此时尚未与旧同伴会合。</text><text x="212" y="2162" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2172">ch-0147 L18157–18213；ch-0148 L18243–18292；ch-0148 L18339–18350</text><text x="212" y="2192" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2202">；ch-0149 L18418–18488</text><text x="64" y="2282" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2296">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2337" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2349">01  铺垫 · 研究推断 · v13-e03 → v13-e06</text><text x="84" y="2376" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2388">寻找失踪者召走有智龙，使独立袭击击中驻地指挥空缺</text><text x="84" y="2425" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2437">02  揭示 · 研究推断 · v08-e06 → v11-e05</text><text x="84" y="2464" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2476">菲力普独处展露的工具恐惧在对克罗斯的猎犬解释中进一步公开，听者动摇不等于已投效</text><text x="84" y="2513" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2525">03  揭示 · 事实 · v13-e03 → v15-e01〔跨页接续〕</text><text x="84" y="2552" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2564">菲力普对放逐原因作自我说明，确认其重视黑龙对自身的利用价值</text><text x="84" y="2601" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2613">04  揭示 · 事实 · v11-e05 → v13-e03</text><text x="84" y="2640" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2652">猎犬比喻背后的自我保存目的发展为扶植敌对势力，强制放逐并非征得黑龙同意的救援</text><text x="84" y="2689" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2701">05  揭示 · 研究推断 · v11-e05 → v12-e07</text><text x="84" y="2728" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2740">菲力普对工具制度的解释扩展到备用身体来源与机构盲区，了解一层安排不代表掌握教会全局</text><text x="84" y="2777" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="2789">06  转折 · 事实 · v14-e03 → v17-e07〔跨页接续〕</text><text x="84" y="2816" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2828">曾按位面职责放行黑龙的光之神骑，后执行私令成为假旗统帅并被黑龙吞魂，职务与当前选择并不等同</text><rect x="64" y="2862" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2910" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2924">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2965" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2977">受教会支配的天使可以作不同选择，三主神与尼鲁达双灵格的制度操作逐渐揭明。终卷补送枪机缘、虚设至高称号以及女灵格赠格改立的</text><text x="88" y="3002" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3014">行为；教皇个人结局、改立的具体执行和完整新制度没有展示。</text><text x="64" y="3089" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3101">继续下一张：2/4。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3175" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3185">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
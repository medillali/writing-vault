<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2790" viewBox="0 0 1700 2790" role="img"><title>尼鲁达双灵格与神格 · 1/1</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">尼鲁达双灵格与神格 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">两独立灵格怎样面对共同历史与本源危机？</text><path d="M 114 372 V 2094" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 617 Q 1060 635 992 635" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 635 C 1115 635 1115 635 1115 653 L 1115 913 Q 1115 931 992 931" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 931 C 1060 931 1060 931 1060 949 L 1060 1897 Q 1060 1915 992 1915" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><rect x="1040" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="509.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="519.0">2</text><rect x="1095" y="766.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="787.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="797.0">1</text><rect x="1040" y="1406.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="1427.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="1437.0">3</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">15集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v15-e07 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">自然神真名说引出背叛推论</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">自然神称平衡神是切里莫；黑龙把三缺席君王、三主神和帝国远征相</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">连，但正文标明只是一面之词支撑的合理推测。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0166 L20239–20335</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">17集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v17-e05 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">尼鲁达双灵格及三主神历史揭示</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">圣柜密谈揭教皇与女天使同源分裂后各有独立灵格。历史回叙说明切</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">里莫、尼鲁达、安克瓦斯曾造光明分身，联手放逐大陆，后来互相清</text><text x="212" y="788" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="800">除；尼假死分魂潜伏，安已被切消灭，净世军本为切留下的子民。</text><text x="212" y="832" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="842">ch-0189 L22606–22642；ch-0190 L22657–22689</text><circle cx="114" cy="931" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="976" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="987">17集</text><path d="M 126 931 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="886" width="796" height="322" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="920" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="930">v17-e09 · 事实</text><text x="212" y="964" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="978">女灵格重掌公正神格、假战收信并打开红月</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">女灵格融合封存公正神格，以迦莲娜形态公开显现。她制造表演战斗</text><text x="212" y="1048" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1060">，黑龙未明全盘目的而克制应战；教皇改祷对象汇聚信力，使她短现</text><text x="212" y="1084" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1096">十翼再放能量开红月，退回四翼且受伤；黑龙只获其自报尼鲁达，尚</text><text x="212" y="1120" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1132">未见大陆回归。</text><text x="212" y="1164" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1174">ch-0192 L22927–22945；ch-0192 L22969–22975；ch-0193 L22990–23016</text><text x="212" y="1194" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1204">；ch-0193 L23024–23108</text><circle cx="114" cy="1293" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1338" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1349">18集</text><path d="M 126 1293 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1248" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1282" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1292">v18-e01 · 事实</text><text x="212" y="1326" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1340">哈力及子民跨界归来</text><text x="212" y="1374" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1386">黑龙、哈力、尼女协作导引，哈力与大批子民进入物质位面；互开灵</text><text x="212" y="1410" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1422">魂确立信任，双方拟演退兵以换西北至死亡沙漠领地。没有把物理大</text><text x="212" y="1446" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1458">陆整体迁来。</text><text x="212" y="1490" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1500">ch-0195 L23122–23138；ch-0196 L23183–23261</text><circle cx="114" cy="1589" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1634" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1645">18集</text><path d="M 126 1589 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1544" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1578" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1588">v18-e05 · 事实</text><text x="212" y="1622" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1636">五力量分身吞天使补能</text><text x="212" y="1670" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1682">三人遭无自我光影天使拦截，黑龙放出五受控力量体吞噬，全部回收</text><text x="212" y="1706" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1718">后消化，气息大增；尼女辨黑晶即混沌之灵实体，并回想教皇送枪布</text><text x="212" y="1742" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1754">局。</text><text x="212" y="1786" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1796">ch-0199 L23795–23813；ch-0199 L23828–23873；ch-0200 L23874–23904</text><text x="212" y="1816" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1826">；ch-0201 L24158–24172</text><circle cx="114" cy="1915" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1960" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1971">18集</text><path d="M 126 1915 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1870" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1904" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1914">v18-e08 · 事实</text><text x="212" y="1948" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1962">托付子民与无胜算夺志</text><text x="212" y="1996" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2008">本源吞噬虚无，黑龙要求哈力、尼女回去减少所有种族死亡，将君王</text><text x="212" y="2032" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2044">烙印交哈力，接受公正神格，以混沌之灵化银团投本源争取代意志。</text><text x="212" y="2076" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2086">ch-0202 L24335–24369</text><text x="64" y="2166" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2180">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2221" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2233">01  回收 · 研究推断 · v17-e05 → v17-e09</text><text x="84" y="2260" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2272">封存神格和双灵格合作在公开仪式中兑现，旧身份源得到当前行动验证。</text><text x="84" y="2309" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2321">02  揭示 · 事实 · v15-e07 → v17-e05</text><text x="84" y="2348" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2360">先前缺席君王与三主神的推测得到向读者展开的历史说明；黑龙此时并未同步获得全部历史</text><text x="84" y="2397" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2409">03  回收 · 事实 · v17-e09 → v18-e08</text><text x="84" y="2436" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2448">曾重掌公正神格的女灵格最终主动赠格并疲惫离去，教皇另一人格的寿命后果并未同时得到交代</text><rect x="64" y="2482" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2530" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2544">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2585" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2597">教皇与迦莲娜躯内尼鲁达灵格已有独立人格，不能按共同来源合并。女灵格终卷交公正神格后削翼疲惫离开，教皇余寿没有直接结局；未</text><text x="88" y="2622" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2634">显示二者复合、原天使人格恢复或二者后记去向。</text><text x="64" y="2746" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2756">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
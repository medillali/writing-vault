<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3519" viewBox="0 0 1700 3519" role="img"><title>帝国来源、黑晶与回归 · 4/6</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">帝国来源、黑晶与回归 · 4/6</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">旧帝国及黑晶的来源与放逐后果怎样得到说明？</text><path d="M 114 372 V 2246" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 617 Q 1060 635 992 635" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 635 C 1115 635 1115 635 1115 653 L 1115 1529 Q 1115 1547 992 1547" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 635 C 1170 635 1170 635 1170 653 L 1170 943 Q 1170 961 992 961" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1287 C 1060 1287 1060 1287 1060 1305 L 1060 1529 Q 1060 1547 992 1547" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1547 C 1170 1547 1170 1547 1170 1565 L 1170 1789 Q 1170 1807 992 1807" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1547 C 1225 1547 1225 1547 1225 1565 L 1225 2049 Q 1225 2067 992 2067" stroke="#537aa0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a537aa0)"/><rect x="1040" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="509.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="519.0">1</text><rect x="1095" y="1074.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="1095.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="1105.0">6</text><rect x="1150" y="781.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="802.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="812.0">2</text><rect x="1040" y="1400.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="1421.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="1431.0">3</text><rect x="1150" y="1660.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="1681.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="1691.0">4</text><rect x="1205" y="1790.0" width="42" height="34" rx="8" fill="white" stroke="#537aa0"/><text x="1212" y="1811.0" font-size="20" font-weight="700" fill="#537aa0" data-left="1212" data-right="1246" data-bottom="1821.0">5</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">14集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v14-e01 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">七月回溯与使命说明</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黑龙在时空之轮中回溯自身生命，提升灵魂感应和覆盖范围内分控。</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">霍夫曼解释死亡世界使命，召集旧学生与上位者准备开遗迹。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0143 L17714–17780；ch-0143 L17798–17807；ch-0144 L17811–17840</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">14集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v14-e02 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">开启遗迹、霍夫曼灭魂与分身传承</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">遗迹灾变中黑龙因不会飞行错失入口，霍夫曼被时间囚笼中的切罗曼</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">尔分身灭魂。分身借烙印传法使黑龙自行抵达，授记忆而不授力量；</text><text x="212" y="788" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="800">两年传承细节由后文补述。</text><text x="212" y="832" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="842">ch-0145 L17959–18000；ch-0145 L18024–18039；ch-0146 L18043–18122</text><text x="212" y="862" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="872">；ch-0147 L18189–18197；ch-0150 L18492–18495</text><circle cx="114" cy="961" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1006" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1017">14集</text><path d="M 126 961 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="916" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="950" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="960">v14-e03 · 事实</text><text x="212" y="994" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1008">逐段归途与神骑有条件放行</text><text x="212" y="1042" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1054">黑龙携金龙等十五名强者按位面坐标跳转，古巴避走告警。途中自然</text><text x="212" y="1078" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1090">神骑阻击，黑龙实练新术；光之神骑自报谢菲里安，按本位面出生及</text><text x="212" y="1114" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1126">实力承认通行。此时尚未与旧同伴会合。</text><text x="212" y="1158" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1168">ch-0147 L18157–18213；ch-0148 L18243–18292；ch-0148 L18339–18350</text><text x="212" y="1188" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1198">；ch-0149 L18418–18488</text><circle cx="114" cy="1287" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1332" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1343">15集</text><path d="M 126 1287 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1242" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1276" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1286">v15-e05 · 事实</text><text x="212" y="1320" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1334">独耗禁咒后遇泰坦与来袭天使</text><text x="212" y="1368" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1380">黑龙付魂力代价独闯，毁傀儡后封印自行开；泰坦先攻，四翼女子来</text><text x="212" y="1404" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1416">袭使双方暂联手毁其躯体、迫圣气退走。</text><text x="212" y="1448" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1458">ch-0162 L19782–19858；ch-0163 L19862–19985</text><circle cx="114" cy="1547" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1592" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1603">15集</text><path d="M 126 1547 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1502" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1536" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1546">v15-e06 · 事实</text><text x="212" y="1580" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1594">三圣器联系失落大陆并带守护者离开</text><text x="212" y="1628" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1640">大贤者讲亲历，三器触发意念见证红月通道、浮陆和哈力维亚。黑龙</text><text x="212" y="1664" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1676">获死亡之眼与最后未用禁咒，毁墓带二守护者返回。</text><text x="212" y="1708" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1718">ch-0164 L19997–20090；ch-0165 L20091–20207</text><circle cx="114" cy="1807" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1852" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1863">15集</text><path d="M 126 1807 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1762" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1796" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1806">v15-e07 · 事实</text><text x="212" y="1840" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1854">自然神真名说引出背叛推论</text><text x="212" y="1888" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1900">自然神称平衡神是切里莫；黑龙把三缺席君王、三主神和帝国远征相</text><text x="212" y="1924" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1936">连，但正文标明只是一面之词支撑的合理推测。</text><text x="212" y="1968" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1978">ch-0166 L20239–20335</text><circle cx="114" cy="2067" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2112" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2123">15集</text><path d="M 126 2067 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2022" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2056" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2066">v15-e09 · 事实</text><text x="212" y="2100" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2114">最后巫师自称达罗亚归来</text><text x="212" y="2148" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2160">战死、自爆与主动合一只余一人，侵蚀一名降临天使躯体后自报达罗</text><text x="212" y="2184" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2196">亚力绯克；黑龙会意挥手出城。</text><text x="212" y="2228" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2238">ch-0167 L20470–20499</text><text x="64" y="2318" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2332">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2373" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2385">01  铺垫 · 研究推断 · v14-e01 → v14-e02</text><text x="84" y="2412" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2424">使命与召集给开启遗迹提供目的及队伍，能力提升仍未补足飞行前提。</text><text x="84" y="2461" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2473">02  因果 · 研究推断 · v14-e02 → v14-e03</text><text x="84" y="2500" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2512">传承坐标与知识使分段返程及临战新术成为可能。</text><text x="84" y="2549" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2561">03  铺垫 · 研究推断 · v15-e05 → v15-e06</text><text x="84" y="2588" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2600">误会缓解和共同退敌使守护者进入交流与交眼。</text><text x="84" y="2637" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2649">04  因果 · 研究推断 · v15-e06 → v15-e07</text><text x="84" y="2676" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2688">回归要求中的平衡与残警告推动黑龙向自然神索真名。</text><text x="84" y="2725" font-size="23" font-weight="700" fill="#537aa0" data-left="84" data-right="1602" data-bottom="2737">05  呼应 · 研究推断 · v15-e06 → v15-e09</text><text x="84" y="2764" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2776">远方旧君王联系与现场自称旧君王形成历史进入现时的呼应。</text><text x="84" y="2813" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2825">06  回收 · 研究推断 · v14-e02 → v15-e06</text><text x="84" y="2852" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2864">继承的知识支持识别遗物和寻找旧帝国，使命接续仍不保证继承者理解全部隐情</text><text x="84" y="2901" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2913">07  揭示 · 事实 · v15-e09 → v16-e01〔跨页接续〕</text><text x="84" y="2940" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2952">红月聚合后的宣告被解释为达罗亚借信徒传力强降；向菲力普说切里莫之名并非二者同一人的证据</text><text x="84" y="2989" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="3001">08  转折 · 事实 · v15-e06 → v16-e05〔跨页接续〕</text><text x="84" y="3028" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3040">寻回旧帝国的共同方向被达罗亚用来骗取信任，黑龙随后遭封魂夺体；同族并不保证利益一致</text><text x="84" y="3077" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="3089">09  揭示 · 事实 · v15-e07 → v17-e05〔跨页接续〕</text><text x="84" y="3116" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3128">先前缺席君王与三主神的推测得到向读者展开的历史说明；黑龙此时并未同步获得全部历史</text><rect x="64" y="3162" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="3210" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="3224">部分回收 · 终点边界（第18集复核）</text><text x="88" y="3265" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3277">三君王及放逐史、哈力与子民灵魂回归、黑晶为混沌之灵实体、残印被抹及切里莫造新本源陆续明确。起始之夜旧本源觉醒到爆炸的完整</text><text x="88" y="3302" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3314">讲述被打断，切里莫口述不等独立证实的全部宇宙史；回归也不是物理大陆迁来。</text><text x="64" y="3389" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3401">继续下一张：5/6。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3475" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3485">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
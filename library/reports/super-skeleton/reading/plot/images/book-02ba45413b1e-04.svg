<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3034" viewBox="0 0 1700 3034" role="img"><title>光明制度与神祇主体 · 4/4</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">光明制度与神祇主体 · 4/4</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">信徒力量的分配与神祇代理权最终如何重组？</text><path d="M 114 372 V 2426" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 653 Q 1060 671 992 671" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 671 C 1115 671 1115 671 1115 689 L 1115 1933 Q 1115 1951 992 1951" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><rect x="1040" y="506.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="527.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="537.0">1</text><rect x="1095" y="1294.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="1315.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="1325.0">2</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">17集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v17-e07 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">黑龙归来吞灭假统帅，取得局部身份线索</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">魂链恢复，黑龙到场否认假军归属；光与安德鲁亮出旧身份及尼鲁达</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">名号后，被黑龙吞魂取忆。记忆确认女天使为神骑老师、教皇与尼传</text><text x="212" y="528" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="540">承有关，两人随后明确魂散。</text><text x="212" y="572" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="582">ch-0191 L22788–22820；ch-0191 L22821–22862；ch-0192 L22872–22874</text><circle cx="114" cy="671" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="716" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="727">17集</text><path d="M 126 671 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="626" width="796" height="322" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="660" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="670">v17-e09 · 事实</text><text x="212" y="704" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="718">女灵格重掌公正神格、假战收信并打开红月</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">女灵格融合封存公正神格，以迦莲娜形态公开显现。她制造表演战斗</text><text x="212" y="788" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="800">，黑龙未明全盘目的而克制应战；教皇改祷对象汇聚信力，使她短现</text><text x="212" y="824" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="836">十翼再放能量开红月，退回四翼且受伤；黑龙只获其自报尼鲁达，尚</text><text x="212" y="860" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="872">未见大陆回归。</text><text x="212" y="904" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="914">ch-0192 L22927–22945；ch-0192 L22969–22975；ch-0193 L22990–23016</text><text x="212" y="934" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="944">；ch-0193 L23024–23108</text><circle cx="114" cy="1033" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1078" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1089">18集</text><path d="M 126 1033 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="988" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1022" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1032">v18-e01 · 事实</text><text x="212" y="1066" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1080">哈力及子民跨界归来</text><text x="212" y="1114" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1126">黑龙、哈力、尼女协作导引，哈力与大批子民进入物质位面；互开灵</text><text x="212" y="1150" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1162">魂确立信任，双方拟演退兵以换西北至死亡沙漠领地。没有把物理大</text><text x="212" y="1186" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1198">陆整体迁来。</text><text x="212" y="1230" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1240">ch-0195 L23122–23138；ch-0196 L23183–23261</text><circle cx="114" cy="1329" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1374" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1385">18集</text><path d="M 126 1329 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1284" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1318" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1328">v18-e05 · 事实</text><text x="212" y="1362" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1376">五力量分身吞天使补能</text><text x="212" y="1410" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1422">三人遭无自我光影天使拦截，黑龙放出五受控力量体吞噬，全部回收</text><text x="212" y="1446" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1458">后消化，气息大增；尼女辨黑晶即混沌之灵实体，并回想教皇送枪布</text><text x="212" y="1482" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1494">局。</text><text x="212" y="1526" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1536">ch-0199 L23795–23813；ch-0199 L23828–23873；ch-0200 L23874–23904</text><text x="212" y="1556" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1566">；ch-0201 L24158–24172</text><circle cx="114" cy="1655" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1700" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1711">18集</text><path d="M 126 1655 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1610" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1644" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1654">v18-e07 · 事实</text><text x="212" y="1688" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1702">本源真相与创造者死亡</text><text x="212" y="1736" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1748">三人抵巨球，切里莫以起源说辞拖延。黑龙看破收集生命能量，光球</text><text x="212" y="1772" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1784">随地面屠杀增强互证；切里莫借力时被本源吞噬，残意无本源并把构</text><text x="212" y="1808" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1820">想和危机传黑龙。</text><text x="212" y="1852" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1862">ch-0201 L24189–24218；ch-0202 L24239–24334</text><circle cx="114" cy="1951" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1996" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2007">18集</text><path d="M 126 1951 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1906" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1940" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1950">v18-e08 · 事实</text><text x="212" y="1984" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1998">托付子民与无胜算夺志</text><text x="212" y="2032" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2044">本源吞噬虚无，黑龙要求哈力、尼女回去减少所有种族死亡，将君王</text><text x="212" y="2068" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2080">烙印交哈力，接受公正神格，以混沌之灵化银团投本源争取代意志。</text><text x="212" y="2112" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2122">ch-0202 L24335–24369</text><circle cx="114" cy="2211" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2256" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2267">18集</text><path d="M 126 2211 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2166" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2200" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2210">v18-e09 · 事实</text><text x="212" y="2244" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2258">未知年后的共处与归来</text><text x="212" y="2292" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2304">后记黑龙意识醒来，看见飞艇、巨龙运输、深渊出入门、多族市场与</text><text x="212" y="2328" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2340">蓝晶售冰。菲力普、罗得、斯文、娜娜仍在；哈力号角迎回，黑龙重</text><text x="212" y="2364" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2376">现原形。</text><text x="212" y="2408" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2418">ch-0202 L24373–24397</text><text x="64" y="2498" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2512">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2553" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2565">01  铺垫 · 研究推断 · v17-e07 → v17-e09</text><text x="84" y="2592" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2604">吞忆得知女天使为老师却仍不明全局，使黑龙交手时保留力量等待解释。</text><text x="84" y="2641" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2653">02  回收 · 事实 · v17-e09 → v18-e08</text><text x="84" y="2680" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2692">曾重掌公正神格的女灵格最终主动赠格并疲惫离去，教皇另一人格的寿命后果并未同时得到交代</text><rect x="64" y="2726" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2774" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2788">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2829" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2841">受教会支配的天使可以作不同选择，三主神与尼鲁达双灵格的制度操作逐渐揭明。终卷补送枪机缘、虚设至高称号以及女灵格赠格改立的</text><text x="88" y="2866" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2878">行为；教皇个人结局、改立的具体执行和完整新制度没有展示。</text><text x="64" y="2990" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3000">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
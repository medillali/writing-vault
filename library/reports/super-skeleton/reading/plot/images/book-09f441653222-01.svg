<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3191" viewBox="0 0 1700 3191" role="img"><title>原萝茜的记忆与借力主体 · 1/3</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">原萝茜的记忆与借力主体 · 1/3</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">原萝茜能否整合残忆并自主运用借来力量？</text><path d="M 114 372 V 2006" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 617 Q 1060 635 992 635" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 635 C 1115 635 1115 635 1115 653 L 1115 1101 Q 1115 1119 992 1119" stroke="#c05c25" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#ac05c25)"/><path d="M 984 635 C 1170 635 1170 635 1170 653 L 1170 1325 Q 1170 1343 992 1343" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 1119 C 1060 1119 1060 1119 1060 1137 L 1060 1809 Q 1060 1827 992 1827" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1119 C 1225 1119 1225 1119 1225 1137 L 1225 1325 Q 1225 1343 992 1343" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1343 C 1115 1343 1115 1343 1115 1361 L 1115 1585 Q 1115 1603 992 1603" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><rect x="1040" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="509.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="519.0">1</text><rect x="1095" y="860.0" width="42" height="34" rx="8" fill="white" stroke="#c05c25"/><text x="1102" y="881.0" font-size="20" font-weight="700" fill="#c05c25" data-left="1102" data-right="1136" data-bottom="891.0">4</text><rect x="1150" y="972.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1157" y="993.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1157" data-right="1191" data-bottom="1003.0">5</text><rect x="1040" y="1456.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="1477.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="1487.0">6</text><rect x="1205" y="1214.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1212" y="1235.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1212" data-right="1246" data-bottom="1245.0">2</text><rect x="1095" y="1456.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1102" y="1477.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1102" data-right="1136" data-bottom="1487.0">7</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">05集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v05-e01 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">假死突围与九死</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黑龙救黑七并擒萝茜突围，飞剑杀萝茜；幸存圣骑离去，身份无法保</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">密。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0045 L5497–5568</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">05集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v05-e03 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">天使借体降临</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">圣山仪式降下七阶战斗天使，降临者自称拉西萝茜。</text><text x="212" y="760" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="770">ch-0047 L5773–5815</text><circle cx="114" cy="859" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="904" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="915">06集</text><path d="M 126 859 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="814" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="848" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="858">v06-e05 · 事实</text><text x="212" y="892" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="906">天使战中灵魂武装觉醒</text><text x="212" y="940" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="952">龙焰躯体被毁，黑龙从黑大经验推导魂剑魂甲，天使试图焚身降本体</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">。</text><text x="212" y="1020" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1030">ch-0063 L7721–7823</text><circle cx="114" cy="1119" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1164" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1175">06集</text><path d="M 126 1119 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1074" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1108" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1118">v06-e06 · 事实</text><text x="212" y="1152" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1166">斯科特封印天使并确认印记</text><text x="212" y="1200" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1212">数百亡灵束缚天使，斯科特禁咒封其本源，说明路标及悼亡层级。</text><text x="212" y="1244" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1254">ch-0064 L7861–7897</text><circle cx="114" cy="1343" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1388" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1399">06集</text><path d="M 126 1343 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1298" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1332" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1342">v06-e09 · 事实</text><text x="212" y="1376" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1390">原萝茜补魂苏醒却失忆</text><text x="212" y="1424" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1436">为情报目的，黑龙补足原萝茜残灵所缺之魂；其复仇举动反噬，记忆</text><text x="212" y="1460" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1472">残缺，魅看守。</text><text x="212" y="1504" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1514">ch-0066 L8177–8214</text><circle cx="114" cy="1603" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1648" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1659">07集</text><path d="M 126 1603 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1558" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1592" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1602">v07-e03 · 事实</text><text x="212" y="1636" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1650">娜娜关心打断萝茜旧杀意</text><text x="212" y="1684" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1696">失忆萝茜因娜娜本名生杀意又因关心消退，背后阴影匕首随之消散。</text><text x="212" y="1728" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1738">ch-0071 L8735–8776</text><circle cx="114" cy="1827" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1872" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1883">07集</text><path d="M 126 1827 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1782" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1816" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1826">v07-e05 · 事实</text><text x="212" y="1860" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1874">隐史与元力知识传授</text><text x="212" y="1908" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1920">斯科特承认隐瞒，讲述古帝国兴亡和君王依赖链，并以封存天使提供</text><text x="212" y="1944" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1956">元力运用知识。</text><text x="212" y="1988" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1998">ch-0073 L9089–9116；ch-0073 L9203–9216；ch-0074 L9221–9240</text><text x="64" y="2078" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2092">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2133" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2145">01  铺垫 · 研究推断 · v05-e01 → v05-e03</text><text x="84" y="2172" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2184">死亡萝茜与借体天使形成后续身份问题，暂不等同原人格复生。</text><text x="84" y="2221" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2233">02  因果 · 事实 · v06-e06 → v06-e09</text><text x="84" y="2260" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2272">天使被封印使残灵能够重聚，才有补魂苏醒条件。</text><text x="84" y="2309" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2321">03  因果 · 事实 · v07-e05 → v07-e06〔跨页接续〕</text><text x="84" y="2348" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2360">封存天使意念提供运用方法，黑龙经过一个月消化取得元力感知。</text><text x="84" y="2397" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="2409">04  转折 · 事实 · v05-e03 → v06-e06</text><text x="84" y="2436" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2448">借体降临的强敌被群体控制后封印本源；封印不等于杀灭</text><text x="84" y="2485" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2497">05  揭示 · 事实 · v05-e03 → v06-e09</text><text x="84" y="2524" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2536">降临者采用萝茜名字的疑问回收为天使与原残灵分离；原萝茜补魂醒来仍失忆</text><text x="84" y="2573" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2585">06  回收 · 事实 · v06-e06 → v07-e05</text><text x="84" y="2612" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2624">封存天使后来成为元力知识来源；其遭吸收与原萝茜失忆后的经历分别记录</text><text x="84" y="2661" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2673">07  揭示 · 事实 · v06-e09 → v07-e03</text><text x="84" y="2700" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2712">补魂失忆后仍有姓名触发的敌意，娜娜的关心使本次杀意退去；未证明完整恢复记忆</text><text x="84" y="2749" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2761">08  铺垫 · 研究推断 · v07-e03 → v08-e08〔跨页接续〕</text><text x="84" y="2788" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2800">与娜娜建立的新关系进一步成为接触克丽丝的渠道，旧人格和记忆仍未恢复</text><rect x="64" y="2834" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2882" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2896">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2937" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2949">原萝茜苏醒、异源残忆与借克丽丝力量护墙都已呈现，旧恨和亲近并存。第七集降临天使意念被吞并不等于原萝茜人格与克丽丝合并，后</text><text x="88" y="2974" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2986">记未点名她；记忆完全整合及最终生活仍保留未知。</text><text x="64" y="3061" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3073">继续下一张：2/3。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3147" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3157">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
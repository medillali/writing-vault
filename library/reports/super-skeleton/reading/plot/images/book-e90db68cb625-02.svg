<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3197" viewBox="0 0 1700 3197" role="img"><title>克丽丝的传承与脱封机会 · 2/3</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">克丽丝的传承与脱封机会 · 2/3</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">克丽丝是否能借黑龙和媒介摆脱封印？</text><path d="M 114 372 V 2276" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 635 C 1060 635 1060 635 1060 653 L 1060 877 Q 1060 895 992 895" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 635 C 1115 635 1115 635 1115 653 L 1115 877 Q 1115 895 992 895" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 895 C 1170 895 1170 895 1170 913 L 1170 1167 Q 1170 1185 992 1185" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1765 C 1060 1765 1060 1765 1060 1783 L 1060 2043 Q 1060 2061 992 2061" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><rect x="1040" y="748.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="769.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="779.0">1</text><rect x="1095" y="748.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="769.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="779.0">2</text><rect x="1150" y="1023.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1157" y="1044.0" font-size="20" font-weight="700" fill="#087f65" data-left="1157" data-right="1191" data-bottom="1054.0">4</text><rect x="1040" y="1896.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="1917.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="1927.0">3</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">10集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v10-e09 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">分身降临破外封，洞内仍有魂封</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">萝茜受改体与注能耗竭，双星失衡崩塌；四人进入内洞见六芒星封魂</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">与未知声音，未完成救援。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0105 L13770–13802；ch-0105 L13815–13836；ch-0105 L13843–13871</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">11集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v11-e03 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">吞神分流与信任破裂</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">黑龙吞掉海皇神识，以分流免爆体并恢复躯体；责怪却理解斯科特，</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">明确拒再帮克丽丝。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0109 L14180–14208；ch-0110 L14214–14294；ch-0110 L14295–14316</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">11集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v11-e04 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">女神转求娜娜与海蛇转生</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">娜娜接到新求助；十孩获真武装后，黑龙耗半魂转生海蛇并找到旧帝</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">国遗物，回船续航。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0111 L14321–14331；ch-0111 L14344–14354；ch-0111 L14360–14397</text><text x="212" y="1086" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1096">；ch-0111 L14428–14435</text><circle cx="114" cy="1185" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1230" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1241">13集</text><path d="M 126 1185 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1140" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1174" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1184">v13-e02 · 事实</text><text x="212" y="1218" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1232">自然神合作与双神传承安排</text><text x="212" y="1266" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1278">自然神确认残源处境，以帝国线索促合作；双神选娜娜共同传承，萝</text><text x="212" y="1302" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1314">茜留护并开始三力融合，仪式尚未完成。</text><text x="212" y="1346" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1356">ch-0132 L16606–16641；ch-0133 L16710–16714；ch-0133 L16750–16773</text><text x="212" y="1376" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1386">；ch-0133 L16787–16813</text><circle cx="114" cy="1475" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1520" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1531">13集</text><path d="M 126 1475 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1430" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1464" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1474">v13-e03 · 事实</text><text x="212" y="1508" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1522">菲力普强制放逐与先知退敌</text><text x="212" y="1556" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1568">菲力普的自保盘算先由独处视角揭示，随后他抢在弗里昂之前隔离并</text><text x="212" y="1592" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1604">放逐黑龙；另一处先知消灭两低阶天使，弗里昂逃走。</text><text x="212" y="1636" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1646">ch-0132 L16659–16690；ch-0134 L16868–16894；ch-0134 L16901–16916</text><text x="212" y="1666" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1676">；ch-0135 L16948–16957</text><circle cx="114" cy="1765" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1810" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1821">14集</text><path d="M 126 1765 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1720" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1754" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1764">v14-e08 · 事实</text><text x="212" y="1798" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1812">会议追责与一百五十万活尸方案</text><text x="212" y="1846" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1858">斯文哥尔等追问额外杀戮与二十万俘虏中约十万劳死；先知已在塞茵</text><text x="212" y="1882" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1894">设置活尸阵并试过个体，准备牺牲全城一百五十万人用于毁灭双方军</text><text x="212" y="1918" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1930">队并扩张。斯科特明确赞同，毕瑟态度只是旁观推测。</text><text x="212" y="1962" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1972">ch-0153 L18915–18963；ch-0153 L18968–19004；ch-0154 L19005–19008</text><circle cx="114" cy="2061" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2106" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2117">14集</text><path d="M 126 2061 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2016" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2050" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2060">v14-e09 · 事实</text><text x="212" y="2094" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2108">两神借身对峙，黑龙归来但未裁决</text><text x="212" y="2142" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2154">自然神通过娜娜、克丽丝通过萝茜显现，先知威胁眼前两分身。魂链</text><text x="212" y="2178" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2190">恢复后黑龙携队到场询问是否要打架，活尸阵处置、先知责任和战争</text><text x="212" y="2214" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2226">结局均未在本集裁决。</text><text x="212" y="2258" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2268">ch-0154 L19009–19047</text><text x="64" y="2348" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2362">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2403" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2415">01  因果 · 研究推断 · v11-e03 → v11-e04</text><text x="84" y="2442" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2454">拒绝再援使克丽丝转求娜娜</text><text x="84" y="2491" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2503">02  铺垫 · 研究推断 · v11-e03 → v11-e04</text><text x="84" y="2530" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2542">新增力量支持昂贵的海蛇转生</text><text x="84" y="2579" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2591">03  因果 · 研究推断 · v14-e08 → v14-e09</text><text x="84" y="2618" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2630">全城活尸方案使两神通过载体介入反对；该因果仅指神祇对峙，不指黑龙因争论而归来。</text><text x="84" y="2667" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2679">04  回收 · 事实 · v11-e04 → v13-e02</text><text x="84" y="2706" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2718">克丽丝向娜娜求助后进入双神共同传承安排，已选定与开始准备不等于完成仪式或解除封印</text><text x="84" y="2755" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2767">05  回收 · 事实 · v13-e02 → v16-e04〔跨页接续〕</text><text x="84" y="2794" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2806">双神传承安排获得后文叙述确认，但媒介娜娜的意愿、神明本源与成神仍是不同问题</text><rect x="64" y="2840" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2888" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2902">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2943" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2955">克丽丝冥月女神身份、封印、选择娜娜传承和萝茜代言陆续明确，终卷又交代她独立领悟、未参加当年放逐。没有直接写本体解封或后记</text><text x="88" y="2980" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2992">个人去向；娜娜青春不能替代她本人获释的证据。</text><text x="64" y="3067" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3079">继续下一张：3/3。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3153" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3163">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
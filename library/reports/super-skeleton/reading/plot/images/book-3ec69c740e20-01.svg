<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2138" viewBox="0 0 1700 2138" role="img"><title>独立本源与超脱规则 · 1/1</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">独立本源与超脱规则 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">制造者如何失去本源控制，黑龙能否阻止其吞噬世界？</text><path d="M 114 372 V 1442" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 653 Q 1060 671 992 671" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 671 C 1115 671 1115 671 1115 689 L 1115 949 Q 1115 967 992 967" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 967 C 1060 967 1060 967 1060 985 L 1060 1209 Q 1060 1227 992 1227" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><rect x="1040" y="506.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="527.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="537.0">3</text><rect x="1095" y="802.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="823.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="833.0">1</text><rect x="1040" y="1080.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="1101.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="1111.0">2</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">17集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v17-e05 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">尼鲁达双灵格及三主神历史揭示</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">圣柜密谈揭教皇与女天使同源分裂后各有独立灵格。历史回叙说明切</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">里莫、尼鲁达、安克瓦斯曾造光明分身，联手放逐大陆，后来互相清</text><text x="212" y="528" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="540">除；尼假死分魂潜伏，安已被切消灭，净世军本为切留下的子民。</text><text x="212" y="572" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="582">ch-0189 L22606–22642；ch-0190 L22657–22689</text><circle cx="114" cy="671" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="716" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="727">18集</text><path d="M 126 671 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="626" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="660" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="670">v18-e07 · 事实</text><text x="212" y="704" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="718">本源真相与创造者死亡</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">三人抵巨球，切里莫以起源说辞拖延。黑龙看破收集生命能量，光球</text><text x="212" y="788" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="800">随地面屠杀增强互证；切里莫借力时被本源吞噬，残意无本源并把构</text><text x="212" y="824" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="836">想和危机传黑龙。</text><text x="212" y="868" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="878">ch-0201 L24189–24218；ch-0202 L24239–24334</text><circle cx="114" cy="967" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1012" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1023">18集</text><path d="M 126 967 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="922" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="956" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="966">v18-e08 · 事实</text><text x="212" y="1000" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1014">托付子民与无胜算夺志</text><text x="212" y="1048" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1060">本源吞噬虚无，黑龙要求哈力、尼女回去减少所有种族死亡，将君王</text><text x="212" y="1084" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1096">烙印交哈力，接受公正神格，以混沌之灵化银团投本源争取代意志。</text><text x="212" y="1128" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1138">ch-0202 L24335–24369</text><circle cx="114" cy="1227" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1272" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1283">18集</text><path d="M 126 1227 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1182" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1216" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1226">v18-e09 · 事实</text><text x="212" y="1260" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1274">未知年后的共处与归来</text><text x="212" y="1308" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1320">后记黑龙意识醒来，看见飞艇、巨龙运输、深渊出入门、多族市场与</text><text x="212" y="1344" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1356">蓝晶售冰。菲力普、罗得、斯文、娜娜仍在；哈力号角迎回，黑龙重</text><text x="212" y="1380" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1392">现原形。</text><text x="212" y="1424" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1434">ch-0202 L24373–24397</text><text x="64" y="1514" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="1528">旁路关系说明 · 编号对应图中连线</text><text x="84" y="1569" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="1581">01  因果 · 研究推断 · v18-e07 → v18-e08</text><text x="84" y="1608" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1620">切里莫残意提供本源危机和唯一替代方法，使黑龙改变战斗目标。</text><text x="84" y="1657" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="1669">02  回收 · 研究推断 · v18-e08 → v18-e09</text><text x="84" y="1696" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1708">自由存在与同伴生存愿望，在多年后的共处生活和主体归来中获得结果见证，过程未描写。</text><text x="84" y="1745" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="1757">03  揭示 · 事实 · v17-e05 → v18-e07</text><text x="84" y="1784" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1796">旧帝国与神祇历史接续为切里莫制造本源并被反噬；旧宇宙起源的口述尚未讲完，已证死亡与未证传说分别保留</text><rect x="64" y="1830" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="1878" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="1892">部分回收 · 终点边界（第18集复核）</text><text x="88" y="1933" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="1945">切里莫造本源求超脱却被吞灭有明确叙述；黑龙投入争夺意志，后记世界存续并醒返。没有展示内部胜负经过、切里莫所造本源的原有意</text><text x="88" y="1970" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="1982">识如何处置或黑龙最终权限，不能补成全机制解释或全能等级。</text><text x="64" y="2094" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2104">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
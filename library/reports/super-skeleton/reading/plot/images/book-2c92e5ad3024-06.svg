<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2354" viewBox="0 0 1700 2354" role="img"><title>帝国来源、黑晶与回归 · 6/6</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">帝国来源、黑晶与回归 · 6/6</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">旧帝国及黑晶的来源与放逐后果怎样得到说明？</text><path d="M 114 372 V 1834" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 719 Q 1060 737 992 737" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><rect x="1040" y="539.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="560.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="570.0">1</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">17集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="322" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v17-e09 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">女灵格重掌公正神格、假战收信并打开红月</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">女灵格融合封存公正神格，以迦莲娜形态公开显现。她制造表演战斗</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">，黑龙未明全盘目的而克制应战；教皇改祷对象汇聚信力，使她短现</text><text x="212" y="528" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="540">十翼再放能量开红月，退回四翼且受伤；黑龙只获其自报尼鲁达，尚</text><text x="212" y="564" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="576">未见大陆回归。</text><text x="212" y="608" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="618">ch-0192 L22927–22945；ch-0192 L22969–22975；ch-0193 L22990–23016</text><text x="212" y="638" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="648">；ch-0193 L23024–23108</text><circle cx="114" cy="737" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="782" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="793">18集</text><path d="M 126 737 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="692" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="726" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="736">v18-e01 · 事实</text><text x="212" y="770" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="784">哈力及子民跨界归来</text><text x="212" y="818" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="830">黑龙、哈力、尼女协作导引，哈力与大批子民进入物质位面；互开灵</text><text x="212" y="854" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="866">魂确立信任，双方拟演退兵以换西北至死亡沙漠领地。没有把物理大</text><text x="212" y="890" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="902">陆整体迁来。</text><text x="212" y="934" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="944">ch-0195 L23122–23138；ch-0196 L23183–23261</text><circle cx="114" cy="1033" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1078" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1089">18集</text><path d="M 126 1033 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="988" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1022" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1032">v18-e05 · 事实</text><text x="212" y="1066" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1080">五力量分身吞天使补能</text><text x="212" y="1114" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1126">三人遭无自我光影天使拦截，黑龙放出五受控力量体吞噬，全部回收</text><text x="212" y="1150" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1162">后消化，气息大增；尼女辨黑晶即混沌之灵实体，并回想教皇送枪布</text><text x="212" y="1186" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1198">局。</text><text x="212" y="1230" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1240">ch-0199 L23795–23813；ch-0199 L23828–23873；ch-0200 L23874–23904</text><text x="212" y="1260" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1270">；ch-0201 L24158–24172</text><circle cx="114" cy="1359" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1404" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1415">18集</text><path d="M 126 1359 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1314" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1348" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1358">v18-e07 · 事实</text><text x="212" y="1392" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1406">本源真相与创造者死亡</text><text x="212" y="1440" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1452">三人抵巨球，切里莫以起源说辞拖延。黑龙看破收集生命能量，光球</text><text x="212" y="1476" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1488">随地面屠杀增强互证；切里莫借力时被本源吞噬，残意无本源并把构</text><text x="212" y="1512" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1524">想和危机传黑龙。</text><text x="212" y="1556" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1566">ch-0201 L24189–24218；ch-0202 L24239–24334</text><circle cx="114" cy="1655" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1700" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1711">18集</text><path d="M 126 1655 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1610" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1644" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1654">v18-e08 · 事实</text><text x="212" y="1688" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1702">托付子民与无胜算夺志</text><text x="212" y="1736" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1748">本源吞噬虚无，黑龙要求哈力、尼女回去减少所有种族死亡，将君王</text><text x="212" y="1772" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1784">烙印交哈力，接受公正神格，以混沌之灵化银团投本源争取代意志。</text><text x="212" y="1816" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1826">ch-0202 L24335–24369</text><text x="64" y="1906" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="1920">旁路关系说明 · 编号对应图中连线</text><text x="84" y="1961" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="1973">01  回收 · 事实 · v17-e09 → v18-e01</text><text x="84" y="2000" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2012">红月通道开启接续为哈力与子民灵魂跨界归来，并非把被放逐的物理大陆搬回</text><rect x="64" y="2046" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2094" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2108">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2149" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2161">三君王及放逐史、哈力与子民灵魂回归、黑晶为混沌之灵实体、残印被抹及切里莫造新本源陆续明确。起始之夜旧本源觉醒到爆炸的完整</text><text x="88" y="2186" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2198">讲述被打断，切里莫口述不等独立证实的全部宇宙史；回归也不是物理大陆迁来。</text><text x="64" y="2310" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2320">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
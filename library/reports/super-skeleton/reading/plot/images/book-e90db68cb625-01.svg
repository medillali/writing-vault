<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3263" viewBox="0 0 1700 3263" role="img"><title>克丽丝的传承与脱封机会 · 1/3</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">克丽丝的传承与脱封机会 · 1/3</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">克丽丝是否能借黑龙和媒介摆脱封印？</text><path d="M 114 372 V 2078" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 617 Q 1060 635 992 635" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1155 C 1060 1155 1060 1155 1060 1173 L 1060 1361 Q 1060 1379 992 1379" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1379 C 1115 1379 1115 1379 1115 1397 L 1115 1621 Q 1115 1639 992 1639" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1639 C 1060 1639 1060 1639 1060 1657 L 1060 1881 Q 1060 1899 992 1899" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><rect x="1040" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="509.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="519.0">1</text><rect x="1040" y="1250.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="1271.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="1281.0">3</text><rect x="1095" y="1492.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="1513.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="1523.0">4</text><rect x="1040" y="1752.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="1773.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="1783.0">5</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">02集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v02-e06 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">宝藏开启并完整融合记忆</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黑龙打开阿罗约次元空间，旧物触发完整记忆，取得晶石首饰和沉渊</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">木，魔力仍未继承。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0020 L2322–2332；ch-0021 L2336–2402</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">02集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v02-e08 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">沉渊木中的克丽丝邀学失败</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">自称冥月女神的克丽丝解释木块与神念，黑龙不信身份且拒绝高级魔</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">法诱惑。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0022 L2531–2596</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">06集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v06-e04 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">借肉迟疑与克丽丝教学曝光</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">火战毁皮后黑龙拟取娜娜肉却迟疑，改取水貂；娜娜治疗时说明克丽</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">丝授术。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0061 L7503–7578</text><circle cx="114" cy="1155" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1200" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1211">07集</text><path d="M 126 1155 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1110" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1144" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1154">v07-e03 · 事实</text><text x="212" y="1188" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1202">娜娜关心打断萝茜旧杀意</text><text x="212" y="1236" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1248">失忆萝茜因娜娜本名生杀意又因关心消退，背后阴影匕首随之消散。</text><text x="212" y="1280" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1290">ch-0071 L8735–8776</text><circle cx="114" cy="1379" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1424" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1435">08集</text><path d="M 126 1379 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1334" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1368" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1378">v08-e08 · 事实</text><text x="212" y="1412" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1426">萝茜通过娜娜见克丽丝</text><text x="212" y="1460" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1472">萝茜渐能运用暗黑力量仍失忆，经娜娜和沉渊木进入克丽丝世界并与</text><text x="212" y="1496" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1508">其相见。</text><text x="212" y="1540" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1550">ch-0087 L10888–10953</text><circle cx="114" cy="1639" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1684" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1695">09集</text><path d="M 126 1639 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1594" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1628" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1638">v09-e08 · 事实</text><text x="212" y="1672" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1686">同伴守谷与醒后围歼</text><text x="212" y="1720" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1732">墨菲斯循痕搜谷，罗得等守护，萝茜杀旧友护主；黑龙醒后协调六千</text><text x="212" y="1756" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1768">骨军与空骑围歼，但仍极弱。</text><text x="212" y="1800" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1810">ch-0094 L12019–12067；ch-0094 L12121–12143；ch-0095 L12181–12213</text><circle cx="114" cy="1899" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1944" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1955">10集</text><path d="M 126 1899 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1854" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1888" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1898">v10-e08 · 事实</text><text x="212" y="1932" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1946">克丽丝解释观察联系与神身份</text><text x="212" y="1980" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1992">克丽丝认出好友封印，受黑龙拒绝后说明借萝茜单向联系重叠视野，</text><text x="212" y="2016" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2028">并讲述自己由守族者成神。</text><text x="212" y="2060" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2070">ch-0105 L13695–13769</text><text x="64" y="2150" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2164">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2205" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2217">01  铺垫 · 事实 · v02-e06 → v02-e08</text><text x="84" y="2244" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2256">宝藏黑木与强灵魂触发远程对话</text><text x="84" y="2293" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2305">02  因果 · 事实 · v10-e08 → v10-e09〔跨页接续〕</text><text x="84" y="2332" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2344">解释后合作使黑龙召来萝茜，分身得以降临并拆外封。</text><text x="84" y="2381" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2393">03  铺垫 · 研究推断 · v07-e03 → v08-e08</text><text x="84" y="2420" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2432">与娜娜建立的新关系进一步成为接触克丽丝的渠道，旧人格和记忆仍未恢复</text><text x="84" y="2469" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2481">04  回收 · 事实 · v08-e08 → v09-e08</text><text x="84" y="2508" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2520">接触克丽丝后产生保护黑龙的新使命，萝茜行动履行使命但不认旧友；不据使命本身确认克丽丝神性</text><text x="84" y="2557" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2569">05  揭示 · 事实 · v09-e08 → v10-e08</text><text x="84" y="2596" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2608">萝茜的新使命后来显出观察黑龙视野的联系用途，角色与读者获知的时点分别保留</text><text x="84" y="2645" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2657">06  揭示 · 研究推断 · v02-e08 → v10-e09〔跨页接续〕</text><text x="84" y="2684" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2696">早期女神自称在私人视角和菲力普独立识认下获得更强证据；不据神性推定全部历史自述真实</text><text x="84" y="2733" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2745">07  揭示 · 事实 · v10-e08 → v11-e03〔跨页接续〕</text><text x="84" y="2772" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2784">观察与教学的深层目的由独处叙述解释为求自身脱困；黑龙并不因此获得读者全部知识</text><text x="84" y="2821" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="2833">08  转折 · 研究推断 · v09-e08 → v11-e04〔跨页接续〕</text><text x="84" y="2860" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2872">先借萝茜保护并接近黑龙，黑龙拒援后转向娜娜求助；新请求尚未等于脱困成功</text><rect x="64" y="2906" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2954" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2968">部分回收 · 终点边界（第18集复核）</text><text x="88" y="3009" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3021">克丽丝冥月女神身份、封印、选择娜娜传承和萝茜代言陆续明确，终卷又交代她独立领悟、未参加当年放逐。没有直接写本体解封或后记</text><text x="88" y="3046" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3058">个人去向；娜娜青春不能替代她本人获释的证据。</text><text x="64" y="3133" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3145">继续下一张：2/3。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3219" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3229">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3363" viewBox="0 0 1700 3363" role="img"><title>第三集 雷神覆灭 · 时间主干与分支</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">03 / 按主线进度查看事件与分支</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">第三集 雷神覆灭 · 时间主干与分支</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><path d="M 114 277 V 2539" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 540 C 1060 540 1060 540 1060 558 L 1060 782 Q 1060 800 992 800" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 800 C 1115 800 1115 800 1115 818 L 1115 1042 Q 1115 1060 992 1060" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 800 C 1170 800 1170 800 1170 818 L 1170 1562 Q 1170 1580 992 1580" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 800 C 1225 800 1225 800 1225 818 L 1225 2342 Q 1225 2360 992 2360" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1060 C 1060 1060 1060 1060 1060 1078 L 1060 1302 Q 1060 1320 992 1320" stroke="#c05c25" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#ac05c25)"/><path d="M 984 1060 C 1280 1060 1280 1060 1280 1078 L 1280 2082 Q 1280 2100 992 2100" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1320 C 1115 1320 1115 1320 1115 1338 L 1115 1822 Q 1115 1840 992 1840" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><rect x="1040" y="653.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="674.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="684.0">1</text><rect x="1095" y="913.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="934.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="944.0">2</text><rect x="1150" y="1173.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="1194.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="1204.0">4</text><rect x="1205" y="1563.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1212" y="1584.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1212" data-right="1246" data-bottom="1594.0">7</text><rect x="1040" y="1173.0" width="42" height="34" rx="8" fill="white" stroke="#c05c25"/><text x="1047" y="1194.0" font-size="20" font-weight="700" fill="#c05c25" data-left="1047" data-right="1081" data-bottom="1204.0">3</text><rect x="1260" y="1563.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1267" y="1584.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1267" data-right="1301" data-bottom="1594.0">6</text><rect x="1095" y="1563.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="1584.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="1594.0">5</text><circle cx="114" cy="280" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="325" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="336">03集</text><path d="M 126 280 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="235" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="269" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="279">v03-e01 · 事实</text><text x="212" y="313" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="327">洛特获转生并以守护为条件加入</text><text x="212" y="361" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="373">黑龙应娜娜请求转生洛特，七天后洛特接受不死身份与保密要求，要</text><text x="212" y="397" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="409">求继续守护娜娜。</text><text x="212" y="441" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="451">ch-0025 L2773–2787；ch-0026 L3082–3120</text><circle cx="114" cy="540" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="585" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="596">03集</text><path d="M 126 540 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="495" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="529" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="539">v03-e02 · 事实</text><text x="212" y="573" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="587">趁雷神衰败独攻并发现密道</text><text x="212" y="621" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="633">艾力克斯被盟军击杀后，斯文哥尔为秘密取得救赎之魂主张自行进攻</text><text x="212" y="657" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="669">；黑龙从骸骨信息推测并找到密道。</text><text x="212" y="701" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="711">ch-0027 L3148–3165；ch-0027 L3266–3286</text><circle cx="114" cy="800" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="845" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="856">03集</text><path d="M 126 800 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="755" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="789" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="799">v03-e03 · 事实</text><text x="212" y="833" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="847">水攻与战魂拖延促雷克丁败亡</text><text x="212" y="881" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="893">密道连到首领卧室导致暴露；黑龙付出断臂等损伤，用战魂与贴身缠</text><text x="212" y="917" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="929">抱阻其换气，最后吞其灵魂。</text><text x="212" y="961" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="971">ch-0028 L3327–3338；ch-0028 L3385–3431；ch-0029 L3497–3517</text><circle cx="114" cy="1060" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1105" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1116">03集</text><path d="M 126 1060 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1015" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1049" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1059">v03-e04 · 事实</text><text x="212" y="1093" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1107">救赎之魂揭谎并引发决裂</text><text x="212" y="1141" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1153">黑龙在宝库识别圣物并试探；斯文哥尔谎言被揭，四人短暂失力，黑</text><text x="212" y="1177" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1189">龙最终放过他们并留下圣物离开。</text><text x="212" y="1221" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1231">ch-0029 L3595–3628；ch-0030 L3632–3672</text><circle cx="114" cy="1320" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1365" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1376">03集</text><path d="M 126 1320 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1275" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1309" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1319">v03-e05 · 事实</text><text x="212" y="1353" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1367">斯文哥尔弃救赎并重新加入</text><text x="212" y="1401" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1413">斯文哥尔主动放弃恢复人身，追出援助黑龙清剿幸存者，再明确请求</text><text x="212" y="1437" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1449">以不死同伴身份留下。</text><text x="212" y="1481" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1491">ch-0030 L3684–3694；ch-0031 L3802–3818</text><circle cx="114" cy="1580" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1625" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1636">03集</text><path d="M 126 1580 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1535" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1569" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1579">v03-e06 · 事实</text><text x="212" y="1613" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1627">千魂领地与黑二反哺</text><text x="212" y="1661" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1673">黑龙召起上千亡者并赐长期灵魂，虚脱后获黑二主动反哺；他提出身</text><text x="212" y="1697" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1709">体自主，安排亡者沉睡，放弃全面转生构想但保留领地。</text><text x="212" y="1741" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1751">ch-0031 L3829–3884；ch-0031 L3910–3936</text><circle cx="114" cy="1840" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1885" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1896">03集</text><path d="M 126 1840 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1795" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1829" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1839">v03-e07 · 事实</text><text x="212" y="1873" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1887">爱琳主动选择留下</text><text x="212" y="1921" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1933">爱琳因亲情、风险与对现有关系的依恋，反驳老师劝返，向黑龙请求</text><text x="212" y="1957" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1969">继续当不死同伴并获接受。</text><text x="212" y="2001" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2011">ch-0031 L3937–3982</text><circle cx="114" cy="2100" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2145" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2156">03集</text><path d="M 126 2100 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2055" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2089" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2099">v03-e08 · 事实</text><text x="212" y="2133" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2147">星因亲族责任饮下圣物</text><text x="212" y="2181" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2193">星月承认个体善恶不由物种决定，却顾虑家人与部落；星饮下救赎之</text><text x="212" y="2217" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2229">魂后被圣焰吞没，结果未明。</text><text x="212" y="2261" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2271">ch-0032 L3987–4002</text><circle cx="114" cy="2360" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2405" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2416">03集</text><path d="M 126 2360 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2315" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2349" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2359">v03-e09 · 事实</text><text x="212" y="2393" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2407">疾风试探失败后重谈盟约边界</text><text x="212" y="2441" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2453">疾风因战果而来，潜行被黑龙识破；道歉后围绕是否有通报义务交锋</text><text x="212" y="2477" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2489">，黑龙保留感知机制秘密。</text><text x="212" y="2521" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2531">ch-0032 L4036–4063；ch-0032 L4104–4125</text><text x="64" y="2611" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2625">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2666" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2678">01  因果 · 事实 · v03-e02 → v03-e03</text><text x="84" y="2705" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2717">独攻与密道潜入触发首领近战及提前水攻</text><text x="84" y="2754" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2766">02  铺垫 · 事实 · v03-e03 → v03-e04</text><text x="84" y="2793" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2805">占据宝库让隐藏的圣物目的暴露</text><text x="84" y="2842" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="2854">03  转折 · 研究推断 · v03-e04 → v03-e05</text><text x="84" y="2881" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2893">放过并留圣物后，斯文哥尔自愿舍弃复原</text><text x="84" y="2930" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2942">04  因果 · 事实 · v03-e03 → v03-e06</text><text x="84" y="2969" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2981">战后大量吸魂提供永久赐魂所需力量</text><text x="84" y="3018" font-size="23" font-weight="700" fill="#147d8b" 
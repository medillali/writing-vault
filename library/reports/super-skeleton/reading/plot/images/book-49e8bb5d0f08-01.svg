<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2030" viewBox="0 0 1700 2030" role="img"><title>阿罗约记忆与被隐藏的旧杀戮 · 1/1</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">阿罗约记忆与被隐藏的旧杀戮 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fcecef" stroke="#fcecef"/><text x="86" y="273" font-size="24" font-weight="700" fill="#bf3b42" data-left="86" data-right="356" data-bottom="285">未回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">氓族若得知阿罗约真实遭遇，联盟会如何改变？</text><path d="M 114 372 V 1334" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 877 Q 1060 895 992 895" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 635 C 1115 635 1115 635 1115 653 L 1115 877 Q 1115 895 992 895" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 895 C 1170 895 1170 895 1170 913 L 1170 1137 Q 1170 1155 992 1155" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><rect x="1040" y="618.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="639.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="649.0">3</text><rect x="1095" y="748.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1102" y="769.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1102" data-right="1136" data-bottom="779.0">1</text><rect x="1150" y="1008.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="1029.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="1039.0">2</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">01集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v01-e03 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">吞噬阿罗约并复活四名伙伴</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黑龙获得碎片魔法知识，为交流而复活四人；伙伴接受生命但计划寻</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">找救赎。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0006 L299–338；ch-0006 L437–448</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">08集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v08-e04 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">河岸救援与多兵种反击</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">黑龙从河底介入氓族断后战，召金属兵和魅率亡灵；菲力普重整后撤</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">，金属骷髅累计损十六。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0083 L10324–10347；ch-0083 L10362–10384；ch-0084 L10413–10453</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">08集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v08-e05 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">旧记忆、隐瞒与氓族求助</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">羊皮书确认阿罗约族源，黑龙隐瞒其死因；族长献忠、揭亡灵祖先与</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">祭坛逆转，委托运魂。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0084 L10464–10519；ch-0085 L10542–10610</text><circle cx="114" cy="1155" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1200" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1211">08集</text><path d="M 126 1155 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1110" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1144" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1154">v08-e07 · 事实</text><text x="212" y="1188" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1202">强迫入沼与收魂</text><text x="212" y="1236" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1248">阿古力特杀质疑者、威胁入沼并自献祭；黑龙押行，杀反抗族人及请</text><text x="212" y="1272" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1284">求速死的余者，将魂收进神器。</text><text x="212" y="1316" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1326">ch-0086 L10711–10813</text><text x="64" y="1406" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="1420">旁路关系说明 · 编号对应图中连线</text><text x="84" y="1461" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="1473">01  揭示 · 事实 · v08-e04 → v08-e05</text><text x="84" y="1500" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1512">战后服饰与羊皮书识别，把获救者接回阿罗约的族源和祭坛历史。</text><text x="84" y="1549" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="1561">02  因果 · 事实 · v08-e05 → v08-e07</text><text x="84" y="1588" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1600">族长提出收魂返坛方案并获黑龙接受，后以武力推动生命形式转换。</text><text x="84" y="1637" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="1649">03  回收 · 事实 · v01-e03 → v08-e05</text><text x="84" y="1676" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1688">早期吞噬阿罗约留下的记忆在氓族相遇时产生亲近与识别，也让被隐瞒的旧杀戮进入联盟关系</text><rect x="64" y="1722" width="1572" height="184" rx="14" fill="#fcecef" stroke="#fcecef"/><text x="88" y="1770" font-size="28" font-weight="700" fill="#bf3b42" data-left="88" data-right="1606" data-bottom="1784">未回收 · 终点边界（第18集复核）</text><text x="88" y="1825" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="1837">阿罗约与氓族的身份关系已确认，黑龙记忆上的亲近与隐瞒杀人事实同时成立。没有直接展示族长或族民得知死因后的反应，不能以后来</text><text x="88" y="1862" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="1874">奉誓或共同作战视作已知情谅解。</text><text x="64" y="1986" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="1996">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
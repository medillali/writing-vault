<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3219" viewBox="0 0 1700 3219" role="img"><title>第五集 生命禁区 · 时间主干与分支</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">03 / 按主线进度查看事件与分支</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">第五集 生命禁区 · 时间主干与分支</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><path d="M 114 277 V 2395" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 280 C 1060 280 1060 280 1060 298 L 1060 1230 Q 1060 1248 992 1248" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 280 C 1115 280 1115 280 1115 298 L 1115 1006 Q 1115 1024 992 1024" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 280 C 1170 280 1170 280 1170 298 L 1170 522 Q 1170 540 992 540" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1248 C 1115 1248 1115 1248 1115 1266 L 1115 2198 Q 1115 2216 992 2216" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1472 C 1060 1472 1060 1472 1060 1490 L 1060 1714 Q 1060 1732 992 1732" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1732 C 1170 1732 1170 1732 1170 1750 L 1170 1974 Q 1170 1992 992 1992" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1732 C 1225 1732 1225 1732 1225 1750 L 1225 2198 Q 1225 2216 992 2216" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="747.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="768.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="778.0">1</text><rect x="1095" y="635.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="656.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="666.0">2</text><rect x="1150" y="393.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="414.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="424.0">7</text><rect x="1095" y="1715.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="1736.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="1746.0">6</text><rect x="1040" y="1585.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="1606.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="1616.0">3</text><rect x="1150" y="1845.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="1866.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="1876.0">4</text><rect x="1205" y="1957.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1212" y="1978.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1212" data-right="1246" data-bottom="1988.0">5</text><circle cx="114" cy="280" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="325" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="336">05集</text><path d="M 126 280 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="235" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="269" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="279">v05-e01 · 事实</text><text x="212" y="313" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="327">假死突围与九死</text><text x="212" y="361" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="373">黑龙救黑七并擒萝茜突围，飞剑杀萝茜；幸存圣骑离去，身份无法保</text><text x="212" y="397" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="409">密。</text><text x="212" y="441" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="451">ch-0045 L5497–5568</text><circle cx="114" cy="540" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="585" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="596">05集</text><path d="M 126 540 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="495" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="529" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="539">v05-e09 · 事实</text><text x="212" y="573" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="587">伤后恢复与战魂内患</text><text x="212" y="621" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="633">黑龙昏迷后恢复，黑七黄金骨架保留而灵魂削弱；战魂因同受圣力压</text><text x="212" y="657" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="669">制未脱体，恢复后再骚动且炼化失败。</text><text x="212" y="701" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="711">ch-0046 L5623–5632；ch-0046 L5661–5665</text><circle cx="114" cy="800" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="845" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="856">05集</text><path d="M 126 800 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="755" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="789" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="799">v05-e02 · 事实</text><text x="212" y="833" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="847">星获救与救赎释义</text><text x="212" y="881" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="893">黑二炼除神力，星月重新归队，盒文澄清救赎为净化回归神。</text><text x="212" y="925" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="935">ch-0047 L5738–5769</text><circle cx="114" cy="1024" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1069" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1080">05集</text><path d="M 126 1024 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="979" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1013" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1023">v05-e03 · 事实</text><text x="212" y="1057" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1071">天使借体降临</text><text x="212" y="1105" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1117">圣山仪式降下七阶战斗天使，降临者自称拉西萝茜。</text><text x="212" y="1149" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1159">ch-0047 L5773–5815</text><circle cx="114" cy="1248" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1293" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1304">05集</text><path d="M 126 1248 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1203" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1237" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1247">v05-e04 · 事实</text><text x="212" y="1281" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1295">决定穿越三禁地求力</text><text x="212" y="1329" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1341">黑龙拒绝无尽躲藏，在知龙墓危险后仍决定北行。</text><text x="212" y="1373" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1383">ch-0048 L5876–5941</text><circle cx="114" cy="1472" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1517" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1528">05集</text><path d="M 126 1472 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1427" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1461" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1471">v05-e05 · 事实</text><text x="212" y="1505" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1519">罗得被召并随行</text><text x="212" y="1553" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1565">琴烙印引出异常召唤，罗得恢复声音、暴露智慧后受契约与保密限制</text><text x="212" y="1589" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1601">随行。</text><text x="212" y="1633" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1643">ch-0051 L6335–6388</text><circle cx="114" cy="1732" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1777" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1788">05集</text><path d="M 126 1732 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1687" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1721" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1731">v05-e06 · 事实</text><text x="212" y="1765" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1779">歼游骑与伦理分歧</text><text x="212" y="1813" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1825">远射触发屠俘，团队歼敌；龙焰骨损后修复，黑龙吸能引发罗得抗议</text><text x="212" y="1849" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1861">。</text><text x="212" y="1893" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1903">ch-0053 L6589–6659</text><circle cx="114" cy="1992" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2037" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2048">05集</text><path d="M 126 1992 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1947" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1981" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1991">v05-e07 · 事实</text><text x="212" y="2025" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2039">战利品促成英雄宣传</text><text x="212" y="2073" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2085">出售帝国战马引官方传播战绩，黑龙获得公共英雄名声。</text><text x="212" y="2117" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2127">ch-0053 L6663–6677</text><circle cx="114" cy="2216" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2261" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2272">05集</text><path d="M 126 2216 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2171" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2205" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2215">v05-e08 · 事实</text><text x="212" y="2249" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2263">沙暴中悼亡进化</text><text x="212" y="2297" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2309">黄金骷髅人墙护队，黑龙紫魂进化、感知沙下大量骸骨，瞬发幻界；</text><text x="212" y="2333" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2345">教皇远感命名。</text><text x="212" y="2377" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2387">ch-0055 L6834–6869</text><text x="64" y="2467" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2481">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2522" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2534">01  因果 · 研究推断 · v05-e01 → v05-e04</text><text x="84" y="2561" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2573">身份暴露使无限躲藏和寻求力量成为明确选择压力。</text><text x="84" y="2610" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2622">02  铺垫 · 研究推断 · v05-e01 → v05-e03</text><text x="84" y="2649" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2661">死亡萝茜与借体天使形成后续身份问题，暂不等同原人格复生。</text><text x="84" y="2698" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2710">03  铺垫 · 研究推断 · v05-e05 → v05-e06</text><text x="84" y="2737" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2749">罗得随行提供战斗支援，也带来吸魂伦理质询。</text><text x="84" y="2786" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2798">04  因果 · 事实 · v05-e06 → v05-e07</text><text x="84" y="2825" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2837">战利品作为可见证据经城守转为宣传战绩。</text><text x="84" y="2874" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2886">05  铺垫 · 研究推断 · v05-e06 → v05-e08</text><text x="84" y="2913" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2925">吸取新鲜灵魂为再次到达瓶颈提供积累，风暴中发生突破。</text><text x="84" y="2962" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2974">06  铺垫 · 研究推断 · v05-e04 → v05-e08</text><text x="84" y="3001" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3013">北行决定带队进入沙漠，并触及未知骨骸历史。</text><text x="84" y="3050" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3062">07  因果 · 事实 · v05-e01 → v05-e09</text><text x="84" y="3089" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3101">救援和神圣攻击造成透支与黑七的持久削弱，并暂时压制体内战魂。</text><text x="64" y="3175" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3185">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
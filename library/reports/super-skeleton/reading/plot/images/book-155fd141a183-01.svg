<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3429" viewBox="0 0 1700 3429" role="img"><title>净世假旗与恐惧信仰 · 1/1</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">净世假旗与恐惧信仰 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#e6f5ef" stroke="#e6f5ef"/><text x="86" y="273" font-size="24" font-weight="700" fill="#087f65" data-left="86" data-right="356" data-bottom="285">已回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">谁把不死军团挂到黑龙名下，借此获取什么？</text><path d="M 114 372 V 2432" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 653 Q 1060 671 992 671" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 671 C 1115 671 1115 671 1115 689 L 1115 949 Q 1115 967 992 967" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1263 C 1170 1263 1170 1263 1170 1281 L 1170 689 Q 1170 671 992 671" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 967 C 1060 967 1060 967 1060 985 L 1060 2133 Q 1060 2151 992 2151" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1559 C 1115 1559 1115 1559 1115 1577 L 1115 1837 Q 1115 1855 992 1855" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1559 C 1170 1559 1170 1559 1170 1577 L 1170 2133 Q 1170 2151 992 2151" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="506.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="527.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="537.0">6</text><rect x="1095" y="802.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="823.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="833.0">1</text><rect x="1150" y="950.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1157" y="971.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1157" data-right="1191" data-bottom="981.0">2</text><rect x="1040" y="1542.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="1563.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="1573.0">3</text><rect x="1095" y="1690.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="1711.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="1721.0">4</text><rect x="1150" y="1838.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1157" y="1859.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1157" data-right="1191" data-bottom="1869.0">5</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">16集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v16-e09 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">光应私召，教皇对安德鲁实施不死献祭</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">光之神骑因教皇而离岗，称敌未必君王；后深夜带安德鲁入黑白雕像</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">密室，贯其心脏，教皇灌入魂火。安德鲁灵魂坠暗，醒后状态未展示</text><text x="212" y="528" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="540">。</text><text x="212" y="572" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="582">ch-0177 L21320–21339；ch-0180 L21800–21828</text><circle cx="114" cy="671" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="716" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="727">17集</text><path d="M 126 671 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="626" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="660" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="670">v17-e01 · 事实</text><text x="212" y="704" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="718">教会转生二人并部署假旗洪流</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">安德鲁醒为不死者，光之神骑也已转生；二人改名安德鲁西斯、暗拉</text><text x="212" y="788" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="800">玛，奉教皇命冒用黑龙名义。凝魄与雕像印记分给指挥、感知和否决</text><text x="212" y="824" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="836">权，最终控制尚在更高意志。</text><text x="212" y="868" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="878">ch-0182 L21850–21939</text><circle cx="114" cy="967" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1012" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1023">17集</text><path d="M 126 967 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="922" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="956" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="966">v17-e04 · 事实</text><text x="212" y="1000" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1014">误认假盟军、恐惧传播与联盟瓦解</text><text x="212" y="1048" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1060">先知等把两统帅装低智与称黑龙当归属证明，跟随千万洪流深入帝国</text><text x="212" y="1084" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1096">。慢进与虐杀制造逃亡潮，教会声望上升，同盟断绝合作，自然神信</text><text x="212" y="1120" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1132">徒减少。</text><text x="212" y="1164" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1174">ch-0188 L22422–22531；ch-0189 L22539–22567</text><circle cx="114" cy="1263" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1308" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1319">17集</text><path d="M 126 1263 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1218" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1252" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1262">v17-e05 · 事实</text><text x="212" y="1296" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1310">尼鲁达双灵格及三主神历史揭示</text><text x="212" y="1344" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1356">圣柜密谈揭教皇与女天使同源分裂后各有独立灵格。历史回叙说明切</text><text x="212" y="1380" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1392">里莫、尼鲁达、安克瓦斯曾造光明分身，联手放逐大陆，后来互相清</text><text x="212" y="1416" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1428">除；尼假死分魂潜伏，安已被切消灭，净世军本为切留下的子民。</text><text x="212" y="1460" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1470">ch-0189 L22606–22642；ch-0190 L22657–22689</text><circle cx="114" cy="1559" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1604" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1615">17集</text><path d="M 126 1559 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1514" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1548" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1558">v17-e07 · 事实</text><text x="212" y="1592" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1606">黑龙归来吞灭假统帅，取得局部身份线索</text><text x="212" y="1640" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1652">魂链恢复，黑龙到场否认假军归属；光与安德鲁亮出旧身份及尼鲁达</text><text x="212" y="1676" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1688">名号后，被黑龙吞魂取忆。记忆确认女天使为神骑老师、教皇与尼传</text><text x="212" y="1712" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1724">承有关，两人随后明确魂散。</text><text x="212" y="1756" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1766">ch-0191 L22788–22820；ch-0191 L22821–22862；ch-0192 L22872–22874</text><circle cx="114" cy="1855" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1900" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1911">17集</text><path d="M 126 1855 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1810" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1844" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1854">v17-e08 · 事实</text><text x="212" y="1888" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1902">崩军引追击，黑龙再操尸海并拟撤退</text><text x="212" y="1936" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1948">统帅魂散使千万旧军崩溃，人类振奋冲锋；黑龙召回己军，以无魂操</text><text x="212" y="1972" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1984">骨反击，再吞亡魂操人马尸，微操耗神且不能跨空间携走这些工具。</text><text x="212" y="2008" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2020">因情报不足，他决定向横断山撤，逐一赋魂仍为计划。</text><text x="212" y="2052" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2062">ch-0192 L22872–22924；ch-0192 L22949–22968</text><circle cx="114" cy="2151" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2196" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2207">17集</text><path d="M 126 2151 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2106" width="796" height="322" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2140" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2150">v17-e09 · 事实</text><text x="212" y="2184" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2198">女灵格重掌公正神格、假战收信并打开红月</text><text x="212" y="2232" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2244">女灵格融合封存公正神格，以迦莲娜形态公开显现。她制造表演战斗</text><text x="212" y="2268" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2280">，黑龙未明全盘目的而克制应战；教皇改祷对象汇聚信力，使她短现</text><text x="212" y="2304" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2316">十翼再放能量开红月，退回四翼且受伤；黑龙只获其自报尼鲁达，尚</text><text x="212" y="2340" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2352">未见大陆回归。</text><text x="212" y="2384" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2394">ch-0192 L22927–22945；ch-0192 L22969–22975；ch-0193 L22990–23016</text><text x="212" y="2414" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2424">；ch-0193 L23024–23108</text><text x="64" y="2504" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2518">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2559" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2571">01  因果 · 研究推断 · v17-e01 → v17-e04</text><text x="84" y="2598" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2610">借名与分权控制使假军进入先知的盟友模型。</text><text x="84" y="2647" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2659">02  揭示 · 研究推断 · v17-e05 → v17-e01</text><text x="84" y="2686" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2698">后置历史揭示假旗和指挥印记的真实来源；为解释关系而非叙述先后。</text><text x="84" y="2735" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2747">03  因果 · 研究推断 · v17-e04 → v17-e09</text><text x="84" y="2774" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2786">洪流制造的恐惧和信仰积累为女灵格重掌神格提供条件。</text><text x="84" y="2823" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2835">04  因果 · 研究推断 · v17-e07 → v17-e08</text><text x="84" y="2862" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2874">统帅魂散导致军团崩溃并诱发人军追击，黑龙以新控制接管残局。</text><text x="84" y="2911" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2923">05  铺垫 · 研究推断 · v17-e07 → v17-e09</text><text x="84" y="2950" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2962">吞忆得知女天使为老师却仍不明全局，使黑龙交手时保留力量等待解释。</text><text x="84" y="2999" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="3011">06  回收 · 事实 · v16-e09 → v17-e01</text><text x="84" y="3038" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3050">秘密不死献祭的后果落实为安德鲁与光之神骑转生、奉命冒用黑龙名义；转生没有使他们成为黑龙真实部属</text><rect x="64" y="3084" width="1572" height="221" rx="14" fill="#e6f5ef" stroke="#e6f5ef"/><text x="88" y="3132" font-size="28" font-weight="700" fill="#087f65" data-left="88" data-right="1606" data-bottom="3146">已回收 · 终点边界（第18集复核）</text><text x="88" y="3187" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3199">教皇安排安德鲁与光冒用黑龙名义、尼鲁达双灵格收恐惧信仰已明确，两个假统帅被吞灭、旧控制瓦解。仅关闭现问的操盘者、执行者与</text><text x="88" y="3224" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3236">获益目的；黑龙阵营此前真实平民杀戮、公众污名是否澄清及责任处置没有被后记共处消除，继续归入alliance-war-and-divine-power</text><text x="88" y="3261" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3273">与church-institution-and-angel-agency的partial广线。</text><text x="64" y="3385" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3395">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
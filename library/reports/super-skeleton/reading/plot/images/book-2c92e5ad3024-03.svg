<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3417" viewBox="0 0 1700 3417" role="img"><title>帝国来源、黑晶与回归 · 3/6</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">帝国来源、黑晶与回归 · 3/6</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">旧帝国及黑晶的来源与放逐后果怎样得到说明？</text><path d="M 114 372 V 2144" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 617 Q 1060 635 992 635" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 895 C 1060 895 1060 895 1060 913 L 1060 1137 Q 1060 1155 992 1155" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 895 C 1115 895 1115 895 1115 913 L 1115 1397 Q 1115 1415 992 1415" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1155 C 1170 1155 1170 1155 1170 1173 L 1170 1397 Q 1170 1415 992 1415" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1415 C 1060 1415 1060 1415 1060 1433 L 1060 1687 Q 1060 1705 992 1705" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 1705 C 1115 1705 1115 1705 1115 1723 L 1115 1947 Q 1115 1965 992 1965" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="509.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="519.0">1</text><rect x="1040" y="1008.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="1029.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="1039.0">2</text><rect x="1095" y="1138.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="1159.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="1169.0">3</text><rect x="1150" y="1268.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="1289.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="1299.0">4</text><rect x="1040" y="1543.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="1564.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="1574.0">5</text><rect x="1095" y="1818.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="1839.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="1849.0">6</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">12集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v12-e04 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">皇冠历史与先知半魂誓约暴露</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">皇冠传说引出万王之王，先知自报欧罗普菲力克；黑龙坚持灵魂约，</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">先知仅献分身部分便取得皇冠，并击服墓中强龙。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0121 L15541–15589；ch-0122 L15593–15683；ch-0122 L15685–15725</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">12集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v12-e05 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">先知升级毁墓后被逼完整臣服</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">皇冠转化死气助先知凝不死龙魂并破封；他故意埋骨制造依赖，黑龙</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">以半魂制约、十孩供力和联合护盾压制，最终收完整誓约与皇冠。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0123 L15732–15791；ch-0124 L15837–15939</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">13集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v13-e04 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">独战黄金领主学习魂冲与敛息</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">黑龙在死亡世界失去原援军，与独立黄金领主久战并学习技巧；澄清</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">需求后停战得大巫线索，最初求友尚未获明确双向认同。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0135 L16958–16993；ch-0136 L17045–17068；ch-0136 L17077–17138</text><circle cx="114" cy="1155" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1200" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1211">13集</text><path d="M 126 1155 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1110" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1144" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1154">v13-e05 · 事实</text><text x="212" y="1188" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1202">救援、反制与两种关系</text><text x="212" y="1236" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1248">黑龙救黄金领主，对方回援；幻影配抵地噬魂伤隆克多魂心，后者分</text><text x="212" y="1272" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1284">解保命退阶献约；金龙则交换无约束烙印。</text><text x="212" y="1316" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1326">ch-0137 L17204–17238；ch-0138 L17272–17286；ch-0138 L17307–17356</text><circle cx="114" cy="1415" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1460" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1471">13集</text><path d="M 126 1415 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1370" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1404" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1414">v13-e07 · 事实</text><text x="212" y="1448" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1462">霍夫曼讲述死亡世界的培育</text><text x="212" y="1496" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1508">隆克多引黑龙见霍夫曼；兼容领地、深渊宠物及君王雕像后，霍夫曼</text><text x="212" y="1532" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1544">讲述独立诞生、旧子民消亡与新灵魂培育。</text><text x="212" y="1576" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1586">ch-0139 L17428–17459；ch-0140 L17529–17539；ch-0140 L17555–17600</text><text x="212" y="1606" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1616">；ch-0139 L17460–17480</text><circle cx="114" cy="1705" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1750" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1761">13集</text><path d="M 126 1705 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1660" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1694" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1704">v13-e08 · 事实</text><text x="212" y="1738" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1752">权杖交付与遗物归途线索</text><text x="212" y="1786" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1798">霍夫曼解释皇冠烙印引导抵达，授亡者权杖并提出三物集线索；永久</text><text x="212" y="1822" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1834">领域养生物补灵魂来源，归途仍须参透。</text><text x="212" y="1866" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1876">ch-0141 L17604–17638；ch-0141 L17646–17662</text><circle cx="114" cy="1965" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2010" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2021">13集</text><path d="M 126 1965 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1920" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1954" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1964">v13-e09 · 事实</text><text x="212" y="1998" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2012">拒认统治使命后进入训练阵</text><text x="212" y="2046" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2058">黑龙拒认重新主导世界为自己使命；霍夫曼称由他自决，启动训练阵</text><text x="212" y="2082" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2094">使其沉睡，并私下承认还有更多使命。</text><text x="212" y="2126" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2136">ch-0141 L17672–17706</text><text x="64" y="2216" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2230">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2271" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2283">01  因果 · 研究推断 · v12-e04 → v12-e05</text><text x="84" y="2310" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2322">皇冠交付给升级与破封提供条件，半魂约又成为反制先知的控制点</text><text x="84" y="2359" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2371">02  铺垫 · 研究推断 · v13-e04 → v13-e05</text><text x="84" y="2398" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2410">魂冲、身法与求友交往为后续反制及回援提供基础</text><text x="84" y="2447" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2459">03  铺垫 · 研究推断 · v13-e04 → v13-e07</text><text x="84" y="2486" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2498">黄金领主的大巫线索经隆克多补全，形成拜访路线</text><text x="84" y="2535" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2547">04  因果 · 研究推断 · v13-e05 → v13-e07</text><text x="84" y="2574" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2586">收服隆克多后得到本地向导及霍夫曼情报</text><text x="84" y="2623" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2635">05  揭示 · 研究推断 · v13-e07 → v13-e08</text><text x="84" y="2662" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2674">起源说明连接到君王烙印、遗物与授杖使命</text><text x="84" y="2711" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2723">06  铺垫 · 研究推断 · v13-e08 → v13-e09</text><text x="84" y="2750" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2762">受杖后明确使命边界，并接受补足能力的训练</text><text x="84" y="2799" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2811">07  回收 · 事实 · v13-e09 → v14-e01〔跨页接续〕</text><text x="84" y="2838" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2850">入阵后的实际训练在七月回溯中提升感应与分控，能力提升须与后续记忆传承分开</text><text x="84" y="2887" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="2899">08  转折 · 事实 · v13-e07 → v14-e02〔跨页接续〕</text><text x="84" y="2926" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2938">守候使命的霍夫曼因漏带黑龙而遭君王分身灭魂，传承体系显露强制与暴力代价</text><text x="84" y="2975" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2987">09  回收 · 事实 · v13-e08 → v15-e06〔跨页接续〕</text><text x="84" y="3014" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3026">权杖和第三圣器的追索在海底遗迹推进，三器联系红月通道；见到彼端并不等于已实体抵达</text><rect x="64" y="3060" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="3108" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="3122">部分回收 · 终点边界（第18集复核）</text><text x="88" y="3163" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3175">三君王及放逐史、哈力与子民灵魂回归、黑晶为混沌之灵实体、残印被抹及切里莫造新本源陆续明确。起始之夜旧本源觉醒到爆炸的完整</text><text x="88" y="3200" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3212">讲述被打断，切里莫口述不等独立证实的全部宇宙史；回归也不是物理大陆迁来。</text><text x="64" y="3287" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3299">继续下一张：4/6。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3373" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3383">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
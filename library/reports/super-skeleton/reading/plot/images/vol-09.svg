86" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="235" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="269" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="279">v09-e01 · 事实</text><text x="212" y="313" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="327">图克承继与大批转生</text><text x="212" y="361" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="373">旧领主烙印进入图克，守护和诅咒源头揭开；三千余混合灵魂转生，</text><text x="212" y="397" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="409">力王等在威胁下奉誓。</text><text x="212" y="441" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="451">ch-0089 L11014–11046；ch-0089 L11084–11126</text><circle cx="114" cy="540" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="585" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="596">09集</text><path d="M 126 540 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="495" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="529" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="539">v09-e02 · 事实</text><text x="212" y="573" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="587">钢材瓶颈与交易突破</text><text x="212" y="621" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="633">斯文产能不足促黑龙入城；海图招揽失败，疾风订每月五十吨口头供</text><text x="212" y="657" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="669">货并备首批。</text><text x="212" y="701" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="711">ch-0090 L11180–11193；ch-0090 L11319–11357；ch-0091 L11515–11532</text><text x="212" y="731" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="741">；ch-0091 L11418–11422</text><circle cx="114" cy="830" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="875" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="886">09集</text><path d="M 126 830 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="785" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="819" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="829">v09-e03 · 事实</text><text x="212" y="863" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="877">先知提高筹码重开龙岛协议</text><text x="212" y="911" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="923">先知承认龙灵分身及关键隐瞒，以全墓忠诚求取安息石，黑龙答应但</text><text x="212" y="947" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="959">暂不赴险。</text><text x="212" y="991" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1001">ch-0091 L11374–11394；ch-0091 L11423–11458</text><circle cx="114" cy="1090" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1135" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1146">09集</text><path d="M 126 1090 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1045" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1079" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1089">v09-e04 · 事实</text><text x="212" y="1123" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1137">领地组织与跨代知识进入</text><text x="212" y="1171" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1183">跨段聚合：先祖拜见、斯科特限借，斯文与族人共建领地；后段规划</text><text x="212" y="1207" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1219">辩论扩展到文化商业，另记泰戈醒来待检，并非同一时点的一场会议</text><text x="212" y="1243" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1255">。</text><text x="212" y="1287" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1297">ch-0092 L11564–11614；ch-0095 L12308–12380</text><circle cx="114" cy="1386" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1431" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1442">09集</text><path d="M 126 1386 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1341" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1375" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1385">v09-e05 · 事实</text><text x="212" y="1419" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1433">救镇、收魂与英雄传播</text><text x="212" y="1467" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1479">跨段追踪：黑龙为魂骨消灭屠镇敌军，同伴救助平民，老罗格残魂异</text><text x="212" y="1503" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1515">常；后段回叙救民事迹被群众和反抗组织传播。</text><text x="212" y="1547" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1557">ch-0092 L11656–11683；ch-0092 L11707–11745；ch-0095 L12279–12307</text><circle cx="114" cy="1646" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1691" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1702">09集</text><path d="M 126 1646 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1601" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1635" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1645">v09-e06 · 事实</text><text x="212" y="1679" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1693">敌方部署与未明态度</text><text x="212" y="1727" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1739">穿插于多章的敌方行动：安德鲁动摇回圣山，雷奥获噬魂，菲力普派</text><text x="212" y="1763" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1775">队查失踪；到黑龙赋魂释能时，教皇和菲力普感到强波动却未出手。</text><text x="212" y="1807" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1817">ch-0090 L11282–11303；ch-0093 L11757–11794；ch-0093 L11801–11823</text><text x="212" y="1837" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1847">；ch-0094 L11936–11942</text><circle cx="114" cy="1936" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1981" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1992">09集</text><path d="M 126 1936 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1891" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1925" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1935">v09-e07 · 事实</text><text x="212" y="1969" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1983">皇者驾临练习与六千赋魂耗竭</text><text x="212" y="2017" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2029">意控尸体由千具练至约两千，选出六千后一次赋魂耗尽，骨军失去指</text><text x="212" y="2053" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2065">令停摆。</text><text x="212" y="2097" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2107">ch-0093 L11848–11920；ch-0094 L11950–11977</text><circle cx="114" cy="2196" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2241" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2252">09集</text><path d="M 126 2196 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2151" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2185" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2195">v09-e08 · 事实</text><text x="212" y="2229" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2243">同伴守谷与醒后围歼</text><text x="212" y="2277" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2289">墨菲斯循痕搜谷，罗得等守护，萝茜杀旧友护主；黑龙醒后协调六千</text><text x="212" y="2313" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2325">骨军与空骑围歼，但仍极弱。</text><text x="212" y="2357" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2367">ch-0094 L12019–12067；ch-0094 L12121–12143；ch-0095 L12181–12213</text><circle cx="114" cy="2456" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2501" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2512">09集</text><path d="M 126 2456 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2411" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2445" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2455">v09-e09 · 事实</text><text x="212" y="2489" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2503">坦克脱困与身体权限控制</text><text x="212" y="2537" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2549">补魂使战魂先恢复而脱体，黑龙以具体动作停其躯体，试斗后收回；</text><text x="212" y="2573" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2585">战魂意念仍不受控，黑龙回程仅复三成。</text><text x="212" y="2617" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2627">ch-0095 L12214–12245；ch-0095 L12261–12277</text><text x="64" y="2707" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2721">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2762" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2774">01  因果 · 事实 · v09-e01 → v09-e04</text><text x="84" y="2801" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2813">大批转生和先人记忆为领地建设提供人口与知识。</text><text x="84" y="2850" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2862">02  因果 · 事实 · v09-e02 → v09-e04</text><text x="84" y="2889" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2901">首批钢材使骷髅强化可以启动，而建设与制造争用劳力。</text><text x="84" y="2938" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2950">03  因果 · 事实 · v09-e05 → v09-e06</text><text x="84" y="2977" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2989">e05中沿途消灭小队这一部分促成e06中菲力普派队调查；不表示后段英雄传播造成前段敌方部署。</text><text x="84" y="3026" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3038">04  因果 · 事实 · v09-e07 → v09-e08</text><text x="84" y="3065" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3077">主角耗竭未下令使队伍无法撤离，同伴守谷遭循痕搜查。</text><text x="84" y="3114" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="3126">05  铺垫 · 事实 · v09-e06 → v09-e08</text><text x="84" y="3153" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3165">e06中菲力普派出调查的小队成为谷地对手；不把该聚合事件中的其他敌方行动视为此次围谷原因。</text><text x="84" y="3202" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3214">06  因果 · 事实 · v09-e07 → v09-e09</text><text x="84" y="3241" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3253">耗竭先抽空战魂，后补魂时双方恢复差使其脱困。</text><text x="84" y="3290" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="3302">07  回收 · 事实 · v09-e07 → v09-e09</text><text x="84" y="3329" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3341">控尸时细分动作的经验用于检验战魂躯体控制。</text><text x="64" y="3415" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3425">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
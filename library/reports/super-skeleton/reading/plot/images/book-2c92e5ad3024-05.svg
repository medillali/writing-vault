<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3341" viewBox="0 0 1700 3341" role="img"><title>帝国来源、黑晶与回归 · 5/6</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">帝国来源、黑晶与回归 · 5/6</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">旧帝国及黑晶的来源与放逐后果怎样得到说明？</text><path d="M 114 372 V 2420" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 665 C 1060 665 1060 665 1060 683 L 1060 943 Q 1060 961 992 961" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1257 C 1060 1257 1060 1257 1060 1275 L 1060 1535 Q 1060 1553 992 1553" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1553 C 1115 1553 1115 1553 1115 1571 L 1115 1831 Q 1115 1849 992 1849" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><rect x="1040" y="796.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="817.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="827.0">1</text><rect x="1040" y="1388.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="1409.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="1419.0">2</text><rect x="1095" y="1684.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="1705.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="1715.0">4</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">16集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v16-e01 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">强降机制获确认，雷奥恢复神智</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">红月信徒被确认是达罗亚强降路径；黑龙出战并归枪，达罗亚放出旧</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">三傀儡及新近恢复意识的雷奥，哥顿普感魂到来。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0169 L20511–20530；ch-0169 L20583–20591；ch-0170 L20595–20655</text><text x="212" y="566" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="576">；ch-0171 L20659–20676</text><circle cx="114" cy="665" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="710" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="721">16集</text><path d="M 126 665 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="620" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="654" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="664">v16-e03 · 事实</text><text x="212" y="698" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="712">四年期限与查跨世界方法的使命</text><text x="212" y="746" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="758">黑龙制服赫米亚后，达罗亚自述只余四年、其旗下领主以上子民全亡</text><text x="212" y="782" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="794">，提出调查天使跨世界方法以找回大陆，并指向绝望高原；其最终夺</text><text x="212" y="818" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="830">体意图此时未告黑龙。</text><text x="212" y="862" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="872">ch-0175 L21111–21185</text><circle cx="114" cy="961" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1006" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1017">16集</text><path d="M 126 961 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="916" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="950" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="960">v16-e05 · 事实</text><text x="212" y="994" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1008">假探路后黑龙遭达罗亚封魂夺体</text><text x="212" y="1042" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1054">高原洞穴隔绝探查，达罗亚令旧两傀儡探路并假报安全，随后封住黑</text><text x="212" y="1078" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1090">龙魂；要其躯体、魂能与子民的目的明说，外部失联者误以又跨位面</text><text x="212" y="1114" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1126">。</text><text x="212" y="1158" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1168">ch-0177 L21312–21319；ch-0177 L21340–21419</text><circle cx="114" cy="1257" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1302" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1313">16集</text><path d="M 126 1257 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1212" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1246" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1256">v16-e07 · 事实</text><text x="212" y="1290" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1304">达罗亚毁五十多万己民跨界取能</text><text x="212" y="1338" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1350">一个多月拉锯后，达罗亚经完善祭坛请哈力召己民，利用臣属撤防把</text><text x="212" y="1374" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1386">五十多万魂毁为能量传走；哈力怒斥却未阻传送，不知另一端正夺体</text><text x="212" y="1410" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1422">。</text><text x="212" y="1454" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1464">ch-0178 L21541–21563；ch-0179 L21614–21633；ch-0179 L21647–21734</text><circle cx="114" cy="1553" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1598" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1609">16集</text><path d="M 126 1553 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1508" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1542" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1552">v16-e08 · 事实</text><text x="212" y="1586" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1600">紧缩灵魂后两端出现混沌之灵认知</text><text x="212" y="1634" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1646">外援能量压倒黑龙，其紧缩魂减缓抽取而失去清晰思维，内部亮光吞</text><text x="212" y="1670" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1682">意识；哈力经祭坛感异常，达罗亚后触硬物惊称混沌之灵，结局仍未</text><text x="212" y="1706" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1718">给出。</text><text x="212" y="1750" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1760">ch-0180 L21738–21798；ch-0180 L21829–21842</text><circle cx="114" cy="1849" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1894" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1905">17集</text><path d="M 126 1849 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1804" width="796" height="316" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1838" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1848">v17-e02 · 事实</text><text x="212" y="1882" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1896">混沌之灵形成，达罗亚的夺体逆转</text><text x="212" y="1930" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1942">达的攻击唤醒黑龙紧缩形成的晶体，三力拉锯中哈力维亚传技；黑龙</text><text x="212" y="1966" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1978">反吞人工光明神格，毁祭坛中心。达失回归体再夺赫米亚躯，仍被复</text><text x="212" y="2002" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2014">制噬魂毁躯；黑龙重生身体、收两傀儡并恢复魂链。</text><text x="212" y="2046" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2056">ch-0183 L21943–22025；ch-0184 L22064–22089；ch-0185 L22093–22168</text><text x="212" y="2076" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2086">；ch-0185 L22179–22200；ch-0186 L22201–22224；ch-0186 </text><text x="212" y="2106" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2116">L22264–22311</text><circle cx="114" cy="2205" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2250" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2261">17集</text><path d="M 126 2205 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2160" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2194" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2204">v17-e05 · 事实</text><text x="212" y="2238" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2252">尼鲁达双灵格及三主神历史揭示</text><text x="212" y="2286" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2298">圣柜密谈揭教皇与女天使同源分裂后各有独立灵格。历史回叙说明切</text><text x="212" y="2322" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2334">里莫、尼鲁达、安克瓦斯曾造光明分身，联手放逐大陆，后来互相清</text><text x="212" y="2358" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2370">除；尼假死分魂潜伏，安已被切消灭，净世军本为切留下的子民。</text><text x="212" y="2402" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2412">ch-0189 L22606–22642；ch-0190 L22657–22689</text><text x="64" y="2492" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2506">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2547" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2559">01  因果 · 事实 · v16-e03 → v16-e05</text><text x="84" y="2586" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2598">指向高原与查跨界理由使黑龙单独随往，成为诱离条件。</text><text x="84" y="2635" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2647">02  因果 · 事实 · v16-e07 → v16-e08</text><text x="84" y="2674" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2686">献祭取能形成压倒优势，迫黑龙只剩紧缩减流失。</text><text x="84" y="2723" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2735">03  回收 · 研究推断 · v17-e05 → v17-e09〔跨页接续〕</text><text x="84" y="2762" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2774">封存神格和双灵格合作在公开仪式中兑现，旧身份源得到当前行动验证。</text><text x="84" y="2811" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2823">04  回收 · 事实 · v16-e08 → v17-e02</text><text x="84" y="2850" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2862">混沌之灵的悬念由形成过程、战技传授和反吞神格接续，黑龙此次夺体危机解除</text><text x="84" y="2899" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2911">05  揭示 · 事实 · v17-e05 → v18-e07〔跨页接续〕</text><text x="84" y="2938" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2950">旧帝国与神祇历史接续为切里莫制造本源并被反噬；旧宇宙起源的口述尚未讲完，已证死亡与未证传说分别保留</text><rect x="64" y="2984" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="3032" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="3046">部分回收 · 终点边界（第18集复核）</text><text x="88" y="3087" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3099">三君王及放逐史、哈力与子民灵魂回归、黑晶为混沌之灵实体、残印被抹及切里莫造新本源陆续明确。起始之夜旧本源觉醒到爆炸的完整</text><text x="88" y="3124" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3136">讲述被打断，切里莫口述不等独立证实的全部宇宙史；回归也不是物理大陆迁来。</text><text x="64" y="3211" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3223">继续下一张：6/6。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3297" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3307">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3451" viewBox="0 0 1700 3451" role="img"><title>光明制度与神祇主体 · 3/4</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">光明制度与神祇主体 · 3/4</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">信徒力量的分配与神祇代理权最终如何重组？</text><path d="M 114 372 V 2354" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 647 Q 1060 665 992 665" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1251 C 1060 1251 1060 1251 1060 1269 L 1060 1529 Q 1060 1547 992 1547" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1547 C 1115 1547 1115 1547 1115 1565 L 1115 1825 Q 1115 1843 992 1843" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 2139 C 1170 2139 1170 2139 1170 2157 L 1170 1565 Q 1170 1547 992 1547" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><rect x="1040" y="503.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="524.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="534.0">1</text><rect x="1040" y="1382.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="1403.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="1413.0">6</text><rect x="1095" y="1678.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="1699.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="1709.0">2</text><rect x="1150" y="1826.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1157" y="1847.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1157" data-right="1191" data-bottom="1857.0">3</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">16集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v16-e01 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">强降机制获确认，雷奥恢复神智</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">红月信徒被确认是达罗亚强降路径；黑龙出战并归枪，达罗亚放出旧</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">三傀儡及新近恢复意识的雷奥，哥顿普感魂到来。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0169 L20511–20530；ch-0169 L20583–20591；ch-0170 L20595–20655</text><text x="212" y="566" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="576">；ch-0171 L20659–20676</text><circle cx="114" cy="665" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="710" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="721">16集</text><path d="M 126 665 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="620" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="654" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="664">v16-e02 · 事实</text><text x="212" y="698" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="712">菲力普逃离，祷言与弗里昂之死结束强者战</text><text x="212" y="746" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="758">菲力普佯作强袭后逃，牧师集体燃命；魅冒耗散风险截击被黑龙救离</text><text x="212" y="782" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="794">，达罗亚收祷言。弗里昂拒逃战死，图克半身烧毁；达罗亚随后显出</text><text x="212" y="818" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="830">自身光明神格。</text><text x="212" y="862" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="872">ch-0172 L20830–20883；ch-0173 L20914–20971；ch-0174 L20975–21044</text><text x="212" y="892" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="902">；ch-0175 L21083–21105</text><circle cx="114" cy="991" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1036" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1047">16集</text><path d="M 126 991 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="946" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="980" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="990">v16-e04 · 事实</text><text x="212" y="1024" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1038">自然神谕保联盟并暗害旧长老</text><text x="212" y="1072" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1084">自然神为亡者正名并引信冥月，暗杀唯一旧长老防教义质疑；娜娜亲</text><text x="212" y="1108" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1120">感此事并质问，叙述明言兼两神传承但仍是媒介。</text><text x="212" y="1152" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1162">ch-0176 L21189–21265</text><circle cx="114" cy="1251" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1296" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1307">16集</text><path d="M 126 1251 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1206" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1240" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1250">v16-e09 · 事实</text><text x="212" y="1284" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1298">光应私召，教皇对安德鲁实施不死献祭</text><text x="212" y="1332" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1344">光之神骑因教皇而离岗，称敌未必君王；后深夜带安德鲁入黑白雕像</text><text x="212" y="1368" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1380">密室，贯其心脏，教皇灌入魂火。安德鲁灵魂坠暗，醒后状态未展示</text><text x="212" y="1404" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1416">。</text><text x="212" y="1448" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1458">ch-0177 L21320–21339；ch-0180 L21800–21828</text><circle cx="114" cy="1547" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1592" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1603">17集</text><path d="M 126 1547 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1502" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1536" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1546">v17-e01 · 事实</text><text x="212" y="1580" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1594">教会转生二人并部署假旗洪流</text><text x="212" y="1628" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1640">安德鲁醒为不死者，光之神骑也已转生；二人改名安德鲁西斯、暗拉</text><text x="212" y="1664" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1676">玛，奉教皇命冒用黑龙名义。凝魄与雕像印记分给指挥、感知和否决</text><text x="212" y="1700" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1712">权，最终控制尚在更高意志。</text><text x="212" y="1744" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1754">ch-0182 L21850–21939</text><circle cx="114" cy="1843" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1888" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1899">17集</text><path d="M 126 1843 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1798" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1832" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1842">v17-e04 · 事实</text><text x="212" y="1876" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1890">误认假盟军、恐惧传播与联盟瓦解</text><text x="212" y="1924" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1936">先知等把两统帅装低智与称黑龙当归属证明，跟随千万洪流深入帝国</text><text x="212" y="1960" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1972">。慢进与虐杀制造逃亡潮，教会声望上升，同盟断绝合作，自然神信</text><text x="212" y="1996" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2008">徒减少。</text><text x="212" y="2040" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2050">ch-0188 L22422–22531；ch-0189 L22539–22567</text><circle cx="114" cy="2139" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2184" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2195">17集</text><path d="M 126 2139 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2094" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2128" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2138">v17-e05 · 事实</text><text x="212" y="2172" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2186">尼鲁达双灵格及三主神历史揭示</text><text x="212" y="2220" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2232">圣柜密谈揭教皇与女天使同源分裂后各有独立灵格。历史回叙说明切</text><text x="212" y="2256" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2268">里莫、尼鲁达、安克瓦斯曾造光明分身，联手放逐大陆，后来互相清</text><text x="212" y="2292" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2304">除；尼假死分魂潜伏，安已被切消灭，净世军本为切留下的子民。</text><text x="212" y="2336" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2346">ch-0189 L22606–22642；ch-0190 L22657–22689</text><text x="64" y="2426" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2440">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2481" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2493">01  铺垫 · 事实 · v16-e01 → v16-e02</text><text x="84" y="2520" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2532">君王接应和枪傀儡显力使强者战局压向教会一方。</text><text x="84" y="2569" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2581">02  因果 · 研究推断 · v17-e01 → v17-e04</text><text x="84" y="2608" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2620">借名与分权控制使假军进入先知的盟友模型。</text><text x="84" y="2657" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2669">03  揭示 · 研究推断 · v17-e05 → v17-e01</text><text x="84" y="2696" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2708">后置历史揭示假旗和指挥印记的真实来源；为解释关系而非叙述先后。</text><text x="84" y="2745" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2757">04  因果 · 研究推断 · v17-e04 → v17-e09〔跨页接续〕</text><text x="84" y="2784" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2796">洪流制造的恐惧和信仰积累为女灵格重掌神格提供条件。</text><text x="84" y="2833" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2845">05  回收 · 研究推断 · v17-e05 → v17-e09〔跨页接续〕</text><text x="84" y="2872" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2884">封存神格和双灵格合作在公开仪式中兑现，旧身份源得到当前行动验证。</text><text x="84" y="2921" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2933">06  回收 · 事实 · v16-e09 → v17-e01</text><text x="84" y="2960" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2972">秘密不死献祭的后果落实为安德鲁与光之神骑转生、奉命冒用黑龙名义；转生没有使他们成为黑龙真实部属</text><text x="84" y="3009" font-size="23" font-weight="700" fill="#537aa0" data-left="84" data-right="1602" data-bottom="3021">07  呼应 · 研究综合 · v16-e04 → v17-e09〔跨页接续〕</text><text x="84" y="3048" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3060">自然神控制神谕与尼鲁达双灵格经营恐惧信仰相互映照，均把群体信仰转为可调动的权力资源，具体责任和人格仍各自独立</text><rect x="64" y="3094" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="3142" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="3156">部分回收 · 终点边界（第18集复核）</text><text x="88" y="3197" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3209">受教会支配的天使可以作不同选择，三主神与尼鲁达双灵格的制度操作逐渐揭明。终卷补送枪机缘、虚设至高称号以及女灵格赠格改立的</text><text x="88" y="3234" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3246">行为；教皇个人结局、改立的具体执行和完整新制度没有展示。</text><text x="64" y="3321" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3333">继续下一张：4/4。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3407" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3417">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
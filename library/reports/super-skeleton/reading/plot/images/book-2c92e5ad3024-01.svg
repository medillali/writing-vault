<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3015" viewBox="0 0 1700 3015" role="img"><title>帝国来源、黑晶与回归 · 1/6</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">帝国来源、黑晶与回归 · 1/6</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">旧帝国及黑晶的来源与放逐后果怎样得到说明？</text><path d="M 114 372 V 2006" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 1101 Q 1060 1119 992 1119" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 635 C 1115 635 1115 635 1115 653 L 1115 1325 Q 1115 1343 992 1343" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 895 C 1170 895 1170 895 1170 913 L 1170 1549 Q 1170 1567 992 1567" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1119 C 1225 1119 1225 1119 1225 1137 L 1225 1549 Q 1225 1567 992 1567" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 1567 C 1060 1567 1060 1567 1060 1585 L 1060 1809 Q 1060 1827 992 1827" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><rect x="1040" y="730.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="751.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="761.0">3</text><rect x="1095" y="972.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="993.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="1003.0">1</text><rect x="1150" y="1214.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1157" y="1235.0" font-size="20" font-weight="700" fill="#087f65" data-left="1157" data-right="1191" data-bottom="1245.0">4</text><rect x="1205" y="1326.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1212" y="1347.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1212" data-right="1246" data-bottom="1357.0">5</text><rect x="1040" y="1680.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="1701.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="1711.0">2</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">05集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v05-e08 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">沙暴中悼亡进化</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黄金骷髅人墙护队，黑龙紫魂进化、感知沙下大量骸骨，瞬发幻界；</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">教皇远感命名。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0055 L6834–6869</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">06集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v06-e05 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">天使战中灵魂武装觉醒</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">龙焰躯体被毁，黑龙从黑大经验推导魂剑魂甲，天使试图焚身降本体</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0063 L7721–7823</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">06集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v06-e06 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">斯科特封印天使并确认印记</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">数百亡灵束缚天使，斯科特禁咒封其本源，说明路标及悼亡层级。</text><text x="212" y="1020" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1030">ch-0064 L7861–7897</text><circle cx="114" cy="1119" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1164" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1175">06集</text><path d="M 126 1119 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1074" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1108" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1118">v06-e07 · 事实</text><text x="212" y="1152" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1166">亡灵史诗与音乐会</text><text x="212" y="1200" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1212">史诗和斯科特解明国度历史及怨灵花，罗得琴歌使森林暂时安宁。</text><text x="212" y="1244" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1254">ch-0065 L7945–8081</text><circle cx="114" cy="1343" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1388" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1399">06集</text><path d="M 126 1343 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1298" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1332" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1342">v06-e08 · 事实</text><text x="212" y="1376" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1390">十孩完成战斗武装</text><text x="212" y="1424" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1436">黑龙练习塑甲，再引导八无意识孩子，黑大黑二自行完成不同武装。</text><text x="212" y="1468" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1478">ch-0066 L8102–8162</text><circle cx="114" cy="1567" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1612" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1623">07集</text><path d="M 126 1567 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1522" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1556" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1566">v07-e05 · 事实</text><text x="212" y="1600" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1614">隐史与元力知识传授</text><text x="212" y="1648" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1660">斯科特承认隐瞒，讲述古帝国兴亡和君王依赖链，并以封存天使提供</text><text x="212" y="1684" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1696">元力运用知识。</text><text x="212" y="1728" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1738">ch-0073 L9089–9116；ch-0073 L9203–9216；ch-0074 L9221–9240</text><circle cx="114" cy="1827" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1872" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1883">07集</text><path d="M 126 1827 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1782" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1816" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1826">v07-e06 · 事实</text><text x="212" y="1860" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1874">一个月后掌握元力联系</text><text x="212" y="1908" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1920">黑龙消化天使意念后醒来，短暂威压引跪拜，收束后能感到远端部属</text><text x="212" y="1944" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1956">传来能量。</text><text x="212" y="1988" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1998">ch-0074 L9241–9291</text><text x="64" y="2078" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2092">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2133" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2145">01  铺垫 · 事实 · v06-e05 → v06-e08</text><text x="84" y="2172" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2184">战中灌甲经验成为后续受指导练习的起点。</text><text x="84" y="2221" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2233">02  因果 · 事实 · v07-e05 → v07-e06</text><text x="84" y="2260" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2272">封存天使意念提供运用方法，黑龙经过一个月消化取得元力感知。</text><text x="84" y="2309" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2321">03  揭示 · 研究推断 · v05-e08 → v06-e07</text><text x="84" y="2348" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2360">沙下骨骸得到斯科特的远古战争解释，史诗有起始边界；战因胜负仍未明</text><text x="84" y="2397" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2409">04  回收 · 事实 · v06-e06 → v07-e05</text><text x="84" y="2436" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2448">封存天使后来成为元力知识来源；其遭吸收与原萝茜失忆后的经历分别记录</text><text x="84" y="2485" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2497">05  揭示 · 事实 · v06-e07 → v07-e05</text><text x="84" y="2524" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2536">斯科特承认先前隐瞒并补充古帝国史，已知历史的来源边界进一步收紧</text><text x="84" y="2573" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2585">06  回收 · 事实 · v06-e08 → v08-e01〔跨页接续〕</text><text x="84" y="2612" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2624">此前制作后尚待实测的战装在圣力攻击中得到验证；能量仍消耗，不扩展为所有单位均免疫</text><rect x="64" y="2658" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2706" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2720">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2761" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2773">三君王及放逐史、哈力与子民灵魂回归、黑晶为混沌之灵实体、残印被抹及切里莫造新本源陆续明确。起始之夜旧本源觉醒到爆炸的完整</text><text x="88" y="2798" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2810">讲述被打断，切里莫口述不等独立证实的全部宇宙史；回归也不是物理大陆迁来。</text><text x="64" y="2885" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="2897">继续下一张：2/6。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="2971" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2981">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3357" viewBox="0 0 1700 3357" role="img"><title>第七集 信仰元力 · 时间主干与分支</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">03 / 按主线进度查看事件与分支</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">第七集 信仰元力 · 时间主干与分支</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><path d="M 114 277 V 2533" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 280 C 1060 280 1060 280 1060 298 L 1060 522 Q 1060 540 992 540" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 540 C 1115 540 1115 540 1115 558 L 1115 1006 Q 1115 1024 992 1024" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 540 C 1170 540 1170 540 1170 558 L 1170 1786 Q 1170 1804 992 1804" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1024 C 1060 1024 1060 1024 1060 1042 L 1060 1266 Q 1060 1284 992 1284" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1284 C 1115 1284 1115 1284 1115 1302 L 1115 1526 Q 1115 1544 992 1544" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1544 C 1060 1544 1060 1544 1060 1562 L 1060 1786 Q 1060 1804 992 1804" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 2064 C 1060 2064 1060 2064 1060 2082 L 1060 2306 Q 1060 2324 992 2324" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><rect x="1040" y="393.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="414.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="424.0">1</text><rect x="1095" y="765.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="786.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="796.0">2</text><rect x="1150" y="1155.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1157" y="1176.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1157" data-right="1191" data-bottom="1186.0">6</text><rect x="1040" y="1137.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="1158.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="1168.0">3</text><rect x="1095" y="1397.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="1418.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="1428.0">4</text><rect x="1040" y="1657.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="1678.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="1688.0">5</text><rect x="1040" y="2177.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="2198.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="2208.0">7</text><circle cx="114" cy="280" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="325" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="336">07集</text><path d="M 126 280 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="235" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="269" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="279">v07-e01 · 事实</text><text x="212" y="313" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="327">魔法斧与人工金属化成形</text><text x="212" y="361" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="373">斯文协助造斧，黑龙与斯科特以无形置换制造金属骷髅，发现附肉和</text><text x="212" y="397" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="409">产能限制。</text><text x="212" y="441" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="451">ch-0068 L8263–8298；ch-0069 L8478–8529；ch-0070 L8559–8569</text><circle cx="114" cy="540" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="585" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="596">07集</text><path d="M 126 540 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="495" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="529" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="539">v07-e02 · 事实</text><text x="212" y="573" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="587">龙墓取骨转为损失撤退</text><text x="212" y="621" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="633">小骨龙被制服，大骨龙试探遭误伤；怒杀触发群龙追击，七具金属骷</text><text x="212" y="657" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="669">髅损失，黑七重伤。</text><text x="212" y="701" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="711">ch-0070 L8718–8731；ch-0071 L8848–8859；ch-0071 L8892–8899</text><circle cx="114" cy="800" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="845" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="856">07集</text><path d="M 126 800 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="755" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="789" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="799">v07-e03 · 事实</text><text x="212" y="833" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="847">娜娜关心打断萝茜旧杀意</text><text x="212" y="881" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="893">失忆萝茜因娜娜本名生杀意又因关心消退，背后阴影匕首随之消散。</text><text x="212" y="925" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="935">ch-0071 L8735–8776</text><circle cx="114" cy="1024" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1069" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1080">07集</text><path d="M 126 1024 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="979" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1013" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1023">v07-e04 · 事实</text><text x="212" y="1057" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1071">先知交易被拒</text><text x="212" y="1105" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1117">先知以誓约和安息石情报求破约自由，黑龙因龙岛风险拒绝；先知独</text><text x="212" y="1141" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1153">处显龙亡灵形态。</text><text x="212" y="1185" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1195">ch-0072 L9021–9046；ch-0073 L9050–9088</text><circle cx="114" cy="1284" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1329" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1340">07集</text><path d="M 126 1284 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1239" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1273" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1283">v07-e05 · 事实</text><text x="212" y="1317" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1331">隐史与元力知识传授</text><text x="212" y="1365" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1377">斯科特承认隐瞒，讲述古帝国兴亡和君王依赖链，并以封存天使提供</text><text x="212" y="1401" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1413">元力运用知识。</text><text x="212" y="1445" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1455">ch-0073 L9089–9116；ch-0073 L9203–9216；ch-0074 L9221–9240</text><circle cx="114" cy="1544" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1589" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1600">07集</text><path d="M 126 1544 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1499" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1533" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1543">v07-e06 · 事实</text><text x="212" y="1577" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1591">一个月后掌握元力联系</text><text x="212" y="1625" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1637">黑龙消化天使意念后醒来，短暂威压引跪拜，收束后能感到远端部属</text><text x="212" y="1661" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1673">传来能量。</text><text x="212" y="1705" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1715">ch-0074 L9241–9291</text><circle cx="114" cy="1804" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1849" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1860">07集</text><path d="M 126 1804 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1759" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1793" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1803">v07-e07 · 事实</text><text x="212" y="1837" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1851">重订同伴边界并获效忠</text><text x="212" y="1885" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1897">黑龙收回针对斯文的杀意，明确自由存在目标；斯科特献上没有死亡</text><text x="212" y="1921" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1933">连带作用的忠诚誓言。</text><text x="212" y="1965" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1975">ch-0075 L9369–9445</text><circle cx="114" cy="2064" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2109" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2120">07集</text><path d="M 126 2064 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2019" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2053" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2063">v07-e08 · 事实</text><text x="212" y="2097" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2111">同盟沦陷改变出口控制</text><text x="212" y="2145" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2157">同盟军和自然神殿被击败，安德鲁知道神明层面败亡；教会控制两处</text><text x="212" y="2181" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2193">沙漠出口并按雷奥定位改道。</text><text x="212" y="2225" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2235">ch-0075 L9446–9509</text><circle cx="114" cy="2324" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2369" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2380">07集</text><path d="M 126 2324 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2279" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2313" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2323">v07-e09 · 事实</text><text x="212" y="2357" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2371">返程与天使骑士战前相遇</text><text x="212" y="2405" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2417">黑七与法师等留后，黑龙带九孩返程；黑大银丝侦察引敌误读，黑龙</text><text x="212" y="2441" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2453">凭既有灵魂运用和武装决定正面应战，列奥纳布双层盾墙等冲撞。</text><text x="212" y="2485" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2495">ch-0075 L9510–9521；ch-0076 L9543–9569；ch-0076 L9569–9576；</text><text x="212" y="2515" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2525">ch-0076 L9585–9605</text><text x="64" y="2605" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2619">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2660" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2672">01  铺垫 · 事实 · v07-e01 → v07-e02</text><text x="84" y="2699" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2711">制造出的三十具金属骷髅进入龙墓实战，强度与关节弱点同时接受检验。</text><text x="84" y="2748" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2760">02  因果 · 事实 · v07-e02 → v07-e04</text><text x="84" y="2787" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2799">亲历墓地实力与同伴损失，使黑龙拒绝更高风险的取石方案。</text><text x="84" y="2836" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2848">03  铺垫 · 研究推断 · v07-e04 → v07-e05</text><text x="84" y="2875" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2887">斯科特追问并认可风险判断后，才交出天使和隐瞒的历史；考察关联由效忠说明补证。</text><text x="84" y="2924" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2936">04  因果 · 事实 · v07-e05 → v07-e06</text><text x="84" y="2963" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2975">封存天使意念提供运用方法，黑龙经过一个月消化取得元力感知。</text><text x="84" y="3012" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3024">05  因果 · 研究推断 · v07-e06 → v07-e07</text><text x="84" y="3051" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3063">成长与扩军计划加深斯文恐惧，持续劝阻引发关系摊牌。</text><text x="84" y="3100" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="3112">06  铺垫 · 事实 · v07-e02 → v07-e07</text><text x="84" y="3139" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3151">不让孩子挑战过强力量的决策成为斯科特判断君王资格的依据。</text><text x="84" y="3188" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3200">07  因果 · 事实 · v07-e08 → v07-e09</text><text x="84" y="3227" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3239">出口被控制和雷奥持续定位让安德鲁绕行到返程方向完成拦截。</text><text x="64" y="3313" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3323">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
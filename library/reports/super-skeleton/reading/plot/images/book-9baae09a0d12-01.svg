<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3192" viewBox="0 0 1700 3192" role="img"><title>坦克战魂的控制边界 · 1/1</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">坦克战魂的控制边界 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">战魂能否真正炼化或可靠驾驭？</text><path d="M 114 372 V 2144" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 617 Q 1060 635 992 635" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 635 C 1115 635 1115 635 1115 653 L 1115 1137 Q 1115 1155 992 1155" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 895 C 1060 895 1060 895 1060 913 L 1060 1137 Q 1060 1155 992 1155" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1155 C 1170 1155 1170 1155 1170 1173 L 1170 1657 Q 1170 1675 992 1675" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1415 C 1060 1415 1060 1415 1060 1433 L 1060 1657 Q 1060 1675 992 1675" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1415 C 1115 1415 1115 1415 1115 1433 L 1115 1657 Q 1115 1675 992 1675" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1675 C 1225 1675 1225 1675 1225 1693 L 1225 1917 Q 1225 1935 992 1935" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><rect x="1040" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="509.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="519.0">4</text><rect x="1095" y="878.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1102" y="899.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1102" data-right="1136" data-bottom="909.0">5</text><rect x="1040" y="1008.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="1029.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="1039.0">1</text><rect x="1150" y="1398.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1157" y="1419.0" font-size="20" font-weight="700" fill="#087f65" data-left="1157" data-right="1191" data-bottom="1429.0">6</text><rect x="1040" y="1528.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="1549.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="1559.0">2</text><rect x="1095" y="1528.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="1549.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="1559.0">3</text><rect x="1205" y="1788.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1212" y="1809.0" font-size="20" font-weight="700" fill="#087f65" data-left="1212" data-right="1246" data-bottom="1819.0">7</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">02集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v02-e04 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">坦克战死成战魂并被压制</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">营寨战清场导致莫非死亡，黑大能量刃显形；坦克战魂最终被黑龙吞</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">入但无法炼化。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0019 L2061–2084；ch-0019 L2119–2156；ch-0020 L2173–2205</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">03集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v03-e03 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">水攻与战魂拖延促雷克丁败亡</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">密道连到首领卧室导致暴露；黑龙付出断臂等损伤，用战魂与贴身缠</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">抱阻其换气，最后吞其灵魂。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0028 L3327–3338；ch-0028 L3385–3431；ch-0029 L3497–3517</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">05集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v05-e01 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">假死突围与九死</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">黑龙救黑七并擒萝茜突围，飞剑杀萝茜；幸存圣骑离去，身份无法保</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">密。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0045 L5497–5568</text><circle cx="114" cy="1155" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1200" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1211">05集</text><path d="M 126 1155 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1110" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1144" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1154">v05-e09 · 事实</text><text x="212" y="1188" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1202">伤后恢复与战魂内患</text><text x="212" y="1236" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1248">黑龙昏迷后恢复，黑七黄金骨架保留而灵魂削弱；战魂因同受圣力压</text><text x="212" y="1272" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1284">制未脱体，恢复后再骚动且炼化失败。</text><text x="212" y="1316" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1326">ch-0046 L5623–5632；ch-0046 L5661–5665</text><circle cx="114" cy="1415" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1460" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1471">09集</text><path d="M 126 1415 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1370" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1404" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1414">v09-e07 · 事实</text><text x="212" y="1448" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1462">皇者驾临练习与六千赋魂耗竭</text><text x="212" y="1496" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1508">意控尸体由千具练至约两千，选出六千后一次赋魂耗尽，骨军失去指</text><text x="212" y="1532" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1544">令停摆。</text><text x="212" y="1576" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1586">ch-0093 L11848–11920；ch-0094 L11950–11977</text><circle cx="114" cy="1675" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1720" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1731">09集</text><path d="M 126 1675 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1630" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1664" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1674">v09-e09 · 事实</text><text x="212" y="1708" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1722">坦克脱困与身体权限控制</text><text x="212" y="1756" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1768">补魂使战魂先恢复而脱体，黑龙以具体动作停其躯体，试斗后收回；</text><text x="212" y="1792" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1804">战魂意念仍不受控，黑龙回程仅复三成。</text><text x="212" y="1836" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1846">ch-0095 L12214–12245；ch-0095 L12261–12277</text><circle cx="114" cy="1935" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1980" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1991">10集</text><path d="M 126 1935 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1890" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1924" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1934">v10-e02 · 事实</text><text x="212" y="1968" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1982">隘口伏击造成坐骑灭失与再次透支</text><text x="212" y="2016" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2028">费尔巴尼私查布伏，普通军队最终覆灭仍杀尽随行战马、伤骨骼，黑</text><text x="212" y="2052" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2064">龙透支再睡。</text><text x="212" y="2096" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2106">ch-0097 L12468–12496；ch-0098 L12544–12565；ch-0098 L12616–12696</text><text x="212" y="2126" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2136">；ch-0099 L12716–12734</text><text x="64" y="2216" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2230">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2271" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2283">01  因果 · 事实 · v05-e01 → v05-e09</text><text x="84" y="2310" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2322">救援和神圣攻击造成透支与黑七的持久削弱，并暂时压制体内战魂。</text><text x="84" y="2359" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2371">02  因果 · 事实 · v09-e07 → v09-e09</text><text x="84" y="2398" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2410">耗竭先抽空战魂，后补魂时双方恢复差使其脱困。</text><text x="84" y="2447" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2459">03  回收 · 事实 · v09-e07 → v09-e09</text><text x="84" y="2486" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2498">控尸时细分动作的经验用于检验战魂躯体控制。</text><text x="84" y="2535" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2547">04  回收 · 事实 · v02-e04 → v03-e03</text><text x="84" y="2574" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2586">未炼化的坦克战魂被释放拖延雷克丁，随后再次压回体内</text><text x="84" y="2623" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2635">05  揭示 · 事实 · v03-e03 → v05-e09</text><text x="84" y="2662" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2674">再压回体内的战魂仍未炼化，神圣伤只造成共同压制而非根除</text><text x="84" y="2711" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2723">06  回收 · 事实 · v05-e09 → v09-e09</text><text x="84" y="2750" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2762">先前不能炼化的战魂再次脱困后出现身体权限控制，独立战意仍反抗；内患只获有限进展</text><text x="84" y="2799" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2811">07  回收 · 研究推断 · v09-e09 → v10-e02</text><text x="84" y="2838" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2850">取得身体指令权限的战魂在伏击战中被调用，仍会受克制和自行脱离，不能视作意志已驯服</text><rect x="64" y="2884" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2932" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2946">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2987" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2999">第九集确定黑龙可限制坦克躯体行动，不能支配其战意；身体权限与人格炼化有别。后文没有给出战意完全服从或最终处置的直接结果，</text><text x="88" y="3024" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="3036">保留这项控制边界。</text><text x="64" y="3148" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3158">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
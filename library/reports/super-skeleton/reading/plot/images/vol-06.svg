<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3271" viewBox="0 0 1700 3271" role="img"><title>第六集 悼亡之主 · 时间主干与分支</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">03 / 按主线进度查看事件与分支</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">第六集 悼亡之主 · 时间主干与分支</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><path d="M 114 277 V 2359" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 280 C 1060 280 1060 280 1060 298 L 1060 1938 Q 1060 1956 992 1956" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 764 C 1115 764 1115 764 1115 782 L 1115 970 Q 1115 988 992 988" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 764 C 1170 764 1170 764 1170 782 L 1170 1714 Q 1170 1732 992 1732" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 988 C 1225 988 1225 988 1225 1006 L 1225 2162 Q 1225 2180 992 2180" stroke="#537aa0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a537aa0)"/><path d="M 984 1248 C 1115 1248 1115 1248 1115 1266 L 1115 1490 Q 1115 1508 992 1508" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1248 C 1280 1248 1280 1248 1280 1266 L 1280 1938 Q 1280 1956 992 1956" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1508 C 1335 1508 1335 1508 1335 1526 L 1335 2162 Q 1335 2180 992 2180" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1732 C 1115 1732 1115 1732 1115 1750 L 1115 2162 Q 1115 2180 992 2180" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="1101.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="1122.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="1132.0">1</text><rect x="1095" y="859.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="880.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="890.0">2</text><rect x="1150" y="1231.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1157" y="1252.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1157" data-right="1191" data-bottom="1262.0">3</text><rect x="1205" y="1567.0" width="42" height="34" rx="8" fill="white" stroke="#537aa0"/><text x="1212" y="1588.0" font-size="20" font-weight="700" fill="#537aa0" data-left="1212" data-right="1246" data-bottom="1598.0">8</text><rect x="1095" y="1361.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="1382.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="1392.0">4</text><rect x="1260" y="1585.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1267" y="1606.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1267" data-right="1301" data-bottom="1616.0">5</text><rect x="1315" y="1827.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1322" y="1848.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1322" data-right="1356" data-bottom="1858.0">6</text><rect x="1095" y="1939.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="1960.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="1970.0">7</text><circle cx="114" cy="280" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="325" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="336">06集</text><path d="M 126 280 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="235" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="269" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="279">v06-e01 · 事实</text><text x="212" y="313" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="327">黑大完全觉醒并决定转生泰戈</text><text x="212" y="361" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="373">病情与同行矛盾触发自主发言，身份确认后操控断开，黑大杀泰戈交</text><text x="212" y="397" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="409">黑龙转生。</text><text x="212" y="441" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="451">ch-0057 L6963–7008</text><circle cx="114" cy="540" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="585" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="596">06集</text><path d="M 126 540 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="495" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="529" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="539">v06-e02 · 事实</text><text x="212" y="573" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="587">身份情报引发机构应对</text><text x="212" y="621" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="633">疾风权衡关系，同盟封存秘密，教会另调暗之神骑雷奥。</text><text x="212" y="665" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="675">ch-0059 L7200–7226；ch-0058 L7110–7145</text><circle cx="114" cy="764" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="809" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="820">06集</text><path d="M 126 764 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="719" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="753" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="763">v06-e03 · 事实</text><text x="212" y="797" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="811">森林安魂与沟通误伤</text><text x="212" y="845" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="857">罗得安魂止哀嚎，黑龙过量魂问伤使者，随后发生亡灵冲突。</text><text x="212" y="889" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="899">ch-0060 L7324–7397</text><circle cx="114" cy="988" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1033" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1044">06集</text><path d="M 126 988 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="943" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="977" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="987">v06-e04 · 事实</text><text x="212" y="1021" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1035">借肉迟疑与克丽丝教学曝光</text><text x="212" y="1069" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1081">火战毁皮后黑龙拟取娜娜肉却迟疑，改取水貂；娜娜治疗时说明克丽</text><text x="212" y="1105" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1117">丝授术。</text><text x="212" y="1149" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1159">ch-0061 L7503–7578</text><circle cx="114" cy="1248" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1293" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1304">06集</text><path d="M 126 1248 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1203" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1237" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1247">v06-e05 · 事实</text><text x="212" y="1281" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1295">天使战中灵魂武装觉醒</text><text x="212" y="1329" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1341">龙焰躯体被毁，黑龙从黑大经验推导魂剑魂甲，天使试图焚身降本体</text><text x="212" y="1365" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1377">。</text><text x="212" y="1409" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1419">ch-0063 L7721–7823</text><circle cx="114" cy="1508" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1553" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1564">06集</text><path d="M 126 1508 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1463" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1497" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1507">v06-e06 · 事实</text><text x="212" y="1541" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1555">斯科特封印天使并确认印记</text><text x="212" y="1589" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1601">数百亡灵束缚天使，斯科特禁咒封其本源，说明路标及悼亡层级。</text><text x="212" y="1633" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1643">ch-0064 L7861–7897</text><circle cx="114" cy="1732" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1777" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1788">06集</text><path d="M 126 1732 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1687" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1721" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1731">v06-e07 · 事实</text><text x="212" y="1765" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1779">亡灵史诗与音乐会</text><text x="212" y="1813" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1825">史诗和斯科特解明国度历史及怨灵花，罗得琴歌使森林暂时安宁。</text><text x="212" y="1857" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1867">ch-0065 L7945–8081</text><circle cx="114" cy="1956" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2001" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2012">06集</text><path d="M 126 1956 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1911" width="796" height="184" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1945" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1955">v06-e08 · 事实</text><text x="212" y="1989" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2003">十孩完成战斗武装</text><text x="212" y="2037" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2049">黑龙练习塑甲，再引导八无意识孩子，黑大黑二自行完成不同武装。</text><text x="212" y="2081" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2091">ch-0066 L8102–8162</text><circle cx="114" cy="2180" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2225" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2236">06集</text><path d="M 126 2180 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2135" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2169" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2179">v06-e09 · 事实</text><text x="212" y="2213" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2227">原萝茜补魂苏醒却失忆</text><text x="212" y="2261" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2273">为情报目的，黑龙补足原萝茜残灵所缺之魂；其复仇举动反噬，记忆</text><text x="212" y="2297" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2309">残缺，魅看守。</text><text x="212" y="2341" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2351">ch-0066 L8177–8214</text><text x="64" y="2431" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2445">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2486" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2498">01  铺垫 · 事实 · v06-e01 → v06-e08</text><text x="84" y="2525" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2537">独立意识使黑大黑二自主塑造武装，而八个无意识孩子仍需代操。</text><text x="84" y="2574" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2586">02  因果 · 研究推断 · v06-e03 → v06-e04</text><text x="84" y="2613" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2625">沟通误伤引战，冲火毁去外皮，随后需要活性肉引重建。</text><text x="84" y="2662" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2674">03  铺垫 · 事实 · v06-e03 → v06-e07</text><text x="84" y="2701" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2713">首次安魂的有效性促成斯科特邀请罗得举办正式音乐会。</text><text x="84" y="2750" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2762">04  因果 · 研究推断 · v06-e05 → v06-e06</text><text x="84" y="2789" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2801">焚身本体威胁到亡者国度，亡灵及时干预并封印。</text><text x="84" y="2838" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2850">05  铺垫 · 事实 · v06-e05 → v06-e08</text><text x="84" y="2877" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2889">战中灌甲经验成为后续受指导练习的起点。</text><text x="84" y="2926" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2938">06  因果 · 事实 · v06-e06 → v06-e09</text><text x="84" y="2965" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2977">天使被封印使残灵能够重聚，才有补魂苏醒条件。</text><text x="84" y="3014" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="3026">07  铺垫 · 研究推断 · v06-e07 → v06-e09</text><text x="84" y="3053" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3065">灵与魂的区分解释残灵补魂方案及其不等于完整记忆。</text><text x="84" y="3102" font-size="23" font-weight="700" fill="#537aa0" data-left="84" data-right="1602" data-bottom="3114">08  呼应 · 研究推断 · v06-e04 → v06-e09</text><text x="84" y="3141" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3153">对娜娜的迟疑与对复活敌人的灭魂冲动相照，标出关爱的对象边界。</text><text x="64" y="3227" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3237">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
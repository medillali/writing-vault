<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3095" viewBox="0 0 1700 3095" role="img"><title>帝国来源、黑晶与回归 · 2/6</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">帝国来源、黑晶与回归 · 2/6</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">旧帝国及黑晶的来源与放逐后果怎样得到说明？</text><path d="M 114 372 V 2174" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 895 C 1060 895 1060 895 1060 913 L 1060 1167 Q 1060 1185 992 1185" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 1445 C 1060 1445 1060 1445 1060 1463 L 1060 1687 Q 1060 1705 992 1705" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1445 C 1115 1445 1115 1445 1115 1463 L 1115 1687 Q 1115 1705 992 1705" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="1023.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="1044.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="1054.0">4</text><rect x="1040" y="1558.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="1579.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="1589.0">1</text><rect x="1095" y="1558.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="1579.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="1589.0">2</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">07集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v07-e07 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">重订同伴边界并获效忠</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黑龙收回针对斯文的杀意，明确自由存在目标；斯科特献上没有死亡</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">连带作用的忠诚誓言。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0075 L9369–9445</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">08集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v08-e01 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">圣骑溃败与保密灭口</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">黑龙绕盾多次冲锋击溃圣骑，列奥纳被杀；雷奥救安德鲁后杀光己方</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">幸存者并自报死亡骑士。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0078 L9634–9677；ch-0078 L9700–9744</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">10集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v10-e04 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">雷奥刺杀失败、死亡与噬魂制傀儡</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">魅带俘近前被雷奥利用，分魂刺杀遭枪的亲和规则阻止；雷奥魂灭，</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">噬魂吞魂制出同形傀儡。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0099 L12843–12861；ch-0100 L12885–12944；ch-0100 L12965–13014</text><text x="212" y="1086" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1096">；ch-0101 L13048–13052</text><circle cx="114" cy="1185" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1230" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1241">11集</text><path d="M 126 1185 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1140" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1174" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1184">v11-e02 · 事实</text><text x="212" y="1218" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1232">夺舍危机引发群体反击与真武装</text><text x="212" y="1266" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1278">海皇谋夺躯体，黑龙先攻召援；斯科特领域护军，十孩供力使黑龙凝</text><text x="212" y="1302" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1314">成真正魂兵。</text><text x="212" y="1346" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1356">ch-0108 L13998–14051；ch-0108 L14062–14086；ch-0109 L14097–14143</text><circle cx="114" cy="1445" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1490" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1501">11集</text><path d="M 126 1445 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1400" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1434" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1444">v11-e03 · 事实</text><text x="212" y="1478" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1492">吞神分流与信任破裂</text><text x="212" y="1526" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1538">黑龙吞掉海皇神识，以分流免爆体并恢复躯体；责怪却理解斯科特，</text><text x="212" y="1562" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1574">明确拒再帮克丽丝。</text><text x="212" y="1606" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1616">ch-0109 L14180–14208；ch-0110 L14214–14294；ch-0110 L14295–14316</text><circle cx="114" cy="1705" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1750" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1761">11集</text><path d="M 126 1705 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1660" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1694" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1704">v11-e04 · 事实</text><text x="212" y="1738" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1752">女神转求娜娜与海蛇转生</text><text x="212" y="1786" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1798">娜娜接到新求助；十孩获真武装后，黑龙耗半魂转生海蛇并找到旧帝</text><text x="212" y="1822" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1834">国遗物，回船续航。</text><text x="212" y="1866" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1876">ch-0111 L14321–14331；ch-0111 L14344–14354；ch-0111 L14360–14397</text><text x="212" y="1896" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1906">；ch-0111 L14428–14435</text><circle cx="114" cy="1995" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2040" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2051">12集</text><path d="M 126 1995 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1950" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1984" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1994">v12-e03 · 事实</text><text x="212" y="2028" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2042">取得安息石却遭毁峰重创</text><text x="212" y="2076" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2088">黑龙取到毕瑟辨认的黑晶之魄；龙皇预设地形弱点发动禁咒，金属骨</text><text x="212" y="2112" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2124">重损，挖救亡灵后借斯科特撤回；龙人全族消失且留长老尸体。</text><text x="212" y="2156" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2166">ch-0120 L15420–15458；ch-0121 L15460–15534</text><text x="64" y="2246" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2260">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2301" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2313">01  因果 · 研究推断 · v11-e03 → v11-e04</text><text x="84" y="2340" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2352">拒绝再援使克丽丝转求娜娜</text><text x="84" y="2389" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2401">02  铺垫 · 研究推断 · v11-e03 → v11-e04</text><text x="84" y="2428" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2440">新增力量支持昂贵的海蛇转生</text><text x="84" y="2477" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2489">03  因果 · 研究推断 · v12-e03 → v12-e04〔跨页接续〕</text><text x="84" y="2516" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2528">带回安息石才使皇冠辨认和先知交约谈判成为现实</text><text x="84" y="2565" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2577">04  揭示 · 研究推断 · v10-e04 → v11-e02</text><text x="84" y="2604" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2616">已有神器和实体附能并非真正纯魂武装，海皇危机中十孩供力促成黑龙凝兵</text><text x="84" y="2653" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2665">05  揭示 · 研究推断 · v11-e04 → v13-e08〔跨页接续〕</text><text x="84" y="2692" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2704">海蛇腹中遗物留下的古国问题，进一步获得皇冠、权杖与永恒之眼的追索方向；帝国消失原因仍未回答</text><rect x="64" y="2738" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2786" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2800">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2841" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2853">三君王及放逐史、哈力与子民灵魂回归、黑晶为混沌之灵实体、残印被抹及切里莫造新本源陆续明确。起始之夜旧本源觉醒到爆炸的完整</text><text x="88" y="2878" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2890">讲述被打断，切里莫口述不等独立证实的全部宇宙史；回归也不是物理大陆迁来。</text><text x="64" y="2965" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="2977">继续下一张：3/6。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3051" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3061">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1682" viewBox="0 0 1700 1682" role="img"><title>罗得的旧次逃生与新相遇 · 1/1</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">罗得的旧次逃生与新相遇 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fcecef" stroke="#fcecef"/><text x="86" y="273" font-size="24" font-weight="700" fill="#bf3b42" data-left="86" data-right="356" data-bottom="285">未回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">罗得早先如何逃过审判，何时转生？</text><path d="M 114 372 V 1074" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 877 Q 1060 895 992 895" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 375 C 1115 375 1115 375 1115 393 L 1115 617 Q 1115 635 992 635" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="618.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="639.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="649.0">2</text><rect x="1095" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1102" y="509.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1102" data-right="1136" data-bottom="519.0">1</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">04集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v04-e04 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">罗得宾士逃过被认定完成的审判</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">萝茜被琴曲短暂打动，遭音攻后焚杀目标并离开；罗得宾士随后再次</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">现身，脱身机制未知。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0038 L4757–4809</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">04集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v04-e08 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">谷外冲突使不死身份暴露</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">斯文哥尔识破伪装圣骑，黑龙抢先冲锋；林间肉搏与诅咒使萝茜识别</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">不死者，双方转入法术和技巧对抗。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0042 L5227–5249；ch-0042 L5265–5285；ch-0043 L5353–5358</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">05集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v05-e05 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">罗得被召并随行</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">琴烙印引出异常召唤，罗得恢复声音、暴露智慧后受契约与保密限制</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">随行。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0051 L6335–6388</text><text x="64" y="1146" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="1160">旁路关系说明 · 编号对应图中连线</text><text x="84" y="1201" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="1213">01  铺垫 · 研究综合 · v04-e04 → v04-e08</text><text x="84" y="1240" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1252">前场展示的圣焰祷言能力为主角遭遇其战法提供准备</text><text x="84" y="1289" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="1301">02  揭示 · 研究推断 · v04-e04 → v05-e05</text><text x="84" y="1328" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1340">此前独立出现且逃过审判的音乐家经异常琴召唤进入主角队伍，逃脱原理仍不能据此推定</text><rect x="64" y="1374" width="1572" height="184" rx="14" fill="#fcecef" stroke="#fcecef"/><text x="88" y="1422" font-size="28" font-weight="700" fill="#bf3b42" data-left="88" data-right="1606" data-bottom="1436">未回收 · 终点边界（第18集复核）</text><text x="88" y="1477" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="1489">第五集相遇、后来的音乐发展和后记演奏都没有回答此处所问的旧次逃过审判方式与准确转生时点，因此保留open。后续生存和专长进</text><text x="88" y="1514" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="1526">展属其他问法，不能仅凭同一人物的新经历把本项旧案标为部分获答。</text><text x="64" y="1638" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="1648">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
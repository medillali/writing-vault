<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2204" viewBox="0 0 1700 2204" role="img"><title>自然神保教与政治杀人 · 2/2</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">自然神保教与政治杀人 · 2/2</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">自然神的生存策略会付出什么道德和制度代价？</text><path d="M 114 372 V 1508" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 913 Q 1060 931 992 931" stroke="#537aa0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a537aa0)"/><path d="M 984 375 C 1115 375 1115 375 1115 393 L 1115 1275 Q 1115 1293 992 1293" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 375 C 1170 375 1170 375 1170 393 L 1170 617 Q 1170 635 992 635" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><rect x="1040" y="636.0" width="42" height="34" rx="8" fill="white" stroke="#537aa0"/><text x="1047" y="657.0" font-size="20" font-weight="700" fill="#537aa0" data-left="1047" data-right="1081" data-bottom="667.0">2</text><rect x="1095" y="817.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="838.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="848.0">3</text><rect x="1150" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1157" y="509.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1157" data-right="1191" data-bottom="519.0">1</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">16集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v16-e04 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">自然神谕保联盟并暗害旧长老</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">自然神为亡者正名并引信冥月，暗杀唯一旧长老防教义质疑；娜娜亲</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">感此事并质问，叙述明言兼两神传承但仍是媒介。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0176 L21189–21265</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">16集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v16-e06 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">限令与俘虏政策下收复里斯特并扩军</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">塞茵暴动和联军撤离未引祭魂阵启动，阿古援黑龙限令反对；先知收</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">俘缓恐惧，攻克里斯特后从战尸扩军两万到四万，新装不全，海图与</text><text x="212" y="788" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="800">联军再跟进。</text><text x="212" y="832" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="842">ch-0177 L21422–21441；ch-0178 L21445–21466；ch-0179 L21583–21613</text><circle cx="114" cy="931" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="976" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="987">17集</text><path d="M 126 931 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="886" width="796" height="322" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="920" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="930">v17-e09 · 事实</text><text x="212" y="964" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="978">女灵格重掌公正神格、假战收信并打开红月</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">女灵格融合封存公正神格，以迦莲娜形态公开显现。她制造表演战斗</text><text x="212" y="1048" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1060">，黑龙未明全盘目的而克制应战；教皇改祷对象汇聚信力，使她短现</text><text x="212" y="1084" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1096">十翼再放能量开红月，退回四翼且受伤；黑龙只获其自报尼鲁达，尚</text><text x="212" y="1120" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1132">未见大陆回归。</text><text x="212" y="1164" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1174">ch-0192 L22927–22945；ch-0192 L22969–22975；ch-0193 L22990–23016</text><text x="212" y="1194" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1204">；ch-0193 L23024–23108</text><circle cx="114" cy="1293" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1338" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1349">18集</text><path d="M 126 1293 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1248" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1282" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1292">v18-e09 · 事实</text><text x="212" y="1326" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1340">未知年后的共处与归来</text><text x="212" y="1374" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1386">后记黑龙意识醒来，看见飞艇、巨龙运输、深渊出入门、多族市场与</text><text x="212" y="1410" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1422">蓝晶售冰。菲力普、罗得、斯文、娜娜仍在；哈力号角迎回，黑龙重</text><text x="212" y="1446" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1458">现原形。</text><text x="212" y="1490" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1500">ch-0202 L24373–24397</text><text x="64" y="1580" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="1594">旁路关系说明 · 编号对应图中连线</text><text x="84" y="1635" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="1647">01  铺垫 · 事实 · v16-e04 → v16-e06</text><text x="84" y="1674" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1686">神谕稳定神职方面，再配俘虏政策和复土利益使联军合作。</text><text x="84" y="1723" font-size="23" font-weight="700" fill="#537aa0" data-left="84" data-right="1602" data-bottom="1735">02  呼应 · 研究综合 · v16-e04 → v17-e09</text><text x="84" y="1762" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1774">自然神控制神谕与尼鲁达双灵格经营恐惧信仰相互映照，均把群体信仰转为可调动的权力资源，具体责任和人格仍各自独立</text><text x="84" y="1811" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="1823">03  回收 · 事实 · v16-e04 → v18-e09</text><text x="84" y="1850" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="1862">双神传承与自然神控制的代价之后，后记确认娜娜成长并保青春；未据此补写正式成神或克丽丝本体解封</text><rect x="64" y="1896" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="1944" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="1958">部分回收 · 终点边界（第18集复核）</text><text x="88" y="1999" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2011">自然神身份、媒介娜娜、保教合作与暗杀旧大长老的代价逐步显现；后记娜娜青春验证传承持续影响。不能据此补自然神本源全部转移、</text><text x="88" y="2036" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2048">全部信徒自愿接受或政治后果已解决，早期本源与分身通路的疑点仍保留。</text><text x="64" y="2160" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2170">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
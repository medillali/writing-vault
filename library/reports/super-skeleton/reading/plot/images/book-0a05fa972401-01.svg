<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2704" viewBox="0 0 1700 2704" role="img"><title>记忆、知识与力量 · 1/1</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">记忆、知识与力量 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">记忆所得如何改变选择，哪些能力仍不能继承？</text><path d="M 114 372 V 1920" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 1137 Q 1060 1155 992 1155" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 375 C 1115 375 1115 375 1115 393 L 1115 617 Q 1115 635 992 635" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 635 C 1170 635 1170 635 1170 653 L 1170 877 Q 1170 895 992 895" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1415 C 1060 1415 1060 1415 1060 1433 L 1060 1723 Q 1060 1741 992 1741" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><rect x="1040" y="748.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="769.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="779.0">3</text><rect x="1095" y="488.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1102" y="509.0" font-size="20" font-weight="700" fill="#087f65" data-left="1102" data-right="1136" data-bottom="519.0">1</text><rect x="1150" y="748.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1157" y="769.0" font-size="20" font-weight="700" fill="#087f65" data-left="1157" data-right="1191" data-bottom="779.0">2</text><rect x="1040" y="1561.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1047" y="1582.0" font-size="20" font-weight="700" fill="#087f65" data-left="1047" data-right="1081" data-bottom="1592.0">4</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">01集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v01-e03 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">吞噬阿罗约并复活四名伙伴</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">黑龙获得碎片魔法知识，为交流而复活四人；伙伴接受生命但计划寻</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">找救赎。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0006 L299–338；ch-0006 L437–448</text><circle cx="114" cy="635" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="680" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="691">02集</text><path d="M 126 635 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="590" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="624" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="634">v02-e06 · 事实</text><text x="212" y="668" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="682">宝藏开启并完整融合记忆</text><text x="212" y="716" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="728">黑龙打开阿罗约次元空间，旧物触发完整记忆，取得晶石首饰和沉渊</text><text x="212" y="752" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="764">木，魔力仍未继承。</text><text x="212" y="796" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="806">ch-0020 L2322–2332；ch-0021 L2336–2402</text><circle cx="114" cy="895" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="940" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="951">03集</text><path d="M 126 895 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="850" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="884" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="894">v03-e04 · 事实</text><text x="212" y="928" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="942">救赎之魂揭谎并引发决裂</text><text x="212" y="976" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="988">黑龙在宝库识别圣物并试探；斯文哥尔谎言被揭，四人短暂失力，黑</text><text x="212" y="1012" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1024">龙最终放过他们并留下圣物离开。</text><text x="212" y="1056" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1066">ch-0029 L3595–3628；ch-0030 L3632–3672</text><circle cx="114" cy="1155" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1200" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1211">08集</text><path d="M 126 1155 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1110" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1144" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1154">v08-e05 · 事实</text><text x="212" y="1188" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1202">旧记忆、隐瞒与氓族求助</text><text x="212" y="1236" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1248">羊皮书确认阿罗约族源，黑龙隐瞒其死因；族长献忠、揭亡灵祖先与</text><text x="212" y="1272" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1284">祭坛逆转，委托运魂。</text><text x="212" y="1316" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1326">ch-0084 L10464–10519；ch-0085 L10542–10610</text><circle cx="114" cy="1415" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1460" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1471">14集</text><path d="M 126 1415 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1370" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1404" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1414">v14-e02 · 事实</text><text x="212" y="1448" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1462">开启遗迹、霍夫曼灭魂与分身传承</text><text x="212" y="1496" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1508">遗迹灾变中黑龙因不会飞行错失入口，霍夫曼被时间囚笼中的切罗曼</text><text x="212" y="1532" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1544">尔分身灭魂。分身借烙印传法使黑龙自行抵达，授记忆而不授力量；</text><text x="212" y="1568" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1580">两年传承细节由后文补述。</text><text x="212" y="1612" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1622">ch-0145 L17959–18000；ch-0145 L18024–18039；ch-0146 L18043–18122</text><text x="212" y="1642" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1652">；ch-0147 L18189–18197；ch-0150 L18492–18495</text><circle cx="114" cy="1741" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1786" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1797">18集</text><path d="M 126 1741 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1696" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1730" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1740">v18-e04 · 事实</text><text x="212" y="1774" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1788">投影反追与跨界追击</text><text x="212" y="1822" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1834">黑龙操死象时感知提升，冻结投影碎片取得坐标，却被远袭重创，哈</text><text x="212" y="1858" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1870">力挡击后黑龙撕裂位面；尼女加入追击。</text><text x="212" y="1902" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1912">ch-0198 L23680–23748；ch-0199 L23755–23788</text><text x="64" y="1992" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2006">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2047" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2059">01  回收 · 事实 · v01-e03 → v02-e06</text><text x="84" y="2086" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2098">吞噬阿罗约留下的记忆逐步解锁，旧物触发完整融合而魔力未继承</text><text x="84" y="2135" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2147">02  回收 · 事实 · v02-e06 → v03-e04</text><text x="84" y="2174" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2186">完整继承记忆使黑龙能够识别圣物，伙伴不知道这项认知优势</text><text x="84" y="2223" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2235">03  回收 · 事实 · v01-e03 → v08-e05</text><text x="84" y="2262" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2274">早期吞噬阿罗约留下的记忆在氓族相遇时产生亲近与识别，也让被隐瞒的旧杀戮进入联盟关系</text><text x="84" y="2311" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2323">04  回收 · 事实 · v14-e02 → v18-e04</text><text x="84" y="2350" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2362">切罗曼尔传承的知识在投影反追、时间干扰与跨界行动中转为应用；记忆继承不等原力量和人格复活</text><rect x="64" y="2396" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2444" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2458">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2499" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2511">吞魂记忆能提供知识和技能线索，却不等于原力量、人格或所有理解自动继承。切罗曼尔记忆要经判断与试用，哈力传的是战技经验，终</text><text x="88" y="2536" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2548">卷反向力及追踪付出受伤和失控风险后才能应用。此为跨阶段机制归纳，不据结尾推成所有能力已掌握或无上限。</text><text x="64" y="2660" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2670">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
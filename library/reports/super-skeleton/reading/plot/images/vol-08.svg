0">8</text><rect x="1040" y="2083.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="2104.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="2114.0">7</text><circle cx="114" cy="280" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="325" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="336">08集</text><path d="M 126 280 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="235" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="269" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="279">v08-e01 · 事实</text><text x="212" y="313" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="327">圣骑溃败与保密灭口</text><text x="212" y="361" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="373">黑龙绕盾多次冲锋击溃圣骑，列奥纳被杀；雷奥救安德鲁后杀光己方</text><text x="212" y="397" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="409">幸存者并自报死亡骑士。</text><text x="212" y="441" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="451">ch-0078 L9634–9677；ch-0078 L9700–9744</text><circle cx="114" cy="540" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="585" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="596">08集</text><path d="M 126 540 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="495" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="529" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="539">v08-e02 · 事实</text><text x="212" y="573" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="587">雷奥失械败退与火马被俘</text><text x="212" y="621" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="633">黑龙夺枪、耐伤并抱住火马，逼雷奥脱身；以饶命问讯取得深渊信息</text><text x="212" y="657" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="669">，却以未约期限继续扣留。</text><text x="212" y="701" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="711">ch-0079 L9838–9868；ch-0080 L9931–9996；ch-0081 L10021–10035</text><circle cx="114" cy="800" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="845" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="856">08集</text><path d="M 126 800 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="755" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="789" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="799">v08-e03 · 事实</text><text x="212" y="833" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="847">黑四受创引出追击失守</text><text x="212" y="881" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="893">雷奥斩断黑四颈，黑龙召公爵图克并全员追敌，火马趁机逃跑；黑四</text><text x="212" y="917" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="929">换普通上半身。</text><text x="212" y="961" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="971">ch-0082 L10173–10227</text><circle cx="114" cy="1060" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1105" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1116">08集</text><path d="M 126 1060 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1015" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1049" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1059">v08-e04 · 事实</text><text x="212" y="1093" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1107">河岸救援与多兵种反击</text><text x="212" y="1141" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1153">黑龙从河底介入氓族断后战，召金属兵和魅率亡灵；菲力普重整后撤</text><text x="212" y="1177" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1189">，金属骷髅累计损十六。</text><text x="212" y="1221" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1231">ch-0083 L10324–10347；ch-0083 L10362–10384；ch-0084 L10413–10453</text><circle cx="114" cy="1320" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1365" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1376">08集</text><path d="M 126 1320 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1275" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1309" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1319">v08-e05 · 事实</text><text x="212" y="1353" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1367">旧记忆、隐瞒与氓族求助</text><text x="212" y="1401" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1413">羊皮书确认阿罗约族源，黑龙隐瞒其死因；族长献忠、揭亡灵祖先与</text><text x="212" y="1437" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1449">祭坛逆转，委托运魂。</text><text x="212" y="1481" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1491">ch-0084 L10464–10519；ch-0085 L10542–10610</text><circle cx="114" cy="1580" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1625" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1636">08集</text><path d="M 126 1580 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1535" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1569" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1579">v08-e06 · 事实</text><text x="212" y="1613" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1627">追兵撤离与蚕食内幕</text><text x="212" y="1661" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1673">雷奥和火马转向教会总部；菲力普执行蚕食命令，私下显四翼并害怕</text><text x="212" y="1697" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1709">沦为无意识工具。</text><text x="212" y="1741" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1751">ch-0085 L10641–10651；ch-0086 L10655–10689</text><circle cx="114" cy="1840" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1885" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1896">08集</text><path d="M 126 1840 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1795" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1829" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1839">v08-e07 · 事实</text><text x="212" y="1873" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1887">强迫入沼与收魂</text><text x="212" y="1921" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1933">阿古力特杀质疑者、威胁入沼并自献祭；黑龙押行，杀反抗族人及请</text><text x="212" y="1957" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1969">求速死的余者，将魂收进神器。</text><text x="212" y="2001" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2011">ch-0086 L10711–10813</text><circle cx="114" cy="2100" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2145" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2156">08集</text><path d="M 126 2100 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2055" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2089" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2099">v08-e08 · 事实</text><text x="212" y="2133" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2147">萝茜通过娜娜见克丽丝</text><text x="212" y="2181" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2193">萝茜渐能运用暗黑力量仍失忆，经娜娜和沉渊木进入克丽丝世界并与</text><text x="212" y="2217" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2229">其相见。</text><text x="212" y="2261" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2271">ch-0087 L10888–10953</text><circle cx="114" cy="2360" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2405" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2416">08集</text><path d="M 126 2360 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2315" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2349" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2359">v08-e09 · 事实</text><text x="212" y="2393" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2407">祭坛修复与首批启动</text><text x="212" y="2441" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2453">阿古力特七日苏醒后与亡灵修复祭坛，黑龙提供魔晶；限载放出三十</text><text x="212" y="2477" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2489">余魂，启动极致时出现未知苍老声音。</text><text x="212" y="2521" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2531">ch-0087 L10821–10844；ch-0087 L10954–10986</text><text x="64" y="2611" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2625">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2666" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2678">01  因果 · 事实 · v08-e01 → v08-e02</text><text x="84" y="2705" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2717">雷奥出手保密并迎战，黑龙据其身体与兵器特点展开下一层对决。</text><text x="84" y="2754" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2766">02  铺垫 · 研究推断 · v08-e02 → v08-e03</text><text x="84" y="2793" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2805">火马仍被扣留且早说明有机会就逃，雷奥返回突袭后出现实际脱困窗口。</text><text x="84" y="2842" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2854">03  铺垫 · 研究推断 · v08-e03 → v08-e06</text><text x="84" y="2881" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2893">雷奥与火马重组尾随，观察新增援力后转向总部，当前追击中止。</text><text x="84" y="2930" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2942">04  揭示 · 事实 · v08-e04 → v08-e05</text><text x="84" y="2969" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2981">战后服饰与羊皮书识别，把获救者接回阿罗约的族源和祭坛历史。</text><text x="84" y="3018" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="3030">05  揭示 · 研究推断 · v08-e04 → v08-e06</text><text x="84" y="3057" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3069">黑龙察觉菲力普未尽全力，后场的四翼与蚕食说明提供读者层解释。</text><text x="84" y="3106" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3118">06  因果 · 事实 · v08-e05 → v08-e07</text><text x="84" y="3145" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3157">族长提出收魂返坛方案并获黑龙接受，后以武力推动生命形式转换。</text><text x="84" y="3194" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3206">07  因果 · 事实 · v08-e07 → v08-e09</text><text x="84" y="3233" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3245">灵魂被收集并送到祭坛，缺失逆转知识与设施损坏迫使等待族长苏醒后修复启动。</text><text x="84" y="3282" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="3294">08  铺垫 · 事实 · v08-e05 → v08-e09</text><text x="84" y="3321" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3333">族长保存的逆转记录与亡灵传承知识组合，才有修复和重新运行的可能。</text><text x="64" y="3407" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3417">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
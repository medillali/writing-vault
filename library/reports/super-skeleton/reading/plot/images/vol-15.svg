<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3363" viewBox="0 0 1700 3363" role="img"><title>第十五集 泰坦骷髅 · 时间主干与分支</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">03 / 按主线进度查看事件与分支</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">第十五集 泰坦骷髅 · 时间主干与分支</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><path d="M 114 277 V 2539" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 280 C 1060 280 1060 280 1060 298 L 1060 1042 Q 1060 1060 992 1060" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 280 C 1115 280 1115 280 1115 298 L 1115 2082 Q 1115 2100 992 2100" stroke="#c05c25" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#ac05c25)"/><path d="M 984 800 C 1170 800 1170 800 1170 818 L 1170 1302 Q 1170 1320 992 1320" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1320 C 1060 1320 1060 1320 1060 1338 L 1060 1562 Q 1060 1580 992 1580" stroke="#7850b5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a7850b5)"/><path d="M 984 1580 C 1170 1580 1170 1580 1170 1598 L 1170 1822 Q 1170 1840 992 1840" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 1580 C 1225 1580 1225 1580 1225 1598 L 1225 2342 Q 1225 2360 992 2360" stroke="#537aa0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a537aa0)"/><path d="M 984 2100 C 1060 2100 1060 2100 1060 2118 L 1060 2342 Q 1060 2360 992 2360" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><rect x="1040" y="653.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="674.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="684.0">1</text><rect x="1095" y="1173.0" width="42" height="34" rx="8" fill="white" stroke="#c05c25"/><text x="1102" y="1194.0" font-size="20" font-weight="700" fill="#c05c25" data-left="1102" data-right="1136" data-bottom="1204.0">5</text><rect x="1150" y="1043.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="1064.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="1074.0">2</text><rect x="1040" y="1433.0" width="42" height="34" rx="8" fill="white" stroke="#7850b5"/><text x="1047" y="1454.0" font-size="20" font-weight="700" fill="#7850b5" data-left="1047" data-right="1081" data-bottom="1464.0">3</text><rect x="1150" y="1693.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1157" y="1714.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1157" data-right="1191" data-bottom="1724.0">4</text><rect x="1205" y="1953.0" width="42" height="34" rx="8" fill="white" stroke="#537aa0"/><text x="1212" y="1974.0" font-size="20" font-weight="700" fill="#537aa0" data-left="1212" data-right="1246" data-bottom="1984.0">7</text><rect x="1040" y="2213.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1047" y="2234.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1047" data-right="1081" data-bottom="2244.0">6</text><circle cx="114" cy="280" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="325" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="336">15集</text><path d="M 126 280 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="235" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="269" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="279">v15-e01 · 事实</text><text x="212" y="313" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="327">回归后暂禁活尸计划</text><text x="212" y="361" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="373">黑龙重返同伴，以位面规则和当前利益暂禁百万活尸阵，保留正常交</text><text x="212" y="397" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="409">战与撤退选择。</text><text x="212" y="441" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="451">ch-0156 L19055–19118；ch-0157 L19212–19267</text><circle cx="114" cy="540" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="585" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="596">15集</text><path d="M 126 540 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="495" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="529" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="539">v15-e02 · 事实</text><text x="212" y="573" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="587">音乐魔法获得教学任务</text><text x="212" y="621" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="633">罗得的异常力场经误认和排除后被解释为音乐魔法，黑龙安排招人并</text><text x="212" y="657" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="669">令其教学。</text><text x="212" y="701" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="711">ch-0157 L19289–19295；ch-0158 L19296–19397</text><circle cx="114" cy="800" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="845" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="856">15集</text><path d="M 126 800 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="755" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="789" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="799">v15-e03 · 事实</text><text x="212" y="833" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="847">海皇武装后遭冰禁咒损失</text><text x="212" y="881" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="893">八晶体补魂获得海皇武装；黑龙经海蛇到海底遗迹，逃禁咒时十七十</text><text x="212" y="917" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="929">八被冰封冻碎，未见恢复。</text><text x="212" y="961" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="971">ch-0159 L19462–19529；ch-0160 L19533–19600；ch-0161 L19604–19649</text><circle cx="114" cy="1060" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1105" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1116">15集</text><path d="M 126 1060 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1015" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1049" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1059">v15-e04 · 事实</text><text x="212" y="1093" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1107">调整兵权但未避免德鲁伊牺牲</text><text x="212" y="1141" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1153">黑龙把德鲁伊出战数减半，强收先知三十六龙魂约仍留指挥职；已投</text><text x="212" y="1177" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1189">入的五十余德鲁伊全部战死后尸兵扭转局面。</text><text x="212" y="1221" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1231">ch-0161 L19693–19730；ch-0162 L19731–19779</text><circle cx="114" cy="1320" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1365" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1376">15集</text><path d="M 126 1320 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1275" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1309" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1319">v15-e05 · 事实</text><text x="212" y="1353" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1367">独耗禁咒后遇泰坦与来袭天使</text><text x="212" y="1401" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1413">黑龙付魂力代价独闯，毁傀儡后封印自行开；泰坦先攻，四翼女子来</text><text x="212" y="1437" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1449">袭使双方暂联手毁其躯体、迫圣气退走。</text><text x="212" y="1481" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1491">ch-0162 L19782–19858；ch-0163 L19862–19985</text><circle cx="114" cy="1580" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1625" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1636">15集</text><path d="M 126 1580 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1535" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1569" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1579">v15-e06 · 事实</text><text x="212" y="1613" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1627">三圣器联系失落大陆并带守护者离开</text><text x="212" y="1661" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1673">大贤者讲亲历，三器触发意念见证红月通道、浮陆和哈力维亚。黑龙</text><text x="212" y="1697" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1709">获死亡之眼与最后未用禁咒，毁墓带二守护者返回。</text><text x="212" y="1741" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1751">ch-0164 L19997–20090；ch-0165 L20091–20207</text><circle cx="114" cy="1840" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1885" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1896">15集</text><path d="M 126 1840 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1795" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1829" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1839">v15-e07 · 事实</text><text x="212" y="1873" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1887">自然神真名说引出背叛推论</text><text x="212" y="1921" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1933">自然神称平衡神是切里莫；黑龙把三缺席君王、三主神和帝国远征相</text><text x="212" y="1957" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1969">连，但正文标明只是一面之词支撑的合理推测。</text><text x="212" y="2001" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2011">ch-0166 L20239–20335</text><circle cx="114" cy="2100" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2145" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2156">15集</text><path d="M 126 2100 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2055" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2089" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2099">v15-e08 · 事实</text><text x="212" y="2133" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2147">红月群体异常与祭魂阵重备</text><text x="212" y="2181" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2193">红月巫师无人指挥突袭，力量向生还者集中；天使现身后黑龙同意趁</text><text x="212" y="2217" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2229">机出击并重备祭魂阵，称不到最后不发动。</text><text x="212" y="2261" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2271">ch-0167 L20344–20465</text><circle cx="114" cy="2360" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2405" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2416">15集</text><path d="M 126 2360 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2315" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2349" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2359">v15-e09 · 事实</text><text x="212" y="2393" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2407">最后巫师自称达罗亚归来</text><text x="212" y="2441" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2453">战死、自爆与主动合一只余一人，侵蚀一名降临天使躯体后自报达罗</text><text x="212" y="2477" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2489">亚力绯克；黑龙会意挥手出城。</text><text x="212" y="2521" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2531">ch-0167 L20470–20499</text><text x="64" y="2611" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2625">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2666" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2678">01  铺垫 · 研究推断 · v15-e01 → v15-e04</text><text x="84" y="2705" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2717">回归后的集中决策为收回私人兵权建立权威，具体触发是德鲁伊争执。</text><text x="84" y="2754" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2766">02  因果 · 事实 · v15-e03 → v15-e05</text><text x="84" y="2793" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2805">孩子损失促使黑龙独返，用个人魂力换取突破。</text><text x="84" y="2842" font-size="23" font-weight="700" fill="#7850b5" data-left="84" data-right="1602" data-bottom="2854">03  铺垫 · 研究推断 · v15-e05 → v15-e06</text><text x="84" y="2881" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2893">误会缓解和共同退敌使守护者进入交流与交眼。</text><text x="84" y="2930" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2942">04  因果 · 研究推断 · v15-e06 → v15-e07</text><text x="84" y="2969" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2981">回归要求中的平衡与残警告推动黑龙向自然神索真名。</text><text x="84" y="3018" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="3030">05  转折 · 事实 · v15-e01 → v15-e08</text><text x="84" y="3057" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3069">原先暂禁的大阵回到备选清单，表明初禁基于时机和收益。</text><text x="84" y="3106" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="3118">06  因果 · 事实 · v15-e08 → v15-e09</text><text x="84" y="3145" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3157">死亡后聚能的规律经主动献身推向单一主体。</text><text x="84" y="3194" font-size="23" font-weight="700" fill="#537aa0" data-left="84" data-right="1602" data-bottom="3206">07  呼应 · 研究推断 · v15-e06 → v15-e09</text><text x="84" y="3233" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="3245">远方旧君王联系与现场自称旧君王形成历史进入现时的呼应。</text><text x="64" y="3319" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3329">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
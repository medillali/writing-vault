<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="926" viewBox="0 0 1700 926" role="img"><title>原萝茜的记忆与借力主体 · 3/3</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">原萝茜的记忆与借力主体 · 3/3</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">原萝茜能否整合残忆并自主运用借来力量？</text><path d="M 114 372 V 554" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">15集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v15-e07 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">自然神真名说引出背叛推论</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">自然神称平衡神是切里莫；黑龙把三缺席君王、三主神和帝国远征相</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">连，但正文标明只是一面之词支撑的合理推测。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0166 L20239–20335</text><rect x="64" y="618" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="666" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="680">部分回收 · 终点边界（第18集复核）</text><text x="88" y="721" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="733">原萝茜苏醒、异源残忆与借克丽丝力量护墙都已呈现，旧恨和亲近并存。第七集降临天使意念被吞并不等于原萝茜人格与克丽丝合并，后</text><text x="88" y="758" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="770">记未点名她；记忆完全整合及最终生活仍保留未知。</text><text x="64" y="882" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="892">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
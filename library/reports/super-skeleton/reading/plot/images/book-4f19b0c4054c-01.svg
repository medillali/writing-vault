<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3167" viewBox="0 0 1700 3167" role="img"><title>自然神保教与政治杀人 · 1/2</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">自然神保教与政治杀人 · 1/2</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">自然神的生存策略会付出什么道德和制度代价？</text><path d="M 114 372 V 2246" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 907 Q 1060 925 992 925" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 665 C 1115 665 1115 665 1115 683 L 1115 907 Q 1115 925 992 925" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 925 C 1170 925 1170 925 1170 943 L 1170 1197 Q 1170 1215 992 1215" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1511 C 1060 1511 1060 1511 1060 1529 L 1060 2049 Q 1060 2067 992 2067" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><rect x="1040" y="633.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="654.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="664.0">2</text><rect x="1095" y="778.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1102" y="799.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1102" data-right="1136" data-bottom="809.0">1</text><rect x="1150" y="1053.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1157" y="1074.0" font-size="20" font-weight="700" fill="#087f65" data-left="1157" data-right="1191" data-bottom="1084.0">3</text><rect x="1040" y="1772.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="1793.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="1803.0">4</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">10集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v10-e05 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">森林矮人冲突与被阻的追索</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">十七狂暴矮人遇战，十五死并制成傀儡；两兄弟逃回巨树。黑龙追林</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">被阻后为龙岛任务暂退。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0101 L13108–13126；ch-0101 L13174–13215；ch-0102 L13219–13309</text><text x="212" y="566" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="576">；ch-0102 L13310–13375</text><circle cx="114" cy="665" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="710" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="721">13集</text><path d="M 126 665 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="620" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="654" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="664">v13-e01 · 事实</text><text x="212" y="698" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="712">托雷战死与预录邀请</text><text x="212" y="746" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="758">黑龙乘新不死巨龙歼骑士，并群杀托雷一行；自然神预录讯息出现，</text><text x="212" y="782" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="794">引其赴约；疾风援军另由伙伴组织。</text><text x="212" y="826" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="836">ch-0131 L16470–16518；ch-0131 L16538–16565；ch-0131 L16519–16530</text><circle cx="114" cy="925" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="970" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="981">13集</text><path d="M 126 925 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="880" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="914" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="924">v13-e02 · 事实</text><text x="212" y="958" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="972">自然神合作与双神传承安排</text><text x="212" y="1006" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1018">自然神确认残源处境，以帝国线索促合作；双神选娜娜共同传承，萝</text><text x="212" y="1042" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1054">茜留护并开始三力融合，仪式尚未完成。</text><text x="212" y="1086" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1096">ch-0132 L16606–16641；ch-0133 L16710–16714；ch-0133 L16750–16773</text><text x="212" y="1116" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1126">；ch-0133 L16787–16813</text><circle cx="114" cy="1215" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1260" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1271">14集</text><path d="M 126 1215 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1170" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1204" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1214">v14-e05 · 事实</text><text x="212" y="1248" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1262">补叙沙里克控制、信仰通路与战争组织</text><text x="212" y="1296" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1308">回叙补明先知秘密转生统治者、掌财政和工程，疾风因生计接受安排</text><text x="212" y="1332" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1344">；娜娜恢复自然神信仰通路。黑大黑二袭移民点逼教会应对，组织与</text><text x="212" y="1368" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1380">不死劳力支持长期战争。</text><text x="212" y="1412" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1422">ch-0151 L18623–18655；ch-0151 L18664–18719；ch-0153 L18985–18990</text><circle cx="114" cy="1511" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1556" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1567">14集</text><path d="M 126 1511 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1466" width="796" height="256" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1500" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1510">v14-e09 · 事实</text><text x="212" y="1544" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1558">两神借身对峙，黑龙归来但未裁决</text><text x="212" y="1592" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1604">自然神通过娜娜、克丽丝通过萝茜显现，先知威胁眼前两分身。魂链</text><text x="212" y="1628" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1640">恢复后黑龙携队到场询问是否要打架，活尸阵处置、先知责任和战争</text><text x="212" y="1664" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1676">结局均未在本集裁决。</text><text x="212" y="1708" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1718">ch-0154 L19009–19047</text><circle cx="114" cy="1807" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1852" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1863">15集</text><path d="M 126 1807 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1762" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1796" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1806">v15-e04 · 事实</text><text x="212" y="1840" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1854">调整兵权但未避免德鲁伊牺牲</text><text x="212" y="1888" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1900">黑龙把德鲁伊出战数减半，强收先知三十六龙魂约仍留指挥职；已投</text><text x="212" y="1924" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1936">入的五十余德鲁伊全部战死后尸兵扭转局面。</text><text x="212" y="1968" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1978">ch-0161 L19693–19730；ch-0162 L19731–19779</text><circle cx="114" cy="2067" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="2112" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="2123">15集</text><path d="M 126 2067 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="2022" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="2056" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="2066">v15-e07 · 事实</text><text x="212" y="2100" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="2114">自然神真名说引出背叛推论</text><text x="212" y="2148" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2160">自然神称平衡神是切里莫；黑龙把三缺席君王、三主神和帝国远征相</text><text x="212" y="2184" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2196">连，但正文标明只是一面之词支撑的合理推测。</text><text x="212" y="2228" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2238">ch-0166 L20239–20335</text><text x="64" y="2318" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2332">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2373" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2385">01  因果 · 研究推断 · v13-e01 → v13-e02</text><text x="84" y="2412" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2424">托雷死后释放的邀请促成赴林合作谈判</text><text x="84" y="2461" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2473">02  揭示 · 事实 · v10-e05 → v13-e02</text><text x="84" y="2500" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2512">以惩罚与恩赐逼取信仰的巨树确认为自然神，合作出现不抹去其先前强迫行为</text><text x="84" y="2549" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2561">03  回收 · 事实 · v13-e02 → v14-e05</text><text x="84" y="2588" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2600">传承安排之后娜娜承担信仰媒介作用，但此处不能据此宣布双神传承全部完成</text><text x="84" y="2637" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2649">04  揭示 · 事实 · v14-e09 → v15-e07</text><text x="84" y="2676" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2688">后文进一步说明自然神本源借娜娜、分身留树；少女主体与神明仍须分开记录</text><text x="84" y="2725" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="2737">05  转折 · 事实 · v15-e07 → v16-e04〔跨页接续〕</text><text x="84" y="2764" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2776">合作中的自然神以暗害旧长老保障神谕，娜娜的亲见与质问揭开维系联盟的代价</text><rect x="64" y="2810" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2858" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2872">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2913" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2925">自然神身份、媒介娜娜、保教合作与暗杀旧大长老的代价逐步显现；后记娜娜青春验证传承持续影响。不能据此补自然神本源全部转移、</text><text x="88" y="2950" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2962">全部信徒自愿接受或政治后果已解决，早期本源与分身通路的疑点仍保留。</text><text x="64" y="3037" font-size="23" font-weight="400" fill="#2563a6" data-left="64" data-right="1636" data-bottom="3049">继续下一张：2/2。跨页边仅在起点页列出；终点结论在各页重复，便于单独保存。</text><text x="64" y="3123" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="3133">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
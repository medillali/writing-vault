x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">老罗格凝魂与临终祈愿 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fcecef" stroke="#fcecef"/><text x="86" y="273" font-size="24" font-weight="700" fill="#bf3b42" data-left="86" data-right="356" data-bottom="285">未回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">祈愿与死后凝聚魂火有何关系？</text><path d="M 114 372 V 554" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">09集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v09-e05 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">救镇、收魂与英雄传播</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">跨段追踪：黑龙为魂骨消灭屠镇敌军，同伴救助平民，老罗格残魂异</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">常；后段回叙救民事迹被群众和反抗组织传播。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0092 L11656–11683；ch-0092 L11707–11745；ch-0095 L12279–12307</text><rect x="64" y="618" width="1572" height="184" rx="14" fill="#fcecef" stroke="#fcecef"/><text x="88" y="666" font-size="28" font-weight="700" fill="#bf3b42" data-left="88" data-right="1606" data-bottom="680">未回收 · 终点边界（第18集复核）</text><text x="88" y="721" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="733">临终祈愿与死后魂火凝聚相邻出现，黑龙也观察到异常，但没有直接说明特殊契约或具体信仰因果。不能用后期一般信仰机制自动补成老</text><text x="88" y="758" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="770">罗格这次现象的确切解释。</text><text x="64" y="882" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="892">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
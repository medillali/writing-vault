<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="3000" viewBox="0 0 1700 3000" role="img"><title>噬魂权限与死息傀儡 · 1/1</title><desc>按主线阅读进度排列，回收状态采用全书终点复核。</desc><defs><marker id="a087f65" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087f65"/></marker><marker id="a147d8b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#147d8b"/></marker><marker id="a2563a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker><marker id="a537aa0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537aa0"/></marker><marker id="a7850b5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7850b5"/></marker><marker id="aa5650b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#a5650b"/></marker><marker id="abf3b42" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b42"/></marker><marker id="abf3b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#bf3b75"/></marker><marker id="ac05c25" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c05c25"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1700" height="12" rx="0" fill="#2563a6" stroke="#2563a6"/><text x="64" y="64" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="1636" data-bottom="75">04 / 一条暗线的埋设、揭示与终点</text><text x="64" y="127" font-size="44" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="149">噬魂权限与死息傀儡 · 1/1</text><text x="64" y="189" font-size="24" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="201">蓝色主干：阅读顺序；彩色旁路：已有语义关系。回叙与跨段聚合保留原标注，不能当作同一时点。</text><rect x="64" y="235" width="1572" height="69" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="86" y="273" font-size="24" font-weight="700" fill="#a5650b" data-left="86" data-right="356" data-bottom="285">部分回收 · 全书终点</text><text x="360" y="275" font-size="26" font-weight="400" fill="#172b46" data-left="360" data-right="1610" data-bottom="288">如何认主、吞魂制造傀儡，古主遗产何来？</text><path d="M 114 372 V 2040" stroke="#2563a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1" marker-end="url(#a2563a6)"/><path d="M 984 375 C 1060 375 1060 375 1060 393 L 1060 647 Q 1060 665 992 665" stroke="#c05c25" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#ac05c25)"/><path d="M 984 665 C 1115 665 1115 665 1115 683 L 1115 1227 Q 1115 1245 992 1245" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 665 C 1170 665 1170 665 1170 683 L 1170 1487 Q 1170 1505 992 1505" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><path d="M 984 665 C 1225 665 1225 665 1225 683 L 1225 937 Q 1225 955 992 955" stroke="#147d8b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="0.85" marker-end="url(#a147d8b)"/><path d="M 984 665 C 1280 665 1280 665 1280 683 L 1280 937 Q 1280 955 992 955" stroke="#087f65" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#a087f65)"/><path d="M 984 1505 C 1060 1505 1060 1505 1060 1523 L 1060 1777 Q 1060 1795 992 1795" stroke="#a5650b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#aa5650b)"/><rect x="1040" y="503.0" width="42" height="34" rx="8" fill="white" stroke="#c05c25"/><text x="1047" y="524.0" font-size="20" font-weight="700" fill="#c05c25" data-left="1047" data-right="1081" data-bottom="534.0">3</text><rect x="1095" y="938.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1102" y="959.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1102" data-right="1136" data-bottom="969.0">4</text><rect x="1150" y="1068.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1157" y="1089.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1157" data-right="1191" data-bottom="1099.0">5</text><rect x="1205" y="793.0" width="42" height="34" rx="8" fill="white" stroke="#147d8b"/><text x="1212" y="814.0" font-size="20" font-weight="700" fill="#147d8b" data-left="1212" data-right="1246" data-bottom="824.0">1</text><rect x="1260" y="793.0" width="42" height="34" rx="8" fill="white" stroke="#087f65"/><text x="1267" y="814.0" font-size="20" font-weight="700" fill="#087f65" data-left="1267" data-right="1301" data-bottom="824.0">2</text><rect x="1040" y="1633.0" width="42" height="34" rx="8" fill="white" stroke="#a5650b"/><text x="1047" y="1654.0" font-size="20" font-weight="700" fill="#a5650b" data-left="1047" data-right="1081" data-bottom="1664.0">6</text><circle cx="114" cy="375" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="420" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="431">09集</text><path d="M 126 375 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="330" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="364" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="374">v09-e06 · 事实</text><text x="212" y="408" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="422">敌方部署与未明态度</text><text x="212" y="456" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="468">穿插于多章的敌方行动：安德鲁动摇回圣山，雷奥获噬魂，菲力普派</text><text x="212" y="492" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="504">队查失踪；到黑龙赋魂释能时，教皇和菲力普感到强波动却未出手。</text><text x="212" y="536" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="546">ch-0090 L11282–11303；ch-0093 L11757–11794；ch-0093 L11801–11823</text><text x="212" y="566" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="576">；ch-0094 L11936–11942</text><circle cx="114" cy="665" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="710" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="721">10集</text><path d="M 126 665 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="620" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="654" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="664">v10-e04 · 事实</text><text x="212" y="698" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="712">雷奥刺杀失败、死亡与噬魂制傀儡</text><text x="212" y="746" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="758">魅带俘近前被雷奥利用，分魂刺杀遭枪的亲和规则阻止；雷奥魂灭，</text><text x="212" y="782" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="794">噬魂吞魂制出同形傀儡。</text><text x="212" y="826" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="836">ch-0099 L12843–12861；ch-0100 L12885–12944；ch-0100 L12965–13014</text><text x="212" y="856" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="866">；ch-0101 L13048–13052</text><circle cx="114" cy="955" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1000" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1011">10集</text><path d="M 126 955 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="910" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="944" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="954">v10-e05 · 事实</text><text x="212" y="988" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1002">森林矮人冲突与被阻的追索</text><text x="212" y="1036" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1048">十七狂暴矮人遇战，十五死并制成傀儡；两兄弟逃回巨树。黑龙追林</text><text x="212" y="1072" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1084">被阻后为龙岛任务暂退。</text><text x="212" y="1116" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1126">ch-0101 L13108–13126；ch-0101 L13174–13215；ch-0102 L13219–13309</text><text x="212" y="1146" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1156">；ch-0102 L13310–13375</text><circle cx="114" cy="1245" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1290" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1301">11集</text><path d="M 126 1245 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1200" width="796" height="220" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1234" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1244">v11-e02 · 事实</text><text x="212" y="1278" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1292">夺舍危机引发群体反击与真武装</text><text x="212" y="1326" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1338">海皇谋夺躯体，黑龙先攻召援；斯科特领域护军，十孩供力使黑龙凝</text><text x="212" y="1362" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1374">成真正魂兵。</text><text x="212" y="1406" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1416">ch-0108 L13998–14051；ch-0108 L14062–14086；ch-0109 L14097–14143</text><circle cx="114" cy="1505" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1550" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1561">16集</text><path d="M 126 1505 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1460" width="796" height="250" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1494" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1504">v16-e01 · 事实</text><text x="212" y="1538" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1552">强降机制获确认，雷奥恢复神智</text><text x="212" y="1586" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1598">红月信徒被确认是达罗亚强降路径；黑龙出战并归枪，达罗亚放出旧</text><text x="212" y="1622" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1634">三傀儡及新近恢复意识的雷奥，哥顿普感魂到来。</text><text x="212" y="1666" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1676">ch-0169 L20511–20530；ch-0169 L20583–20591；ch-0170 L20595–20655</text><text x="212" y="1696" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1706">；ch-0171 L20659–20676</text><circle cx="114" cy="1795" r="11" fill="#2563a6" stroke="white" stroke-width="3"/><text x="64" y="1840" font-size="22" font-weight="700" fill="#2563a6" data-left="64" data-right="158" data-bottom="1851">18集</text><path d="M 126 1795 H 186" stroke="#2563a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" opacity="1"/><rect x="188" y="1750" width="796" height="286" rx="14" fill="white" stroke="#d9e2ed"/><text x="212" y="1784" font-size="20" font-weight="400" fill="#2563a6" data-left="212" data-right="954" data-bottom="1794">v18-e05 · 事实</text><text x="212" y="1828" font-size="28" font-weight="700" fill="#172b46" data-left="212" data-right="954" data-bottom="1842">五力量分身吞天使补能</text><text x="212" y="1876" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1888">三人遭无自我光影天使拦截，黑龙放出五受控力量体吞噬，全部回收</text><text x="212" y="1912" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1924">后消化，气息大增；尼女辨黑晶即混沌之灵实体，并回想教皇送枪布</text><text x="212" y="1948" font-size="24" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="1960">局。</text><text x="212" y="1992" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2002">ch-0199 L23795–23813；ch-0199 L23828–23873；ch-0200 L23874–23904</text><text x="212" y="2022" font-size="20" font-weight="400" fill="#51637a" data-left="212" data-right="954" data-bottom="2032">；ch-0201 L24158–24172</text><text x="64" y="2112" font-size="28" font-weight="700" fill="#172b46" data-left="64" data-right="1636" data-bottom="2126">旁路关系说明 · 编号对应图中连线</text><text x="84" y="2167" font-size="23" font-weight="700" fill="#147d8b" data-left="84" data-right="1602" data-bottom="2179">01  因果 · 事实 · v10-e04 → v10-e05</text><text x="84" y="2206" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2218">取得噬魂的实力与亲和使黑龙决意启程，并在森林战中实际运用。</text><text x="84" y="2255" font-size="23" font-weight="700" fill="#087f65" data-left="84" data-right="1602" data-bottom="2267">02  回收 · 事实 · v10-e04 → v10-e05</text><text x="84" y="2294" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2306">首次制雷奥形傀儡的能力在十五矮人灵魂上再次验证。</text><text x="84" y="2343" font-size="23" font-weight="700" fill="#c05c25" data-left="84" data-right="1602" data-bottom="2355">03  转折 · 事实 · v09-e06 → v10-e04</text><text x="84" y="2382" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2394">雷奥所持噬魂因同源亲和未能伤害黑龙灵魂，刺杀反转为雷奥死亡及同形傀儡生成，教皇动机仍未明</text><text x="84" y="2431" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2443">04  揭示 · 研究推断 · v10-e04 → v11-e02</text><text x="84" y="2470" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2482">已有神器和实体附能并非真正纯魂武装，海皇危机中十孩供力促成黑龙凝兵</text><text x="84" y="2519" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2531">05  揭示 · 事实 · v10-e04 → v16-e01</text><text x="84" y="2558" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2570">噬魂枪的无意识傀儡阶段出现新进展：雷奥因吞魂进化并恢复神智；后来的恢复不能倒填此前意识状态</text><text x="84" y="2607" font-size="23" font-weight="700" fill="#a5650b" data-left="84" data-right="1602" data-bottom="2619">06  揭示 · 事实 · v16-e01 → v18-e05</text><text x="84" y="2646" font-size="23" font-weight="400" fill="#51637a" data-left="84" data-right="1602" data-bottom="2658">雷奥恢复神智后续出送枪机缘的布局说明：教皇借他送枪，为黑龙布置机缘，不等雷奥知晓全部计划</text><rect x="64" y="2692" width="1572" height="184" rx="14" fill="#fff3dc" stroke="#fff3dc"/><text x="88" y="2740" font-size="28" font-weight="700" fill="#a5650b" data-left="88" data-right="1606" data-bottom="2754">部分回收 · 终点边界（第18集复核）</text><text x="88" y="2795" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2807">噬魂与达罗亚旧主关系、吞魂形成傀儡并进化、雷奥恢复神智均获后证。黑龙能复制枪却仍不能支配枪内傀儡；教皇借雷奥送枪布置机缘</text><text x="88" y="2832" font-size="25" font-weight="400" fill="#172b46" data-left="88" data-right="1606" data-bottom="2844">已明。武器完整流转链、所有傀儡人格记忆及最终权限并未全面解释。</text><text x="64" y="2956" font-size="20" font-weight="400" fill="#51637a" data-left="64" data-right="1636" data-bottom="2966">《超级骷髅兵》研究图 · 研究草稿待审阅 · 章节与行号可回查正文 · PNG / SVG</text></g></svg>
d94f", "conclusion": "盐磷与黑蛇定位匡飞、天骑后，天狂逐前者而留后者，利用狂龙以为尚有未曝光内线的误判传递假情报。天骑后来承认钱与暗恋林菲的动机，完成围狂龙后被逐。后段收买圣剑是另一场公开信息受限的博弈，只作机制回响，不能把圣剑并为同一内线。"}, {"id": "book-taburet-oslinlan", "number": 2, "status": "resolved", "anchor": "event-cc179c6da26a3a5403bf", "conclusion": "阳光折射才显出的吊坠铭文重释塔布雷特的忍痛凝望；提莫斯偷项链诱其赴修道院，夺本命骷髅又触发奥斯林兰预设的同死诅咒。修道院阶段已有释放与宽恕，最终神之境直接看见塔布雷特、奥斯林兰幸福相拥，是后文确证的迟到收束。不能继续把这对人物标为全书未解。"}, {"id": "book-kamori-retrial", "number": 3, "status": "resolved", "anchor": "event-4ffa2e02398a23963aa1", "conclusion": "拒绝雇主的单方版本后取回头颅，恢复卡莫里的发言能力；信件、居所与神誓互证里奥多勾结盗贼栽赃。惩凶并实际改写史书完成昭雪，战马是旧主人临终托付的伙伴，不是无来由的怪物掉落。此支线独立起点与独立收束，不需要硬接王室政变。"}, {"id": "book-demon-ring-politics", "number": 4, "status": "partial", "anchor": "event-31bad3bdaa157943837d", "conclusion": "鉴定绑定给出三系天赋，共鸣与魔化引来觊觎；引导100%会夺舍，保留意识等待神罚才解咒。旧鉴定师后来确为马尔都克，王杀政变者后赠缺失附件，四附件合成魔神戒并在后段实升神器。卡尔洛斯是融合的戒灵而非可直接战斗的额外强者。七功勋遗物作为异界钥匙的传说未完整开启，经验吸取比例冲突、早期动机与圆图细节没有被一概抹平。"}, {"id": "book-arland-father", "number": 5, "status": "resolved", "anchor": "event-fbc95153f22082c39050", "conclusion": "王赠缺失遗物时暂缓身份答案，328/329对应单元直接认父并解释天下公司股东、工作人员扮NPC与维护职责；后续公爵奖和父亲萧寒安排现实重逢深化关爱。这是确证身份，不能再列为未知；也不能倒填每句早期心理或把父亲解释成能任意改规则。封爵公平措辞冲突仍是局部异常。"}], "roots": ["event-fbf2f3f70912abb7f720", "event-71356b5aa641836a8c8d", "event-eeb4df366744e9baeffc", "event-c667c48a001387436912", "event-87e335110d3ef16a51d2", "event-18b5f9e30dd2db87b5dd", "event-45aa43197d25026437d5", "event-206405061fb4c1dd3134", "event-3bf71431b759fa648e77", "event-7a7504bf013eb7536cd6", "event-029f588ac9c772b1ca81", "event-fe3ecfc618652859d71a", "event-b5cf700ec12a95011958", "event-1e126d1f698fd075de58", "event-5d61e306ca7b40017357", "event-572c9df24c179f946c7e", "event-8163368e794ccbf99d9f", "event-5081e468a0cfa4b8eb23", "event-3c3649c60ef15d954a2f", "event-9e2d15f654d457be3b5d", "event-efba265a2cd395c1a9c9", "event-d7cb921ac0fc9dfb0bce", "event-a1c559f80c09604db3ab", "event-5e7ec249f48f03c58ea8", "event-6c58b96047a1db89a059", "event-377b0476ccafaff84505", "event-f1d701491015fe4baf68", "event-4b68e76bb133f06baa95", " const claims={fact:'原文事实',inference:'研究推断',synthesis:'研究综合',plan:'计划',reading_order:'阅读顺序，非因果'},knowledgeStates={unknown:'未知',suspects:'怀疑',knows:'知道',misbelieves:'误以为'};
const vp=document.getElementById('viewport'),canvas=document.getElementById('canvas'),svg=canvas.querySelector('svg'),panel=document.getElementById('detail');
document.getElementById('save-svg').href=URL.createObjectURL(new Blob([svg.outerHTML],{type:'image/svg+xml;charset=utf-8'}));
let scale=1,tx=0,ty=0,drag=null,dragged=false,query='',matchIndex=0;
function apply(){canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;document.getElementById('zoom').textContent=Math.round(scale*100)+'%';}
function fitRect(x,y,w,h){const margin=30;scale=Math.min((vp.clientWidth-margin*2)/w,(vp.clientHeight-margin*2)/h,2);scale=Math.max(.005,scale);tx=(vp.clientWidth-w*scale)/2-x*scale;ty=(vp.clientHeight-h*scale)/2-y*scale;apply();}
function fit(){fitRect(0,0,data.meta.width,data.meta.height);}
function zoom(factor,x=vp.clientWidth/2,y=vp.clientHeight/2){const next=Math.max(.005,Math.min(3,scale*factor));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;apply();}
function evidence(items){return (items||[]).map(e=>`${e.chapter_id} · L${e.start_line}—${e.end_line}`).join('\n');}
function detail(title,label,text,proof=''){panel.classList.add('open');document.getElementById('neighbors').replaceChildren();document.getElementById('detail-title').textContent=title;document.getElementById('detail-label').textContent=label;document.getElementById('detail-text').textContent=text;document.getElementById('detail-evidence').textContent=proof;}
function clear(){svg.querySelectorAll('.dim,.selected').forEach(el=>el.classList.remove('dim','selected'));document.getElementById('notice').textContent='主线分枝 · 旁支另起 · 共享事件处交汇';}
const relations={cause:'因果',setup:'铺垫',reveal:'揭示',reversal:'转折',payoff:'回收',echo:'呼应',misdirection:'误导',sequence:'阅读衔接（非因果）'};
function mark(ids,edgeIds=null){const keep=new Set(ids);svg.querySelectorAll('[data-kind=event],[data-kind=thread]').forEach(el=>el.classList.toggle('dim',!keep.has(el.id)));svg.querySelectorAll('[data-kind=edge],[data-kind=annotation]').forEach(el=>el.classList.toggle('dim',edgeIds&&el.dataset.kind==='edge'?!edgeIds.has(el.id):!(keep.has(el.dataset.from)&&keep.has(el.dataset.to))));}
function focusIds(ids){const boxes=ids.map(id=>data.meta.positions[id]).filter(Boolean);if(!boxes.length)return;const x=Math.min(...boxes.map(b=>b.x)),y=Math.min(...boxes.map(b=>b.y));fitRect(x-70,y-70,Math.max(...boxes.map(b=>b.x+b.width))-x+140,Math.max(...boxes.map(b=>b.y+b.height))-y+140);}
function neighbors(nid){const dest=document.getElementById('neighbors');Object.values(data.edges).filter(e=>e.from===nid||e.to===nid).forEach(e=>{const other=e.from===nid?e.to:e.from;const b=document.createElement('button');b.textContent=(e.to===nid?'来自：':'通向：')+data.nodes[other].title+' · '+relations[e.kind];b.style.cssText='display:block;text-align:left;width:100%;margin:8px 0;line-height:1.7';b.title=e.label;b.onclick=()=>select(other,true);dest.append(b)});}
function select(id,focus=false){
 clear();const el=document.getElementById(id);if(el)el.classList.add('selected');
 if(data.nodes[id]){const n=data.nodes[id],pos=data.meta.positions[id],links=Object.values(data.edges).filter(e=>e.from===id||e.to===id);mark([id,...links.flatMap(e=>[e.from,e.to])],new Set(links.map(e=>e.id)));detail(n.title,`${id} · ${claims[n.claim_kind]||'研究记录'}${data.meta.time_labels[id]?' · '+data.meta.time_labels[id]:''}`,n.summary+'\n\n'+(n.knowledge||[]).map(k=>`${data.observers[k.observer]||'未注明观察者'} · ${knowledgeStates[k.state]||k.state}：${k.belief}`).join('\n'),evidence(n.evidence));neighbors(id);if(focus)fitRect(pos.x-150,pos.y-170,pos.width+300,pos.height+340);}
 else if(data.threads[id]){const t=data.threads[id],m=data.meta.threads.find(x=>x.id===id),ids=[id,...t.node_ids,...t.edge_ids.flatMap(e=>[data.edges[e].from,data.edges[e].to])];detail(t.title,(m?'暗线'+String(m.number).padStart(2,'0')+' · ':'剧情线 · ')+({resolved:'已回收',partial:'部分回收',open:'未回收',unknown:'原文未明',abandoned:'明确中断'}[t.status]),t.question+'\n\n'+t.resolution_note,evidence(t.evidence));mark(ids,new Set(t.edge_ids));if(focus)focusIds(ids);document.getElementById('notice').textContent='已聚焦：'+t.title.split(' · ').pop()+'；共享事件仍保持原位';}
 else if(data.edges[id]){const e=data.edges[id];mark([e.from,e.to],new Set([id]));detail(relations[e.kind]+' · '+data.nodes[e.from].title+' → '+data.nodes[e.to].title,`${e.from} → ${e.to} · ${claims[e.claim_kind]||'研究记录'}`,e.label,evidence(e.evidence));if(focus)focusIds([e.from,e.to]);}
}
document.getElementById('fit').onclick=fit;
document.getElementById('mainline').onclick=()=>select(data.meta.core,true);
document.getElementById('threads').onclick=()=>{clear();panel.classList.remove('open');const ids=data.meta.threads.filter(t=>t.status!=='resolved').flatMap(t=>[t.id,t.anchor]);mark(ids);focusIds(ids);document.getElementById('notice').textContent=data.meta.threads.filter(t=>t.status!=='resolved').length+'条待回收或未明暗线；状态以各枝端注记为准，点击展开整条线';};
document.getElementById('junctions').onclick=()=>{clear();panel.classList.remove('open');mark(data.meta.junctions);fit();document.getElementById('notice').textContent='金色标记为多路交汇；点击事件可沿来源与去向继续查看';};
const branch=document.getElementById('branch');Object.values(data.threads).forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=({main:'主线',subplot:'支线',hidden:'暗线'}[t.kind])+' · '+t.title.split(' · ').pop();branch.append(o)});branch.onchange=()=>{if(branch.value)select(branch.value,true)};
document.getElementById('plus').onclick=()=>zoom(1.4);document.getElementById('minus').onclick=()=>zoom(1/1.4);
document.getElementById('clear').onclick=clear;
document.getElementById('close').onclick=()=>panel.classList.remove('open');
const volume=document.getElementById('volume');data.volumes.forEach((v,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=v.title;volume.append(o)});
volume.onchange=()=>{if(!volume.value)return;clear();panel.classList.remove('open');const ids=data.meta.events.filter(id=>data.meta.positions[id].volume===Number(volume.value));mark(ids);focusIds(ids);};
function find(){const term=document.getElementById('search').value.trim();if(!term)return;const matches=Object.values(data.nodes).filter(n=>(n.title+' '+n.summary).includes(term));if(!matches.length){document.getElementById('notice').textContent='本图精选事件中未找到：'+term;return;}if(query!==term){query=term;matchIndex=0;}const n=matches[matchIndex%matches.length];select(n.id,true);document.getElementById('notice').textContent=`${matchIndex%matches.length+1}/${matches.length}：再次查找可跳到下一项`;matchIndex++;}
document.getElementById('find').onclick=find;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')find()};
vp.addEventListener('wheel',e=>{e.preventDefault();const b=vp.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-b.left,e.clientY-b.top)},{passive:false});
// 超过拖动阈值后才捕获指针，普通点击仍交给事件卡片。
vp.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,tx,ty};dragged=false;vp.classList.add('drag')});
vp.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){dragged=true;vp.setPointerCapture(e.pointerId)}tx=drag.tx+dx;ty=drag.ty+dy;apply()});
vp.addEventListener('pointerup',e=>{drag=null;vp.classList.remove('drag');if(vp.hasPointerCapture(e.pointerId))vp.releasePointerCapture(e.pointerId)});
vp.addEventListener('pointercancel',()=>{drag=null;vp.classList.remove('drag')});
svg.addEventListener('click',e=>{if(dragged)return;const g=e.target.closest('[data-kind]');if(g)select(g.id)});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('[data-kind]');if(g){e.preventDefault();select(g.id,true)}}});
vp.addEventListener('dblclick',e=>{if(!e.target.closest('[data-kind]'))fit()});
window.addEventListener('resize',fit);document.fonts.ready.then(fit);
</script></body></html>

const thread=document.getElementById('thread'),section=document.getElementById('section');
const stateNames={open:'未回收',partial:'部分回收',resolved:'已回收',abandoned:'已放弃',unknown:'未确认'};
for(const t of graph.threads){const o=document.createElement('option');o.value=t.id;o.textContent=t.title+' · '+(stateNames[t.status]||t.status);thread.append(o)}
for(const n of graph.nodes.filter(n=>['volume','arc'].includes(n.kind))){const o=document.createElement('option');o.value=n.id;o.textContent=n.title;section.append(o)}
let zoom=1;
function show(node){document.getElementById('detail-title').textContent=node.title;document.getElementById('status').textContent=node.kind+' / '+node.claim_kind;document.getElementById('summary').textContent=node.summary||'此节点暂无概述；查看下方记录。';document.getElementById('details').textContent=JSON.stringify(node,null,2)}
document.querySelectorAll('[data-node]').forEach(el=>{el.addEventListener('click',()=>show(byId.get(el.dataset.node)));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(byId.get(el.dataset.node))}})});
function filter(){const selected=graph.threads.find(t=>t.id===thread.value);const visible=new Set();for(const n of graph.nodes){let p=n;while(p){if(!section.value||p.id===section.value){visible.add(n.id);break}p=byId.get(p.parent_id)}}document.querySelectorAll('[data-node]').forEach(el=>{el.style.display=visible.has(el.dataset.node)?'':'none';el.style.opacity=selected&&!selected.node_ids.includes(el.dataset.node)?'.3':'1'});document.querySelectorAll('.relation,.structure').forEach(el=>{const inSection=visible.has(el.dataset.from)&&visible.has(el.dataset.to);const inThread=!el.classList.contains('relation')||(!thread.value||(thread.value!=='__none'&&el.dataset.threads.split(' ').includes(thread.value)));el.style.display=inSection&&inThread?'':'none'});if(selected){document.getElementById('detail-title').textContent=selected.title;document.getElementById('status').textContent=stateNames[selected.status]||selected.status;document.getElementById('summary').textContent=selected.resolution_note||'选择相关节点查看铺垫、推进与回收依据。';document.getElementById('details').textContent=JSON.stringify(selected,null,2)}}
thread.addEventListener('change',filter);section.addEventListener('change',filter);
for(const mode of ['tree','network']){document.getElementById(mode).addEventListener('click',()=>{for(const other of ['tree','network']){document.getElementById(other+'-canvas').hidden=other!==mode;document.getElementById(other).classList.toggle('active',other===mode)}})}
function setZoom(delta){zoom=Math.max(.5,Math.min(3,zoom+delta));document.querySelectorAll('.canvas').forEach(el=>{el.style.width=(zoom*100)+'%'})}
document.getElementById('zoom-in').addEventListener('click',()=>setZoom(.25));document.getElementById('zoom-out').addEventListener('click',()=>setZoom(-.25));
document.getElementById('footer').textContent='离线视图 · '+(graph.graph_id||'未保存图')+' · v'+(graph.revision||'草稿')+' · 完整 JSON 为数据主档';
</script></body></html>

418, "end_line": 20521, "claim_kind": "synthesis"}]}, {"id": "v03-t-againstwind", "title": "逆风平原任务", "kind": "subplot", "status": "resolved", "node_ids": ["v03-tiger_shares"], "edge_ids": [], "evidence": [{"source_id": "src-2a13958390274509b2af019f6b12d981", "revision": "2c541951301de981c755ebf4001bf3ec909d1e7d44314e14fa8af51751849a52", "chapter_id": "ch-0232", "start_line": 20418, "end_line": 20521, "claim_kind": "synthesis"}, {"source_id": "src-2a13958390274509b2af019f6b12d981", "revision": "2c541951301de981c755ebf4001bf3ec909d1e7d44314e14fa8af51751849a52", "chapter_id": "ch-0236", "start_line": 20864, "end_line": 20960, "claim_kind": "synthesis"}, {"source_id": "src-2a13958390274509b2af019f6b12d981", "revision": "2c541951301de981c755ebf4001bf3ec909d1e7d44314e14fa8af51751849a52", "chapter_id": "ch-0237", "start_line": 20961, "end_line": 21113, "claim_kind": "synthesis"}], "stage_note": "四虎及小怪清，236实际交，不代替未落实分金旧装承诺。", "resolution_note": "四虎及小怪清，236实际交，不代替未落实分金旧装承诺。", "resolution_evidence": [{"source_id": "src-2a13958390274509b2af019f6b12d981", "revision": "2c541951301de981c755ebf4001bf3ec909d1e7d44314e14fa8af51751849a52", "chapter_id": "ch-0237", "start_line": 20961, "end_line": 21113, "claim_kind": "synthesis"}]}], "owner": {"kind": "source", "id": "src-2a13958390274509b2af019f6b12d981"}}</script>
<script>
'use strict';
const graph=JSON.parse(document.getElementById('graph-data').textContent);
const byId=new Map(graph.nodes.map(n=>[n.id,n]));
const thread=document.getElementById('thread'),section=document.getElementById('section');
const stateNames={open:'未回收',partial:'部分回收',resolved:'已回收',abandoned:'已放弃',unknown:'未确认'};
for(const t of graph.threads){const o=document.createElement('option');o.value=t.id;o.textContent=t.title+' · '+(stateNames[t.status]||t.status);thread.append(o)}
for(const n of graph.nodes.filter(n=>['volume','arc'].includes(n.kind))){const o=document.createElement('option');o.value=n.id;o.textContent=n.title;section.append(o)}
let zoom=1,mode='tree';
const stage=document.querySelector('.stage');
const canvases=[...document.querySelectorAll('.canvas')];
const layouts=new Map();
function show(node){document.getElementById('detail-title').textContent=node.title;document.getElementById('status').textContent=node.kind+' / '+node.claim_kind;document.getElementById('summary').textContent=node.summary||'此节点暂无概述；查看下方记录。';document.getElementById('details').textContent=JSON.stringify(node,null,2)}
document.querySelectorAll('[data-node]').forEach(el=>{el.addEventListener('click',()=>show(byId.get(el.dataset.node)));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(byId.get(el.dataset.node))}})});
function layout(canvas,nodes){
  const pos=new Map(),network=canvas.id==='network-canvas';
  let width=320,height=180;
  if(network&&nodes.length){
    const radius=Math.max(260,nodes.length*42),center=radius+220;
    width=height=center*2;
    nodes.forEach((n,i)=>pos.set(n.id,[center+radius*Math.cos(2*Math.PI*i/nodes.length),center+radius*Math.sin(2*Math.PI*i/nodes.length)]));
  }else if(nodes.length){
    const ids=new Set(nodes.map(n=>n.id)),levels=new Map();
    for(const n of nodes){let depth=0,p=byId.get(n.parent_id);while(p&&ids.has(p.id)){depth++;p=byId.get(p.parent_id)}if(!levels.has(depth))levels.set(depth,[]);levels.get(depth).push(n)}
    width=Math.max(320,...[...levels.values()].map(group=>group.length*240+60));
    for(const [depth,group] of [...levels].sort((a,b)=>a[0]-b[0])){
      group.sort((a,b)=>(pos.get(a.parent_id)?.[0]||0)-(pos.get(b.parent_id)?.[0]||0)||(a.narrative_order||0)-(b.narrative_order||0));
      group.forEach((n,i)=>pos.set(n.id,[(i+.5)*width/group.length,90+depth*170]));
    }
    height=180+Math.max(...levels.keys())*170;
  }
  const svg=canvas.querySelector('svg');
  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
  for(const el of svg.querySelectorAll('[data-node]')){
    const point=pos.get(el.dataset.node);el.style.display=point?'':'none';
    if(!point)continue;
    const [x,y]=point,rect=el.querySelector('rect'),texts=el.querySelectorAll('text');
    rect.setAttribute('x',x-104);rect.setAttribute('y',y-32);
    texts.forEach((text,i)=>{text.setAttribute('x',x);text.setAttribute('y',y+(i?20:-1))});
  }
  svg.querySelectorAll('.structure,.relation').forEach((el,index)=>{
    const a=pos.get(el.dataset.from),b=pos.get(el.dataset.to);
    const relation=el.classList.contains('relation');
    const inThread=!relation||!thread.value||(thread.value!=='__none'&&el.dataset.threads.split(' ').includes(thread.value));
    el.style.display=a&&b&&inThread?'':'none';
    if(!a||!b||!inThread)return;
    const [x1,y1]=a,[x2,y2]=b;
    if(!relation){el.setAttribute('d',`M${x1},${y1+32} C${x1},${y1+85} ${x2},${y2-85} ${x2},${y2-32}`);return}
    const midx=(x1+x2)/2,midy=Math.min(y1,y2)-55-(index%4)*22;
    el.querySelector('path').setAttribute('d',`M${x1},${y1-28} Q${midx},${midy-65} ${x2},${y2-28}`);
    const text=el.querySelector('text');text.setAttribute('x',midx);text.setAttribute('y',midy);
  });
  layouts.set(canvas,{width,height,first:pos.values().next().value});
}
function resizeCanvases(){for(const canvas of canvases){const size=layouts.get(canvas);canvas.style.width=(size.width*zoom)+'px';canvas.style.height=(size.height*zoom)+'px'}}
function focusGraph(){
  const canvas=document.getElementById(mode+'-canvas'),first=layouts.get(canvas).first;
  document.getElementById('empty-state').hidden=!!first;
  stage.scrollLeft=first?Math.max(0,first[0]*zoom-stage.clientWidth/2+20):0;
  stage.scrollTop=first?Math.max(0,first[1]*zoom-stage.clientHeight/2+20):0;
}
function filter(){
  const selected=graph.threads.find(t=>t.id===thread.value),inSection=new Set();
  for(const n of graph.nodes){let p=n;while(p){if(!section.value||p.id===section.value){inSection.add(n.id);break}p=byId.get(p.parent_id)}}
  const visible=new Set([...inSection].filter(id=>!selected||selected.node_ids.includes(id)));
  const treeVisible=new Set(visible);
  // 主线树保留筛选范围内的结构父节点；网络只显示真正选中的成员。
  for(const id of visible){let p=byId.get(byId.get(id).parent_id);while(p&&inSection.has(p.id)){treeVisible.add(p.id);p=byId.get(p.parent_id)}}
  for(const canvas of canvases)layout(canvas,graph.nodes.filter(n=>(canvas.id==='tree-canvas'?treeVisible:visible).has(n.id)));
  resizeCanvases();focusGraph();
  if(selected){document.getElementById('detail-title').textContent=selected.title;document.getElementById('status').textContent=stateNames[selected.status]||selected.status;document.getElementById('summary').textContent=selected.resolution_note||'选择相关节点查看铺垫、推进与回收依据。';document.getElementById('details').textContent=JSON.stringify(selected,null,2)}
}
thread.addEventListener('change',filter);section.addEventListener('change',filter);
for(const name of ['tree','network']){document.getElementById(name).addEventListener('click',()=>{mode=name;for(const other of ['tree','network']){document.getElementById(other+'-canvas').hidden=other!==mode;document.getElementById(other).classList.toggle('active',other===mode)}focusGraph()})}
function setZoom(delta){const old=zoom;zoom=Math.max(.5,Math.min(3,zoom+delta));const x=(stage.scrollLeft+stage.clientWidth/2)/old,y=(stage.scrollTop+stage.clientHeight/2)/old;resizeCanvases();stage.scrollLeft=x*zoom-stage.clientWidth/2;stage.scrollTop=y*zoom-stage.clientHeight/2}
document.getElementById('zoom-in').addEventListener('click',()=>setZoom(.25));document.getElementById('zoom-out').addEventListener('click',()=>setZoom(-.25));
document.getElementById('footer').textContent='离线视图 · '+(graph.graph_id||'未保存图')+' · v'+(graph.revision||'草稿')+' · 完整 JSON 为数据主档';
filter();
</script></body></html>
